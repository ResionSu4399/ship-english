"zh": "图中所示运动部件主要包括活塞、连杆和曲轴，均为柴油机核心部件。根据图示工况，活塞承受压力，连杆同时承受拉应力和压应力，曲轴承受扭转力。"
},
{
"n": 8,
"title": "Look at the illustration and say the type of piston head shape in diesel engine. (See Fig.2-7)",
"en": "Pistons can be divided into two main classes: the crosshead type pistons and the trunk type pistons. The top surface of the crosshead piston can be flat, sunken or convex. The piston shown in the illustration is the crosshead type piston with a sunken surface. It has the advantage of increasing the air turbulence and improving the oil/air mixing quality. Its disadvantage is that the cylinder volumetric clearance will be larger.",
"zh": "活塞主要分为十字头式活塞和筒状活塞两类。十字头活塞顶部可以是平顶、凹顶或凸顶。图中所示为凹顶十字头式活塞，优点是可以增强空气扰动，改善油气混合质量；缺点是气缸余隙容积会更大。"
},
{
"n": 9,
"title": "Look at the illustration and say the types of piston ring. (See Fig.2-8)",
"en": "There are three fundamental functions of the piston rings: to distribute oil film, prevent exhaust gas from giving out and carrying away the heat. The first figure shows a rectangle ring; the second figure shows a ladder-shaped ring; The third figure shows a beveling ring; The fourth figure shows a twist ring; The fifth figure shows a normal worn piston ring.",
"zh": "活塞环有三项基本功能：布油膜、防燃气泄漏、传导热量。图一为矩形环，图二为梯形环，图三为倒角环，图四为扭曲环，图五为正常磨损后的活塞环。"
},
{
"n": 10,
"title": "Please describe the lubricating mode of main engine.",
"en": "Large marine diesel engines of crosshead construction generally have two systems of lubrication: a totally loss system feeding the cylinders and a circulating system lubricating the running gear and cooling the pistons. Oil is supplied to the cylinder liner wall and piston rings by means of mechanical lubricators. The lube oil to the various moving parts enables the formation of an oil film which reduces friction and wear.",
"zh": "大型船用十字头式柴油机一般采用两套润滑系统：气缸注油的全损耗系统，以及润滑运动部件、冷却活塞的循环系统。气缸注油器向气缸套壁面和活塞环供给气缸油；输送到各运动部件的滑油会形成油膜，减小摩擦与磨损。"
},
{
"n": 11,
"title": "Talk about the working principle of purifier according to the picture given. (See Fig.2-9)",
"en": "The removal of impurities and water from fuel oil and lube oil is very important for the good working conditions of the engine. This is achieved by the centrifugal purifier. It consists of an electric motor drive to a vertical shaft on the top of which is mounted the bowl assembly. The high-speed rotation of a purifier can produce a centrifugal force many thousands times larger than the force of gravity. After the bowl is filled with clean water, the dirty oil is admitted into the center of the bowl, passes up through a stack of discs and out through the top. During this process, the action of centrifugal force causes the clean oil to flow inwards and the water and impurities flow outwards. The water and impurities form a sludge, which moves outwards along the undersides of the discs to the periphery of the bowl. The excessive water will flow out through the water outlet and the sludge can be discharged at regular intervals. Thus, the whole process could be continuous.",
"zh": "去除燃油和滑油中的水分与杂质，对保障发动机良好工况至关重要，这项工作由离心式分油机完成。分油机由电机驱动立轴，立轴顶部安装分离筒组件。分油机高速旋转可产生比重力大数千倍的离心力。分离筒内先注满清水，污油从分离筒中心进入，向上流经碟片组后从顶部流出。过程中，离心力使净油向内侧流动，水和杂质向外侧流动；水和杂质形成油泥，沿碟片下表面向分离筒外缘移动，多余水分从出水口排出，油泥可定期排放，整个过程可以连续运行。"
},
{
"n": 12,
"title": "Talk about the working principle of oily water separator according to the picture given. (See Fig.2-10)",
"en": "Oily water separators are used to ensure that ships do not discharge oil when pumping out the bilge water, or oily water from oil tanks or any oil contaminated space. A complete oily water separator is first filled with clean water; the oily water mixture is then pumped through the separator inlet pipe into the coarse separating compartment. Here some oil, as a result of its lower density, will separate and rise into the oil collection space. The remaining oily water mixture now flows down into the fine separating compartment and moves slowly between the catch plates. More oil will separate out onto the underside of these plates and travel outwards until it is free to rise into the oil collecting space. The almost oil-free water passes into the central pipe and leaves the separator unit. When the oil collected in the top of separator reaches the desired level, and then the solenoid v/v will open to lead the oil out to a storage tank.",
"zh": "油水分离器的作用是保障船舶排放舱底水、油舱污水或其他含油污水时不会造成油污染。完整流程为：分离器内先注满清水，含油污水经入口泵入粗分离室，部分密度较小的油在此分离上浮至集油区；剩余污水向下流入细分离室，在集油板之间缓慢流动，更多油滴附着在板底并向外移动，最终上浮至集油区；几乎不含油的水进入中心管，排出分离器。当分离器顶部收集的油达到设定液位时，电磁阀开启，将油排入储油柜。"
},
{
"n": 13,
"title": "Talk about the anti-pollution equipment on board ship.",
"en": "There are usually some anti-pollution equipment on board ships, they are oily water separators, incinerators and sewage treatment plants. Oily water separators are used to ensure that ships do not discharge oil when pumping out bilge water or oily water. The incinerators are used to burn the waste oil and solid sludge. Sewage treatment plants are in use at sea to treat the sewage water which a ship produces. All these equipment perform their duties to prevent pollution from ship to the sea. They must be kept in good order; otherwise we would not pass the PSC inspection.",
"zh": "船上通常配备三类防污染设备：油水分离器、焚烧炉和生活污水处理装置。油水分离器用于保障舱底水等含油污水排放时不含油；焚烧炉用于焚烧废油和固体油泥；生活污水处理装置在航行中处理船舶产生的生活污水。所有设备各司其职，防止船舶造成海洋污染，必须保持良好工况，否则无法通过港口国检查。"
},
{
"n": 14,
"title": "Talk about the operation of ballast system.",
"en": "The ballast system is arranged to draw water from any tank or the sea and discharge it to any other tank or the sea as required to trim the vessel. It is used to ballast or trim the vessel. When transferring ballast water from one tank to another, we must pay much attention. Relative valves are in proper conditions, relative pumps are to be started. The last but is important, we must ask for the permission from the port authorities before discharging ballast water or we’ll be fined.",
"zh": "压载系统可从任意舱柜或海中吸水，按需排入其他舱柜或海中，以此调整船舶浮态，用于压载或调平船舶。舱柜之间驳运压载水时必须谨慎操作，确认相关阀门状态正常，启动对应泵浦。最后也是很重要的一点：排放压载水前必须征得港口当局许可，否则会被罚款。"
},
{
"n": 15,
"title": "Talk about the operation of the bilge system",
"en": "The operation of the bilge system is an important routine work, which takes great care. When it is needed, the following procedures must be strictly observed: (1) Discharge the bilge tanks one by one; (2) Open and close the relevant valves when changing over to another tank according to the operation procedure; (3) Stop pumping out when the bilge tank is nearly empty; (4) Pay attention to the filters and mud-boxes to ensure no clogging occurs; (5) The discharge must meet the relative legislative requirement; (6) The operation must be recorded and reported to chief engineer. The duty engineer should discharge the bilge before handing over a watch. And relief engineer should check the bilge level when taking over a watch.",
"zh": "舱底水系统操作是重要日常工作，必须谨慎执行。需要排放舱底水时，应严格遵守以下流程：第一，逐个排放各舱底水舱；第二，切换舱柜时按操作规程开关对应阀门；第三，舱底水舱接近排空时停止泵排；第四，关注滤器和泥箱，防止堵塞；第五，排放水质必须符合相关法规要求；第六，操作必须做好记录并报告轮机长。值班轮机员交班前应完成舱底水排放，接班轮机员接班时要核查舱底水液位。"
}
]
},
{
"name": "第三章",
"title": "驾机联系",
"items": [
{
"n": 1,
"title": "Communications with officers.",
"en": "In order to ensure the safe navigation of the ship, frequent communication between the engineers and officers is necessary. The usual means of communication is by telephone and telegraph. If the communication between the engine room and the bridge fails, the ship will be endangered. The records of communication should be maintained which will provide evidence in the event of an accident at sea. Noon report is also a good means of communication between the engine room and the bridge.",
"zh": "为保障船舶航行安全，轮机员与驾驶员之间需要频繁沟通。常用通讯方式为电话和车钟。若机舱与驾驶台通讯失效，船舶将陷入危险。通讯记录应当妥善留存，海上发生事故时可作为证据。正午报告也是机舱与驾驶台重要的沟通方式。"
},
{
"n": 2,
"title": "Noon report.",
"en": "During sailing, C/E would read the log book carefully every noon. According to the parameters in log book, he would fill up the engine room noon report. The parameters contain pressure, temperatures, oil consumed and so on. Another noon report would be made by the deck department. These two reports should be exchanged between two departments at noontime.",
"zh": "航行期间，轮机长每天中午都会仔细查阅日志，根据日志参数填写机舱正午报告，内容包括压力、温度、燃油消耗量等。甲板部也会编制正午报告，两份报告于正午时在两部门间交换。"
},
{
"n": 3,
"title": "Take over watch.",
"en": "The taking over engineer should arrive at the engine room 15 minutes before his watch. Then check around the engine room and steering gear room to ensure all the running equipment is in good order. The following parameters must be in correct value: M/E exhaust gas temperature, M/E lube oil sump tank level, pressures and temperatures of lube oil and cooling water systems, and so on.",
"zh": "接班轮机员应提前15 分钟到达机舱，随后巡查机舱和舵机房，确认所有运行设备工况正常。必须核查以下参数是否正常：主机排气温度、主机滑油循环柜液位、滑油与冷却水系统的压力和温度等。"
},
{
"n": 4,
"title": "Hand over watch.",
"en": "At the completion of the watch, each member of watchkeeping should hand over to his relief, ensuring that the relief is competent to take over and carry out his duties effectively. Before going off duty, the engineer in charge of the watch shall ensure that all events related to the main and auxiliary machinery are suitably recorded. He should tell the relieving engineer the standing orders , special instructions and unfinished work, if any. If he has any reason to believe that the relieving engineer is not capable of carrying out the watchkeeping duties effectively, he shall not hand over the watch and the chief engineer shall be notified.",
"zh": "值班结束时，值班人员应向接班人员交班，确认接班人员能够胜任并有效履行职责。下班前，值班轮机员应确保主辅机相关事项都已规范记录，向接班人员说明常规指令、特殊指示以及未完成工作。若有理由认为接班人员无法有效履行值班职责，则不应交班，并通知轮机长。"
},
{
"n": 5,
"title": "Standby engine before departure.",
"en": "After this order is given from bridge, the following work should be done one by one: Check main engine telegraph and ship’s clock; Test the steering gear operation; Start another generator and put in use; Start all necessary pumps; Put in turning gear and let it run about half an hour; Drain water from air receiver.",
"zh": "驾驶台下达开航备车指令后，需依次完成以下工作：核对主机车钟与船钟；试验舵机运转；启动另一台发电机并网投入使用；启动所有必要泵浦；合上盘车机，盘车约半小时；排放空气瓶残水。"
},
{
"n": 1,
"title": "When do you begin standing by engine? 2) How do you stand by engine? After the order is given from",
"en": "bridge, the following work should be done. Start more generators and put in use; Change M/E control system from remote to engine room; Change fuel oil to diesel oil; Stop fresh water generator; Put donkey boiler to auto position; Operate M/E as bridge required.",
"zh": "驾驶台下达指令后开始备车，需完成以下工作：启动更多发电机并网使用；将主机控制系统由遥控切换为机舱就地控制；将燃油切换为柴油；停止造水机；将辅锅炉调至自动模式；按照驾驶台要求操纵主机。"
},
{
"n": 7,
"title": "Measures to be taken by duty engineers at rough sea.",
"en": "At rough sea, the M/E R.P.M. should be reduced to a safety value. Fuel oil filters and lube oil filters should be cleaned in time. All moving parts must be tightened. M/E system parameters should be kept in correct value, such as the exhaust gas temperature, lube oil temperature and pressure, cooling water temperature and pressure and so on.",
"zh": "大风浪天气时，应将主机转速降至安全值；及时清洁燃油滤器和滑油滤器；紧固所有运动部件；维持主机系统参数正常，包括排气温度、滑油温度与压力、冷却水温度与压力等。"
},
{
"n": 8,
"title": "Action to be taken after “Finish with engine”.",
"en": "After this order is given, the following work should be carried out: Ensure the telegraph at stop position, the starting air lever at neutral position, the fuel control lever at zero, the turning gear engaged. Stop M/E lube oil pump 20 minutes later.",
"zh": "接到完车指令后，执行以下操作：确认车钟在停车位置、启动空气手柄在中位、燃油操纵杆归零，合上盘车机；20 分钟后停止主机滑油泵。"
},
{
"n": 9,
"title": "Talk about the steering gear testing.",
"en": "As we know, every time before sailing, steering gear must be tested. After the feed oil pump is started, the duty officer from bridge operates the steering gear at different degrees. Each time, the duty engineer can read out the degree from steering gear room, and the degree should have no difference with bridge degree.",
"zh": "众所周知，每次开航前必须试验舵机。启动舵机油泵后，驾驶台值班驾驶员操作舵机转到不同角度，值班轮机员在舵机房核对舵角读数，应与驾驶台显示角度一致。"
},
{
"n": 10,
"title": "Actions to be taken in the case of the trial of main engine.",
"en": "Before the trial of main engine, the duty engineer should correct the clock and telegraph with the duty officer on bridge and do the followings: Keep the oils and water’s temperature and pressure at a working value; Put in the turning gear, give the main engine at least one complete run to ensure that there’s no water flows from the indicator cock, every moving parts move freely, and at the same time, hand operate the cylinder lubricators, then take out the turning gear. Open or close the relative valves; Pump up the starting air reservoirs to their max pressure; Check all hand-oil and grease-lubricated bearings to ensure their lubricant is correct. Check the reversing and control gear; Turn on the main engine by putting in starting air and give a brief trial on power ahead and astern. At last, the duty engineer should ring “stand –by” on the engine telegraph.",
"zh": "主机试车前，值班轮机员应与驾驶台值班驾驶员对时、对车钟，并完成以下工作：保持油、水的温度与压力处于工作值；合上盘车机，至少盘车一整圈，确认示功阀无水流出、所有运动部件运转灵活，同时手动操作气缸注油器，之后脱开盘车机；开关对应阀门；将空气瓶充气至最高压力；检查所有手动注油和油脂润滑轴承，确认润滑正常；检查换向机构与控制机构；通入启动空气启动主机，进行短暂正倒车负荷试验；最后值班轮机员扳动车钟至“备车”位置。"
},
{
"n": 11,
"title": "Talk about Engine Room Orders",
"en": "Any engine order given should be repeated by the person operating the bridge telegraph and the engineer on watch should ensure the order is carried out correctly and immediately. The engine orders include: Stand by engines; Finished with engines; Stop engine; Full ahead; Half ahead; Slow ahead; Dead slow ahead; Full astern; Half astern; Slow astern; Dead slow astern; Emergency full ahead; Emergency full astern. Where thrusters are used, the following orders are used: Bow thrust full / half to port side; Bow thrust full / half to starboard side; Stern thrust full / half to port side; Stern thrust full / half to starboard side; Bow / stern thrust stop.",
"zh": "驾驶台车钟操作人员收到任何车钟指令都应复诵，值班轮机员确保指令准确、立即执行。车钟指令包括：备车、完车、停车、全速前进、半速前进、慢速前进、微速前进、全速倒车、半速倒车、慢速倒车、微速倒车、紧急全速前进、紧急全速倒车。配备侧推器的船舶，还有以下指令：艏侧推全/半速左舷、艏侧推全/半速右舷、艉侧推全/半速左舷、艉侧推全/半速右舷、艏/艉侧推停止。"
},
{
"n": 12,
"title": "Talk about the telegraph in the engine room",
"en": "The telegraph of the engine room is very important on board the ship. The engineer can communicate with the bridge through the telegraph. It is usually used when the ships goes into the port or out of the port. The bridge can give an order through the telegraph. On the telegraph, two directions are shown, that is, ahead and astern, and between them is the stop position. Every time before sailing, this telegraph must be checked. It should have no difference with the bridge telegraph.",
"zh": "机舱车钟是船上非常重要的设备，轮机员通过车钟与驾驶台通讯，通常在船舶进出港时使用。驾驶台通过车钟下达指令，车钟上标注前进、倒车两个方向，中间为停车位置。每次开航前必须核查车钟，确保与驾驶台车钟指示一致。"
}
]
},
{
"name": "第四章",
"title": "应急用语",
"items": [
{
"n": 1,
"title": "Describe briefly one of the main engine breakdown cases that you experienced or heard.",
"en": "Last year when I worked on a bulk carrier, I found the exhaust temperature of the main engine is rising quickly. There was a fire in the scavenge air box. The engine was slowed down. The fuel was shut off from the affected cylinders. I opened widely the inlet valve of the cooling water. The duty motorman increased the cylinder lubrication. The fire quickly burnt out. I think the measure was correct and finally the main engine recovered.",
"zh": "去年我在一艘散货船工作时，发现主机排气温度快速升高，扫气箱发生着火。我们降低主机转速，切断故障缸燃油供给，开大冷却水进口阀，值班机工加大气缸注油量，火情很快熄灭。我认为处置措施正确，主机最终恢复正常。"
},
{
"n": 3,
"title": "Actions to be taken in the event of the turbocharger surge.",
"en": "If the turbocharger surges, the possible causes include high back pressure of exhaust manifold and low flowing quantity, rapid change in load, insufficient fuel oil, bad combustion, scavenge fire and so on. In the event of turbocharger surge, we will slow down the main engine, find the causes, and do some remedies.",
"zh": "增压器发生喘振，可能原因包括排气总管背压高、流量低，负荷突变，燃油不足，燃烧不良，扫气箱着火等。发生喘振时，应降低主机转速，查明原因并采取修复措施。"
},
{
"n": 4,
"title": "Notices to be taken when the main engine running with one cylinder being cut off.",
"en": "When the M/E is running with one cylinder being cut off, the M/E speed and load should be reduced to avoid other cylinders becoming overload. Special attention should be paid to the exhaust temperature of the remaining cylinders. It cannot exceed normal full load temperatures. If the turbocharger surges, reduce the load further to avoid continuous surging.",
"zh": "主机单缸停油运行时，应降低转速和负荷，防止其余气缸过载；重点关注其余气缸的排气温度，不得超过正常满负荷温度；若增压器发生喘振，需进一步降负荷，避免持续喘振。"
},
{
"n": 5,
"title": "Actions to be taken when scavenge fire occurs.",
"en": "If a scavenge fire occurs, the following actions should be taken at once: Report it to the bridge (captain). If there is a small fire: (1) slow down the engine; (2) cut off fuel supply; (3) increase cylinder lubrication; (4) close all the scavenge drains. If there is a big fire, the engine must be stopped.",
"zh": "发生扫气箱着火时，应立即采取以下措施：报告驾驶台（船长）。若火情较小：降低主机转速、切断该缸燃油供给、加大气缸注油、关闭所有扫气放残阀。若火情严重，必须停主机。"
},
{
"n": 6,
"title": "Actions to be taken when a crankcase explosion occurs.",
"en": "If a crankcase explosion occurs, the following actions should be taken at once: (1) report to the bridge (captain); (2) stop the engine; (3) stop fuel oil primary pump; (4) stop lubricating oil pump; (5) cut off starting air; (6) engage turning gear.",
"zh": "发生曲轴箱爆炸时，应立即采取以下措施：报告驾驶台（船长）；停主机；停燃油主泵；停滑油泵；切断启动空气；合上盘车机。"
},
{
"n": 1,
"title": "the case. 2) actions taken in that case. 3) your comments as to the actions. One day, our ship suddenly",
"en": "blacked out while at sea, luckily the state of sea was good, we dealt with it. The engineer took the following actions at once: (1) inform the bridge; (2) start up the standby generator; (3) supply the power; (4) restore the switch of automatic trip. The actions are in time and correct.",
"zh": "有一天我船航行途中突发全船失电，所幸海况良好，我们顺利处置。轮机员立即采取了以下行动：通知驾驶台；启动备用发电机；恢复供电；复位自动跳闸开关。处置及时、措施正确。"
},
{
"n": 8,
"title": "Describe the procedure to start an emergency generator.",
"en": "When we start the emergency generator, we should take the following steps. First, check the lube oil and fuel oil levels, as well as the water level. Second, the selecting switch will change over from “automatic” to “manual”. Third, push the starting button, and check the voltage and frequency.",
"zh": "启动应急发电机应按以下步骤操作：第一，检查滑油油位、燃油油位以及水位；第二，将选择开关从“自动”切换至“手动”；第三，按下启动按钮，检查电压与频率。"
},
{
"n": 9,
"title": "Describe the maintenance work of emergency battery.",
"en": "The maintenance work of emergency battery include: 1) check the electrolyte level. 2) keep the emergency battery clean. 3) measure the voltage of the battery. 4) measure the specific gravity of the electrolyte. 5) periodically charge and discharge the battery so as to protect the plate electrode.",
"zh": "应急蓄电池的维护工作包括：检查电解液液位；保持蓄电池清洁；测量电池电压；测量电解液比重；定期对电池进行充放电，保护极板。"
},
{
"n": 11,
"title": "Talk about fire fighting equipment on board.",
"en": "There is a lot of fire fighting equipment on board, including: fire pump, emergency fire pumps, fire main pipes, fire hoses, hydrant, portable extinguishers and fixed installation. There are many types of portable extinguishers used on board ship. Soda-acid extinguishers are useful on carbonaceous fires. The chemical foam extinguishers can be used to deal with the oil fires. Carbon dioxide extinguishers are suitable to put out electrical fire, and dry powder extinguishers are very useful on chemical fires. It is important to keep the fire fighting equipment in good order and ready for use.",
"zh": "船上配备大量消防设备，包括消防泵、应急消防泵、消防总管、消防水带、消防栓、手提式灭火器以及固定式灭火装置。手提灭火器分为多种类型：酸碱灭火器适用于固体可燃物火灾；化学泡沫灭火器可扑救油类火灾；二氧化碳灭火器适合扑救电器火灾；干粉灭火器适用于化学品火灾。保持消防设备工况良好、随时可用至关重要。"
},
{
"n": 12,
"title": "Talk about fire.",
"en": "Fire is a constant hazard at sea. It is the result of a combination of three factors, namely, inflammable material, hot spot, and oxygen. If we remove anyone of the three elements, the fire will be put out. According to the material involved, fires can be divided into four classes. For example, burning light metals will be classified as Class D, burning electric equipment classified as Class C, burning oils is Class B, and burning wood, Class A.",
"zh": "火灾是海上持续存在的风险，由可燃物、高温热源、氧气三要素共同引发。移除三要素中任意一项，火就会熄灭。按燃烧物质划分，火灾分为四类：轻金属燃烧为D 类火，电器设备燃烧为C 类火，油类燃烧为B 类火，木材燃烧为A 类火。"
},
{
"n": 13,
"title": "Talk about a fire fighting drill.",
"en": "A fire fighting drill should be held once a month under normal condition for a ship. It includes the following action: (1) someone finds the fire and reports to the bridge at once; (2) the bridge gives the fire alarm; (3) all crew determine the fire position and go to the location; (4) start the fire pump and establish flow to the fire main. Every crew member shall be aware of the importance of a fire fighting drill.",
"zh": "正常情况下，船舶每月举行一次消防演习，流程如下：有人发现火情立即报告驾驶台；驾驶台发出火灾警报；全体船员确认火灾位置并赶赴现场；启动消防泵，向消防总管供水。全体船员都应知晓消防演习的重要性。"
},
{
"n": 14,
"title": "Actions to be taken when a fire occurs in the engine room.",
"en": "If a fire occurs, the following actions should be taken at once. (1) report to the bridge and chief engineer and push the alarm button; (2) close the ventilation doors; (3) shut off the electric power; (4) identify the fire source; (5) put out the fire by portable extinguisher, (6) check the number of the engine crew; (7) let out carbon dioxide.",
"zh": "机舱发生火灾时，应立即采取以下措施：报告驾驶台和轮机长，按下报警按钮；关闭通风门；切断电源；查明火源；用手提灭火器灭火；清点机舱人员数量；施放二氧化碳。"
},
{
"n": 1,
"title": "the case. 2) actions taken in that case. 3) your comments as to the actions. Someday, a ship collided with",
"en": "another ship. The former’s anchor had pierced the latter’s peak tank. The chief engineer sent someone to cut off the anchor chains immediately. At the same time, the ship was listing severely, so they pumped some water to the port ballast tank. The measure was right. At last, they were safe.",
"zh": "曾有两船发生碰撞，其中一艘船的锚刺穿了另一艘的艏尖舱。轮机长立即派人切断锚链，同时船舶严重倾斜，他们向左舷压载舱泵水平衡。处置措施正确，最终人员船舶均安全。"
},
{
"n": 16,
"title": "Actions to be taken in the event of collision.",
"en": "If collision occurs, the following actions should be taken at once. (1) Stand by the engine; (2) cut off electric power, oil, water and air near the accident place; (3) carry out Captain’s order.",
"zh": "发生碰撞时，应立即采取以下措施：主机备车；切断事故区域附近的电源、油、水和气源；执行船长命令。"
},
{
"n": 17,
"title": "Talk about the on-board communication in the event of collision.",
"en": "In the event of collision, the bridge will inform the captain and the engine room immediately. The bridge should tell the engine room the striking position, damage extent and so on. The engine room should take measures accordingly. In case of engine room flooding, the engine room personnel should report to the bridge, and take actions according to the muster list.",
"zh": "发生碰撞时，驾驶台立即通知船长和机舱，告知碰撞位置、破损程度等信息；机舱根据指令采取对应措施。若机舱进水，机舱人员应向驾驶台报告，并按应变部署表行动。"
},
{
"n": 1,
"title": "the case. 2) actions taken in that case. 3) your comments as to the actions. (1) Report to the bridge",
"en": "(Captain); (2) slow down the M/E; (3) close watertight doors; (4) open the emergency valve; (5) start seawater pump; (6) discharge some water overboard.",
"zh": "船舶发生进水事故时，处置流程如下：报告驾驶台（船长）；降低主机转速；关闭水密门；打开应急阀；启动海水泵；将部分积水排出舷外。"
},
{
"n": 19,
"title": "Actions to be taken in the event of flooding.",
"en": "(1) Report to the bridge (Captain); (2) slow down the M/E; (3) close watertight doors; (4) open the emergency valve; (5) start seawater pump; (6) discharge some water overboard.",
"zh": "发生进水时，应采取以下措施：报告驾驶台（船长）；降低主机转速；关闭水密门；打开应急阀；启动海水泵；将积水排出舷外。"
},
{
"n": 20,
"title": "Talk about the Muster list.",
"en": "The muster list is an important document on board. It tells the crew members their position and duties in emergency situations, such as fire, collision, oil spill, abandoning ship, ship grounding and so on. For example, in case of flooding, the chief engineer should go to the engine room and be in general command. The second engineer should maneuver the main engine. Some other members should go to stop the flooding and so on.",
"zh": "应变部署表是船上重要文件，明确船员在火灾、碰撞、溢油、弃船、搁浅等应急场景下的岗位与职责。例如发生进水时，轮机长前往机舱总指挥，大管轮操纵主机，其他人员负责堵漏排水等。"
},
{
"n": 21,
"title": "Describe briefly one of the cases that you experienced or heard about evacuating from the engine",
"en": "room. Once a container ship collided with a bulk carrier, the captain of the container ship decided to abandon the ship since it was in danger of sinking. The engine room personnel stopped the engine, cut off the electric supply, closed the ventilators, released the compressed air and steam. The chief engineer collected the important documents and all engine room staff evacuated from the engine room.",
"zh": "曾有一艘集装箱船与散货船相撞，集装箱船有沉没风险，船长下令弃船。机舱人员关停主机、切断电源、关闭通风、释放压缩空气与蒸汽，轮机长收好重要文件，全体机舱人员撤离机舱。"
},
{

"title": "How often shall an abandon ship drill be conducted? 2) actions taken in that case. 3) your comments as",

"zh": "弃船演习流程包括：启动应急发电机；关停锅炉；切断燃油供给；关闭通风、舱门等；关闭水密门；释放救生艇。正常船舶每月举行一次弃船演习。"
},
{
"n": 23,
"title": "Talk about the maintenance work of the lifeboat engine.",
"en": "The maintenance work of the lifeboat engine mainly include: 1) check the various oil levels and water levels. 2) start the lifeboat engine once every week, make it run for about five minutes. 3) protect the engine from freezing with anti-freezing fluid.",
"zh": "救生艇发动机的维护工作主要包括：检查各类油位与水位；每周启动一次救生艇发动机，运转约五分钟；加注防冻液防止冻损。"
},
{
"n": 24,
"title": "Talk about the SOPEP.",
"en": "SOPEP stands for Shipboard Oil Pollution Emergency Plan. Its main contents include the person to be contacted in case of oil spill, his contacting methods such as phone number and address, the procedure to be adopted in case of oil spill, such as the disposal methods, anti-pollution equipment and materials.",
"zh": "SOPEP 即《船上油污应急计划》，主要内容包括：溢油事故联系人及电话、地址等联系方式，溢油处置流程，例如处理方法、防污染设备与物资等。"
},
{
"n": 25,
"title": "Talk about some material used for oil spillage.",
"en": "The materials used for oil spillage mainly include the following: 1) the material used for cleaning up spilled oil, for example, the oil absorbent such as saw dust and oil felt.2)The material for preventing split oil from spreading out, such as oil booms. Oil dispersant is seldom used since it must get the approval from the port administration and may cause secondary pollution.",
"zh": "溢油应急物资主要包括两类：一是清油物资，例如锯末、吸油毡等吸油材料；二是围控物资，例如围油栏，用于防止溢油扩散。消油剂很少使用，因为必须获得港口当局批准，且可能造成二次污染。"
},
{
"n": 1,
"title": "the case. 2) actions taken in that case. 3) your comments as to the actions. (1) Report it to the bridge",

"zh": "发生溢油事故时，应采取以下措施：报告驾驶台（船长）；停止泵油作业；堵塞所有甲板排水孔；收集溢油；准备消油剂；准备吸油材料；准备接油容器；准备灭火器。"
},
{
"n": 27,
"title": "Talk about the actions to be taken in the event of a man falling overboard.",
"en": "In the event of a man falling overboard, the person who sees the accident must shout for help, inform the bridge, throw a lifebuoy into the water and keep the man in his visual scope. The bridge should sound the alarm, and take measures to save the man, for example, slowing down, changing the direction, and lowering the lifeboat to pick up the man falling overboard.",
"zh": "发现人员落水时，目击者必须大声呼救、通知驾驶台，抛下救生圈，保持落水人员在视线范围内。驾驶台应发出警报，采取施救措施，例如减速、转向、放下救生艇营救落水人员。"
},
{
"n": 28,
"title": "Talk about the first aid.",
"en": "First aid is emergency care for a victim of sudden illness or injury until more skillful medical treatment is available. The usual actions taken in the first aid include artificial breathing, stopping bleeding with bandage and so on. Once I saw a sailor who had his hand injured during the firefighting drill. I immediately help him stop the bleeding with the medicine and the bandage.",
"zh": "急救是对突发伤病人员在专业医疗救治前采取的紧急救护，常规操作包括人工呼吸、绷带止血等。有一次消防演习中一名水手手部受伤，我立刻用药品和绷带帮他止血。"
},
{
"n": 29,
"title": "Safety measures to be taken when working in engine room",
"en": "(1) Remember the safety principle; (2) wear work clothes and shoes, safety helmet and so on; (3) no smoking; (4) be familiar with emergency equipment; (5) be familiar with fire fighting equipment; (6) put the oily water cloth in the covered metal box etc.",
"zh": "机舱作业安全措施包括：牢记安全原则；穿戴工作服、工作鞋，佩戴安全帽等；严禁吸烟；熟悉应急设备；熟悉消防设备；含油抹布放入带盖金属箱。"
}

{
"n": 1,
"title": "Talk with the workers on oil barge.",
"en": "When the oil barge gets alongside our ship, the Third engineer should come down to the oil barge. He should take sounding of the oil content with the workers in the oil barge. And talk about the signals to start and stop bunkering, and how to deal with some emergency conditions. He should make the valves correctly opened. During bunkering, the Third Engineer should arrange motorman to take sounding of the oil level. After bunkering, the Third Engineer should measure the oil tank in our ship and in the oil barge again to calculate the oil quantity.",
"zh": "加油驳船靠泊后，二管轮到驳船上，与驳船工作人员共同测量油舱液位，商定加油启停信号以及应急处置方式，确认阀门正确开启。加油过程中，二管轮安排机工定时测量油位。加油结束后，二管轮再次测量本船与驳船油舱液位，核算加油量。"
},
{
"n": 2,
"title": "Please describe a bunkering operation on board your ship.",
"en": "When selecting the fuel oil, there are many factors to consider, such as viscosity, cetane number, calorific value and so on. Before bunkering, the engine room personnel should make the bunkering plan and other necessary preparations. The third engineer will go to the oil lighter to measure the content of all the oil tanks. During bunkering, the engine department and deck department should work cooperatively. After bunkering, the crew will flush the oil retained in the hoses with compressed air and calculate the volume of oil received.",
"zh": "选用燃油时需要考虑多项指标，例如粘度、十六烷值、热值等。加油前，机舱人员制定加油计划并做好各项准备，二管轮到加油驳船测量所有油舱存量。加油过程中，轮机部与甲板部协同作业。加油结束后，船员用压缩空气吹净软管内残留燃油，核算实际受油量。"
},
{
"n": 3,
"title": "The voyage repair.",
"en": "During last voyage, a ballast pipe found leakage in No.2 F.O. tank due to corrosion. It cause great trouble and we cannot repair the pipe by ourselves. So yesterday we came into the shipyard for voyage repair. Before arrival, we have pumped out all the content of the oil tank and opened all doors for ventilation. Because of our good preparation, the repair work immediately began after alongside. The workers tested the oil vapor content first. After confirmed it was in the safety range, the workers entered into the tank and began to disconnect the damaged pipes. It was a difficult job and really took time. At last, the workers had to remove the flange bolts by gas cutting. The new pipe will be assembled in about 3 hours, after that we’ll carry out a ballast test to inspect the repair quality. If the result could meet our satisfaction, we’ll leave the shipyard this afternoon to continue our voyage.",
"zh": "上一个航次，2 号燃油舱内一根压载管因腐蚀发生泄漏，故障影响较大，船上无法自行修理，因此我们昨日进厂航修。到港前我们已排空油舱存油，打开所有舱门通风。由于准备充分，靠泊后修理工作立即展开。工人先检测舱内油气浓度，确认处于安全范围后进入舱内，开始拆卸破损管路。这项工作难度大、耗时长，最后工人用气割拆除了法兰螺栓。新管路约3 小时后安装完毕，之后我们将进行压水试验检验修理质量，若结果合格，今日下午离厂续航。"
},
{
"n": 4,
"title": "The work before repair.",
"en": "Before repair, the engine room personnel have a lot of work to do. They should confirm which items in their charge are to be repaired. They will prepare the necessary spare parts and special tools. Then the second engineer will collect all the information about the repair items. After being verified by the chief engineer and signed by the captain, the repair list will be submitted to the company for approval.",
"zh": "修理前，机舱人员有大量准备工作：确认各自负责的修理项目，准备必要备件与专用工具；大管轮汇总所有修理项目信息；修理单经轮机长审核、船长签字后，上报公司审批。"
},
{
"n": 5,
"title": "Talk about the safety measurements during ship repair in shipyard.",
"en": "When a ship is in shipyard for repair, the ship and shipyard must hold a meeting and make a safety decision. Crew must keep good cooperation with shipyard workers and obey the safety decision. Ship must arrange for safetymen to assist the shipyard safetymen, esp. during gas welding. Smoking is only permitted in smoking-room. Crew on duty must carefully check and receive the repair item. If ship is on fire, crew must hold their duties to protect ship’s safety and obey shipyard’s command.",
"zh": "船舶进厂修理期间，船方与厂方必须召开会议，明确安全规定。船员需与船厂工人良好配合，遵守安全规定；船上安排安全员配合船厂安全员，尤其是气焊作业期间；仅可在吸烟室吸烟；值班船员认真验收修理项目；若发生火情，船员须坚守岗位保障船舶安全，服从船厂指挥。"
},
{
"n": 6,
"title": "Talk about the dock repair.",
"en": "The ocean-going vessels generally have to be dry-docked every 2 or 3 years. (1) Before dock repair, the repair list should be made out and sent to the company. The spare parts and stores should also be prepared. (2) When dock repair, the main repair items are as follows: the tailshaft should be withdrawn. The tailshaft and its sealing arrangement should be carefully checked and repaired if damage is found. The propeller should be polished and checked. The sea inlet and outlet valves should be ground off and applied with anti-corrosive paint. (3) During dock repair, the engineer in charge should carefully check and accept the repair items.",
"zh": "远洋船舶一般每2 至3 年进干船坞一次。坞修前：编制修理单上报公司，备好备件与物料。坞修期间主要修理项目：抽出尾轴，仔细检查尾轴及密封装置，损坏处予以修复；清洁检查螺旋桨；研磨海水进出口阀并涂刷防腐漆。坞修全程，主管轮机员要认真验收修理项目。"
},
{
"n": 7,
"title": "As a chief Engineer, what will you take into consideration if you want to receive a new ship?",
"en": "As a chief engineer, if I want to receive a new ship, I will take the following items into consideration. First, check the list of engine room equipment and machinery, as well as the list of stores and spare parts. Second, test all the devices in the engine room. Third, conduct the sea trial, collect and submit all the items of non-conformity to the company.",
"zh": "作为轮机长，接新船时我会重点关注三方面：第一，核查机舱设备清单、物料与备件清单；第二，试验机舱所有设备；第三，参与海上试航，收集所有不符合项并上报公司。"
},
{
"n": 8,
"title": "Please talk about a damage survey on board your ship.",
"en": "Last voyage, we encountered bad weather. After that, we checked all the equipments and found the port windlass was damaged by heavy sea. The Captain sent a telegraph to company to request a voyage repair, and also ask for a surveyor for damage survey. Yesterday, after we got alongside, the surveyor from the Classification Society came on board together with the shipboard workers. The surveyor inspected the windlass thoroughly, verified the damage range, extent and reasons, as well as the effect on safe sailing, repairing extent and repair cost. After the inspection, the surveyor issued a survey report.",
"zh": "上一航次我们遭遇恶劣天气，事后检查设备发现左舷锚机被大浪打坏。船长发电报向公司申请航修，同时申请验船师做损坏检验。昨日靠泊后，船级社验船师与船厂人员一同登船，对锚机做全面检验，确认损坏范围、程度、原因，以及对航行安全的影响、修理范围和费用，检验后出具了检验报告。"
},
{
"n": 9,
"title": "Talk about an accident occurring in engine room.",
"en": "This morning an accident happened in engine room. At that time, ship is in port. The first engineer arranged for the Chief Motorman and Oiler A to check the main engine inner parts. After opening the crankcase access doors, the Chief Motorman went down the crankcase. He did not hold the engine frame firmly and slipped into the crankcase. His left leg was injured. The Oiler A reported it at once and the Second Officer gave him an injection to kill the pain. Now, the Chief motorman has been sent to hospital. A safety meeting had been held on board after that.",
"zh": "今日上午港口期间，机舱发生一起事故。大管轮安排机工长和机工甲检查主机内部，打开曲轴箱道门后，机工长进入曲轴箱，没抓牢机架失足滑落，左腿受伤。机工甲立即上报，二副为他注射了止痛针。目前机工长已送医，船上事后召开了安全会议。"
},
{
"n": 10,
"title": "Talk with a ship-chandler.",
"en": "When I talk with a shipchandler, first I will say hello to him and then ask him some questions about his name, his stores and so on. Then I will give him the order list and ask him whether they are available. Usually we will bargain about the price and I will ask for some discount. At last we should set the time to deliver the spare parts and stores on board. I will also require him to deliver them on time; otherwise he should be responsible for it.",
"zh": "和船舶供应商沟通时，我先问好，询问对方姓名、供应品类等信息；然后递交订货单，确认是否有货；一般会商谈价格，争取折扣；最后商定备件物料送船时间，要求对方按时送达，否则承担相应责任。"
},
{
"n": 11,
"title": "How do you order stores and spare parts?",
"en": "When we want to order stores and spare parts, we’ll keep in touch with a ship-chandler. We’ll give him an order list first. In the order list, we’ll state clearly the stores and spare parts’ specification, type, quantity and the delivery time. When the ship-chandler comes on board, we’ll talk about the price of the stores and spare parts. Ask him to make the price as cheap as possible. And ask them to give us the discount as much as possible. As a rule, they should give us a 10 percent discount.",
"zh": "订购物料备件时，我们联系船舶供应商，先发送订货单，单上明确物料备件的规格、型号、数量和交货时间。供应商登船后商谈价格，争取尽可能低价和折扣，通常可享受10%的折扣。"
},
{
"n": 12,
"title": "Talk about the management of spare parts.",
"en": "Spare parts management is a very important work on board. It directly affects the ship’s safety, so every officer in charge must know how to manage the spare parts. (1) Generally, the ship applies for spare parts every 3 months. If in emergency situation, requisition can be carried out at once. Requiring spare parts must remark name, model, factory, quantity and so on. (2) Spare parts on board must be recorded correctly, such as name, model, quantity, application, use, check and so on. Many modern ships use computers to enter all the data of the spare parts in time. It would control spare parts on ship and on shore.",
"zh": "备件管理是船上非常重要的工作，直接影响船舶安全，每位主管轮机员都必须掌握。第一，船舶通常每三个月申请一次备件，紧急情况可即时申领；申请备件必须注明名称、型号、厂家、数量等信息。第二，船上备件需准确登记名称、型号、数量、用途、使用、检查等记录；很多现代船舶用电脑实时录入备件数据，实现船岸备件管控。"
},
{
"n": 13,
"title": "Talk about the management of ship’s stores.",
"en": "Store is necessary for a ship in service. Each ship must keep enough stores, such as waste rags, waste cotton, materials etc. (1) Usually, request for stores happens every half a year. The officer in charge should make store order list according to the ship stores catalogue. When the stores ordered are delivered on board, the person in charge must make a careful check and then receive them. (2) Whoever takes something out from the storeroom, he should write all the data in the notebook. During routine work, waste must be avoided. (3) As to the chemicals, which are dangerous material, crew must carefully keep and use them. At the same time, pollution must be prohibited.",
"zh": "物料是船舶运营的必需品，每艘船都需储备足够物料，例如抹布、棉纱、各类材料等。第一，通常每半年申请一次物料，主管人员按船舶物料目录编制订货单；物料送船后，负责人仔细验收后签收。第二，从库房领取物料都要登记在册，日常工作中厉行节约、避免浪费。第三，化学品属于危险品，船员必须妥善保管和使用，同时严禁造成污染。"
}
]
},
{
"name": "第六章",
"title": "PSC/ISM检查用语",
"items": [
{
"n": 1,
"title": "How do you prevent pollution to the sea on board your ship?",
"en": "When the ship is at sea or port, oily water from the ship, for example, bilge water, sewage water and so on, will cause sea pollution and then all oily mixture is not allowed to be discharged directly. All ocean going ships must have a lot of anti-pollution equipment on board, such as oily water separator, incinerator and so on. The general methods of pollution prevention on board ship are as follows: the oily mixture or sludge in the engine room should be kept in the bilge collecting tank or sludge tank or burnt by ship’s incinerator or the oily water should be cleaned with oily water separator. At last we must keep pollution prevention at sea on board ship. We should collect plastic products in a special barrel and send them ashore when the vessel gets alongside a pier.",
"zh": "船舶无论在航还是在港，舱底水、生活污水等含油污水都会造成海洋污染，所有含油混合物均禁止直接排放。所有远洋船舶必须配备油水分离器、焚烧炉等防污染设备。船上防污染通用做法：机舱含油混合物或油渣存入污油柜或油渣柜，或送入焚烧炉焚烧，或经油水分离器处理后排放。船上始终要做好海洋防污染工作，塑料制品要收集在专用桶内，靠港后移交岸上处理。"
},
{
"n": 2,
"title": "Talk about the entries of the Oil Record Book.",
"en": "The ship has an Oil Record Book. Oil Record Book part I shall be provided to every oil tanker of 150 tons gross tonnage and above and every ship of 400 tons gross tonnage and above to record the machinery space operations. For oil tankers, Oil Record Book part II shall also be provided to record relevant cargo/ballast operations. When making entries in the Oil Record Book, the date, operation code and item number shall be inserted in the appropriate columns and the required particulars should be recorded chronologically in the blank spaces.",
"zh": "船上配有油类记录簿。150 总吨及以上油船、400 总吨及以上其他船舶，应配备油类记录簿第一部分，记录机舱作业情况；油船还需配备第二部分，记录货油/压载相关作业。填写油类记录簿时，日期、作业代码、项目编号填入对应栏，详细内容按时间顺序记录在空白处。"
},
{
"n": 3,
"title": "Talk about the treatments of dirty waste and rags, especially plastic waste on board your ship.",
"en": "The garbage on board is treated according to its sort. (1) All garbage must be collected and stored in the color barrels. (2) All plastic must be kept in the red barrel. The disposal of plastic oversea is prohibited. It must be sent ashore for treatment. Food waste should be kept in the green barrel and disposed oversea after being broken into pieces according to the relevant conventions. (3) The oily rags should be burnt out in the incinerator.",
"zh": "船上垃圾分类处理：第一，所有垃圾收集并存放在分类色桶中。第二，塑料制品全部存入红色桶，严禁投弃入海，必须送岸处理；厨余垃圾存入绿色桶，按相关公约粉碎后可在海上排放。第三，含油抹布送入焚烧炉焚烧。"
},
{
"n": 4,
"title": "Please talk about a PSC inspection on board.",
"en": "PSC stands for port state control. Its purpose is to maintain the ship’s safety, prevent pollution and fire. The ships will be inspected by the marine authority inspection officers (PSC officers) when ships arrive at the port, especially for those which have not been inspected in the last six months. The officers not only inspect the emergency and safety equipment, fire fighting devices, but also inspect any equipment that they want, for example, the main engine, the auxiliary machinery and remote control, etc. Different authorities have different inspection methods. Among them, USCG (United States Coast Guard) lays emphasis on the oil pollution prevention equipment, crew’s capability (especially that in fire fighting and life saving activities); AMSA (Australian Marine Safety Authority) gives much thought to the structure deficiency, such as structure corrosion, crack and leakage. If deficiencies are found in inspection, we should take necessary measures to deal with the deficiencies and corrections should made to ensure safe operation.",
"zh": "PSC 即港口国监督，目的是保障船舶安全、防止污染与火灾。船舶抵港后，海事主管机关检查官（PSC 检查官）会对船舶实施检查，尤其是近六个月未接受过检查的船舶。检查官不仅核查应急与安全设备、消防装置，也可检查任意设备，例如主机、辅机、遥控系统等。不同主管机关检查重点不同：美国海岸警卫队侧重防污染设备、船员实操能力（尤其是消防与救生）；澳大利亚海事安全局侧重结构缺陷，例如腐蚀、裂纹、泄漏等。检查中若发现缺陷，我们须采取必要措施整改，确保船舶安全运营。"
},
{
"n": 5,
"title": "Please describe a bunkering operation on board your ship.",
"en": "Fuel oil is the main factor having much to do with the operation and maintenance of an engine. When selecting a fuel, there are more than ten factors to be considered, including: viscosity, cetane number, sulphur, carbon residues and ash. The fuel oil’s viscosity cetane number can affect combustion; sulphur can corrode the cylinder liner; carbon residues and ash decides the formation of combustion products. Before bunkering, the Third Engineer will go down to the oil lighter to do some measurement work, record the depth of the oil of tanks and discuss the questions that should be paid attention to during operation. After bunkering, but before dismantling the pipe, the oil retained in the hose will to be blown with compressed air. After dismantling the pipe, the pipe will be blinded to prevent the oil pollution.",
"zh": "燃油是影响发动机运行与维护的核心因素。选用燃油需考虑十余项指标，包括粘度、十六烷值、硫分、残炭、灰分。粘度和十六烷值影响燃烧效果；硫分会腐蚀气缸套；残炭和灰分决定燃烧产物的生成量。加油前，二管轮到加油驳船测舱，记录油舱液位，商定作业注意事项。加油结束后、拆管前，用压缩空气吹净软管内残油；拆管后对管口做盲断处理，防止油污染。"
},
{
"n": 6,
"title": "As a Chief Engineer, talk about your responsibility for PSC inspection.",
"en": "As a chief engineer, he should prepare all necessary documents used for inspection; then keep main engine and auxiliary machinery running in good order; make sure that no oil spillage, no abnormal noise and no overheated; all engineers can perform perfectly during inspection.",
"zh": "作为轮机长，港口国检查中的职责包括：备好检查所需全部文件；保障主辅机工况良好；确保无溢油、无异响、无过热；全体轮机员在检查中操作规范、应答到位。"
},
{
"n": 7,
"title": "Talk about fire prevention and fire fighting on board ship.",
"en": "A fire alarm and detection system is required to be installed on board ship. Such system is also fitted in the machinery space and cargo tanks of cargo ships. The function of a fire detector is to sound alarm when it has found a fire. The ship has a lot of fire extinguishing appliances, including: fire pump, fire main pipes, hydrant valves and portable extinguishers. The former with at least two jets of water may be directed on a fire in any part of the ship. There are many types of portable extinguishers used on board ship. Soda-acid extinguishers are useful on carbonaceous fires. The chemical foam extinguishers can be used to deal with the oil fires and it is usually found in machinery spaces and other locations, where an oil fire may occur. Carbon dioxide extinguishers and dry powder extinguishers are very useful on chemical fires.",
"zh": "船舶必须安装火灾报警与探测系统，机舱和货船货油舱也需配备。火灾探测器的功能是发现火情后发出警报。船上配备大量灭火设备，包括消防泵、消防总管、消防栓和手提式灭火器。消防系统至少能提供两股水柱，覆盖船舶任意区域。手提灭火器分为多种：酸碱灭火器适用于固体可燃物火灾；化学泡沫灭火器扑救油类火灾，通常布置在机舱等易发生油火的区域；二氧化碳和干粉灭火器适用于化学品火灾。"
},
{
"n": 8,
"title": "Talk about a fire and boat drill.",
"en": "As seamen, we often have fire and boat drill. We usually have the drill once a month. Each member is in charge of one duty. While doing the exercise, we may use fire pumps, fire extinguishers, life jackets, boats and so on. By the drill, we can fight fire bravely. We can face the emergency situation calmly. We can practice putting on the life jackets as quickly as possible. We can practice jumping down to the water from the high position. Without life jackets, how can we escape from the fire? We can develop our ability in fighting fire by the drill. So the drill is quite necessary to our seamen.",
"zh": "作为海员，我们经常开展消防和救生艇演习，通常每月一次，每人各司其职。演习中会用到消防泵、灭火器、救生衣、救生艇等设备。通过演习，我们能更勇敢地应对火情，从容面对紧急情况；练习快速穿戴救生衣、练习高处跳水求生；提升灭火实操能力。因此演习对海员来说十分必要。"
},
{
"n": 10,
"title": "As a Chief Engineer, talk about your responsibilities according to your company’s SMS.",
"en": "As a Chief Engineer, he must be familiar with the SMS’ Documents and its regulations. He is responsible for the training of SMS for the crew of engine department. He is also in charge of all the mechanical and electrical pneumatic equipments. He must keep them in good order to ensure the ship safety.",
"zh": "作为轮机长，依据公司安全管理体系，我的职责包括：熟悉安全管理体系文件与各项规定；负责轮机部船员的安全管理体系培训；主管全船机电、气动设备，保障设备工况良好，确保船舶安全。"
},
{
"n": 11,
"title": "As a Second Engineer talk about your responsibilities according to your company’s SMS.",
"en": "As a Second Engineer, he should assist the C/E to deal with the engine room daily work and maintenance work. He is in charge of M/E steering gear, auxiliary equipments and emergency equipments. He must keep them in good conditions to ensure the ship safety.",
"zh": "作为大管轮，依据公司安全管理体系，我协助轮机长处理机舱日常事务与维护保养工作；主管主机、舵机、辅机设备和应急设备，保障设备工况良好，确保船舶安全。"
},
{

"zh": "作为二管轮，依据公司安全管理体系，我负责辅机、空压机、造水机和应急设备，保障设备工况良好；同时负责燃油加装与驳运，作业中严防污染。"
},
{
"n": 13,
"title": "As a Fourth Engineer talk about your responsibilities according to your company’s SMS.",

}
]

    const t = d ? new Date(d) : new Date();
    return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
  }
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const norm = (s) => String(s || "").toLowerCase().replace(/[()（）]/g, " ").replace(/[^a-z0-9\s-]/g, " ").replace(/\s+/g, " ").trim();

  /* ══════════ 数据 ══════════ */
  const BASE = (window.WORDS || []).slice();
  let WORDS = [];

  const fresh = () => ({
    perDay: 20, autoSpeak: false, sound: true, showHom: true, spellHint: "first", ttsRate: 0.88, haptic: true,
    theme: "auto", splashOn: true,
    words: {}, custom: [], banks: [],
    today: { d: todayStr(), n: 0 },
    streak: { n: 0, last: null },
    hist: {},
    noticeSeen: "",
    updateUrl: UPD_DEFAULT
  });

  let st = fresh();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) st = Object.assign(fresh(), JSON.parse(raw));
  } catch (e) { /* 首次或坏档：用默认 */ }
  if (!st.words) st.words = {};
  if (!Array.isArray(st.custom)) st.custom = [];
  if (!Array.isArray(st.banks)) st.banks = [];
  st.banks = st.banks.filter(function (b) { return b && b.id && Array.isArray(b.words); });
  if (typeof st.showHom !== "boolean") st.showHom = true;
  if (typeof st.ttsRate !== "number" || !(st.ttsRate > 0)) st.ttsRate = 0.88;
  if (["none", "first", "length"].indexOf(st.spellHint) < 0) st.spellHint = "first";
  if (["auto", "sun", "light", "dark"].indexOf(st.theme) < 0) st.theme = "auto";
  if (typeof st.splashOn !== "boolean") st.splashOn = true;
  if (!st.hist || typeof st.hist !== "object" || Array.isArray(st.hist)) st.hist = {};
  if (typeof st.noticeSeen !== "string") st.noticeSeen = "";
  if (!st.today || st.today.d !== todayStr()) st.today = { d: todayStr(), n: 0 };

  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

  /* ══════════ 白天 / 夜间 ══════════
     四档：跟随系统 / 日出日落 / 一直白天 / 一直夜间。
     只往 <html> 上挂 data-theme，颜色全在 style.css 的变量里，不重绘页面。 */
  const THEMES = ["auto", "sun", "light", "dark"];
  const THEME_LABEL = { auto: "跟随系统", sun: "日出日落", light: "白天", dark: "夜间" };
  const mqDark = (function () {
    try { return window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null; } catch (e) { return null; }
  })();

  /* 手机现在是不是夜间。
     安卓 WebView 里的 prefers-color-scheme 常年报 dark（等于永远不跟随系统），
     所以壳里装了 AndroidTheme 就问原生；壳那边切主题时还会主动推 __sysTheme 过来。 */
  let sysOverride = null;
  function systemIsDark() {
    if (typeof sysOverride === "boolean") return sysOverride;
    try {
      if (window.AndroidTheme && typeof window.AndroidTheme.isDark === "function") {
        return !!window.AndroidTheme.isDark();
      }
    } catch (e) { /* 退到 matchMedia */ }
    return !!(mqDark && mqDark.matches);
  }
  window.__sysTheme = function (dark) {
    sysOverride = !!dark;
    applyTheme();
  };

  /* 日出日落：NOAA 的简化公式，纯本地算，不联网、不要定位权限。
     默认用大连（38.92°N, 121.63°E）—— 纬度差个一两度，日出日落差几分钟，够用了。 */
  const SUN_LAT = 38.92, SUN_LNG = 121.63;
  function sunTimes(d) {
    const rad = Math.PI / 180;
    const date = d || new Date();
    const start = new Date(date.getFullYear(), 0, 0);
    const n = Math.floor((date - start) / 86400000);
    const g = 2 * Math.PI / 365 * (n - 1 + 0.5);
    const eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g)
      - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
    const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g)
      - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g)
      - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
    const cosHa = Math.cos(90.833 * rad) / (Math.cos(SUN_LAT * rad) * Math.cos(decl))
      - Math.tan(SUN_LAT * rad) * Math.tan(decl);
    if (!(cosHa >= -1 && cosHa <= 1)) return { rise: 390, set: 1110 };   // 极昼极夜：退回 6:30 / 18:30
    const ha = Math.acos(cosHa) / rad;
    const noon = 720 - 4 * SUN_LNG - eq - date.getTimezoneOffset();
    return { rise: noon - 4 * ha, set: noon + 4 * ha };
  }
  const hm = (min) => {
    const m = Math.max(0, Math.min(1439, Math.round(min)));
    return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
  };
  function isNightNow() {
    const t = sunTimes(new Date());
    const d = new Date();
    const m = d.getHours() * 60 + d.getMinutes();
    return m < t.rise || m >= t.set;
  }
  function themeNow() {
    const m = THEMES.indexOf(st.theme) >= 0 ? st.theme : "auto";
    if (m === "light" || m === "dark") return m;
    if (m === "sun") return isNightNow() ? "dark" : "light";
    return systemIsDark() ? "dark" : "light";
  }
  function applyTheme() {
    const t = themeNow();
    document.documentElement.setAttribute("data-theme", t);
    const bg = t === "dark" ? "#0b1014" : "#f1f6f8";
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", bg);
    /* 系统状态栏 / 导航栏也跟着页面走 —— 不然白页面配两根黑条，就是那两条"黑边"。
       老壳没有 AndroidBars，调用会直接跳过（不影响任何东西）。 */
    try {
      if (window.AndroidBars && typeof window.AndroidBars.set === "function") {
        window.AndroidBars.set(bg, t !== "dark");
      }
    } catch (e) { /* 没有这个桥就算了 */ }
    const btn = document.getElementById("themeBtn");
    if (btn) {
      btn.textContent = t === "dark" ? "☾" : "☀";
      btn.title = "现在是" + (t === "dark" ? "夜间" : "白天") + " · 点一下换成"
        + (t === "dark" ? "白天" : "夜间");
    }
    const seg = document.getElementById("setTheme");
    if (seg) {
      Array.prototype.forEach.call(seg.querySelectorAll("button"), (b) => {
        b.classList.toggle("on", b.dataset.v === (THEMES.indexOf(st.theme) >= 0 ? st.theme : "auto"));
      });
    }
    const tip = document.getElementById("themeTip");
    if (tip) {
      const s = sunTimes(new Date());
      tip.textContent = "日出 " + hm(s.rise) + " · 日落 " + hm(s.set) + "（按大连算，本地时钟）";
    }
  }
  function setTheme(m) {
    st.theme = THEMES.indexOf(m) >= 0 ? m : "auto";
    save();
    applyTheme();
    buzz("tap");
    let msg = "主题：" + THEME_LABEL[st.theme];
    if (st.theme === "sun") msg += " · 现在算作" + (isNightNow() ? "夜间" : "白天");
    toast(msg);
  }
  function toggleTheme() {
    // 不管当前是什么档，先落到「明确的那一档」上，再反过来
    st.theme = themeNow() === "dark" ? "light" : "dark";
    save();
    applyTheme();
    buzz("tap");
  }
  try {
    if (mqDark && mqDark.addEventListener) mqDark.addEventListener("change", applyTheme);
    else if (mqDark && mqDark.addListener) mqDark.addListener(applyTheme);
  } catch (e) {}
  // 日出日落要盯着钟：每分钟对一次（其它档位也顺便对一下，不费什么）
  window.setInterval(applyTheme, 60000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) applyTheme();
  });

  function rebuildWordlist() {
    WORDS = BASE.concat(st.custom);
    const seen = new Set();
    WORDS = WORDS.filter((w) => { if (!w || !w.en || seen.has(w.en)) return false; seen.add(w.en); return true; });
  }
  function card(en) {
    if (!st.words[en]) st.words[en] = { box: 0, right: 0, wrong: 0, due: 0, fav: false, skip: false };
    const c = st.words[en];
    if (typeof c.right !== "number") c.right = 0;
    if (typeof c.wrong !== "number") c.wrong = 0;
    if (typeof c.due !== "number") c.due = 0;
    if (typeof c.box !== "number") c.box = 0;
    /* skip = 从词库移出背词范围（不背，但词条还在词库里） */
    if (typeof c.skip !== "boolean") c.skip = false;
    return c;
  }

  /* ══════════ 状态 ══════════ */
  let area = "word";           // word | read | audio | talk（后三个是给以后留的入口）
  let mode = "card";           // card | quiz | spell | listen | list
  let filter = "all";          // all | 新词 | 错词 | 收藏 | 分类名
  /* 每个筛选各自记「背到哪个词」：错词里背到 corrosion，切到收藏是从收藏自己那个词开始，
     切回错词还是 corrosion。以前两边共用一个位置，互相串。 */
  const posByFilter = {};
  function rememberPos() {
    if (!filter) return;
    if (!queue.length) { posByFilter[filter] = ""; return; }
    const i = Math.min(qpos, queue.length - 1);
    posByFilter[filter] = queue[i] ? queue[i].en : "";
  }
  let searchText = "";       // 列表模式的搜索词
  let queue = [];
  let qpos = 0;
  let finished = false;

  let cardFlipped = false;
  let quiz = null;             // {dir, opts, answered, chosen}
  let spellState = null;       // {answered, ok}
  let listenState = null;      // {opts, answered, chosen}

  /* ══════════ 声音 ══════════ */
  let actx = null;
  function beep(ok) {
    if (!st.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.connect(g); g.connect(actx.destination);
      o.type = "sine";
      o.frequency.value = ok ? 660 : 200;
      g.gain.setValueAtTime(0.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(ok ? 0.09 : 0.07, actx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.18);
      o.start(); o.stop(actx.currentTime + 0.2);
    } catch (e) {}
  }
  let voices = [];
  function loadVoices() { try { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; } catch (e) { voices = []; } }
  if (window.speechSynthesis) {
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  const bootAt = now();
  let ttsWarned = false;
  function ttsWarn() {
    if (ttsWarned) return;
    ttsWarned = true;
    toast("这台手机的文字转语音没就绪：系统设置 → 无障碍/语音 → 装一下英文语音包");
  }

  /* 朗读：安卓壳子里走系统 TTS（AndroidTTS），浏览器里走 Web Speech。
     Android WebView 没有 Web Speech 的实现，speechSynthesis 存在但不出声，所以必须先问原生接口。 */
  function speak(t, pitch) {
    if (!t) return;
    const text = String(t).replace(/[()（）]/g, " ").replace(/\s+/g, " ").trim();
    if (!text) return;
    const p = (typeof pitch === "number" && pitch > 0) ? pitch : 1;

    if (window.AndroidTTS && typeof window.AndroidTTS.speak === "function") {
      try {
        // 音高：听力里两个人靠这个区分，别的场景一律 1.0
        if (typeof window.AndroidTTS.setPitch === "function") {
          try { window.AndroidTTS.setPitch(p); } catch (e) { /* ignore */ }
        }
        if (!window.AndroidTTS.speak(text)) {
          const ready = window.AndroidTTS.ready ? window.AndroidTTS.ready() : false;
          if (ready || now() - bootAt > 4000) ttsWarn();
        }
        return;
      } catch (e) { /* 退到 Web Speech */ }
    }

    if (!window.speechSynthesis) { ttsWarn(); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = st.ttsRate; u.pitch = Math.max(0.5, Math.min(1.6, p));
      const v = voices.find((x) => /^en[-_]US/i.test(x.lang)) || voices.find((x) => /^en/i.test(x.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* 语速同步给原生 TTS（WebView 之外的安卓壳子） */
  function applyRate() {
    if (window.AndroidTTS && typeof window.AndroidTTS.setRate === "function") {
      try { window.AndroidTTS.setRate(st.ttsRate); } catch (e) {}
    }
  }

  /* ══════════ 震动 ══════════
     安卓壳子里走 AndroidHaptic（系统 Vibrator），浏览器里退到 navigator.vibrate。
     只在「手上能感觉到的地方」震：判定对错、选项对错、收藏、翻面、一轮走完、更新成功。
     打字、翻页面、开关设置都不震 —— 那些震了只会烦。 */
  function buzz(kind) {
    if (!st.haptic) return;
    const pattern = {
      tap: [0, 8],
      ok: [0, 16],
      no: [0, 26, 60, 26],
      done: [0, 30, 80, 30, 80, 70]
    }[kind] || [0, 10];
    try {
      if (window.AndroidHaptic && typeof window.AndroidHaptic.pattern === "function") {
        window.AndroidHaptic.pattern(pattern.join(","));
        return;
      }
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch (e) { /* 没有就算了 */ }
  }
  function toast(msg) {
    const d = document.createElement("div");
    d.className = "toast";
    d.textContent = msg;
    document.body.appendChild(d);
    setTimeout(() => { d.style.opacity = "0"; setTimeout(() => d.remove(), 320); }, 1500);
  }

  /* ══════════ 在线更新 ══════════
     两条路：
     1) 内容（词库 / 页面 / 样式）—— 从电脑上的目录拉一份新的单文件 HTML，存进 App 私有目录，
        刷新页面即生效。不用重装 APK，进度（localStorage）一点不动。
     2) 安装包 —— 只有安卓壳子本身改了才需要。点一下下载，下完自动叫出系统安装器。
     接口由 MainActivity 的 UpdaterBridge 提供：window.AndroidUpdate。 */
  let updPending = null;   // 最近一次 update.json
  let updAuto = false;     // 打开软件时那一次静默检查：只提示，不自动换

  function updHasApp() {
    return !!(window.AndroidUpdate && typeof window.AndroidUpdate.check === "function");
  }
  /* 现在这页是安装包里自带的，还是从网上换下来的？
     原生那边记着下过哪个版本号，对得上就是热更新来的。 */
  function hotUpdated() {
    if (!updHasApp()) return false;
    try {
      const c = window.AndroidUpdate.contentVersion ? window.AndroidUpdate.contentVersion() : "";
      return !!c && c === APP_VERSION;
    } catch (e) { return false; }
  }
  function updBase() {
    return String(st.updateUrl || UPD_DEFAULT).replace(/\/+$/, "");
  }

  /* ══════════ 新消息通知 ══════════
     notice.json 放在 update.json 旁边：{ id, title, body }。
     壳里每 6 小时自己去拉一次，有新 id 就弹系统通知；
     页面这里只管「打开 App 时立刻查一遍」，查到顺手标已读，免得两处重复打扰。 */
  function checkNotice() {
    const base = updBase();
    if (!base) return;
    try {
      const x = new XMLHttpRequest();
      x.open("GET", base + "/notice.json?_=" + now(), true);
      x.timeout = 8000;
      x.onload = function () {
        if (x.status < 200 || x.status >= 300) return;
        let o = null;
        try { o = JSON.parse(x.responseText); } catch (e) { return; }
        if (!o || !o.id) return;
        if (o.id === st.noticeSeen) return;
        st.noticeSeen = o.id;
        save();
        // 页面只记「我看过了」防重复提示；系统通知那条交给壳自己弹（它那边也记一份已读）
        try {
          if (window.AndroidNotify && typeof window.AndroidNotify.ping === "function") {
            window.AndroidNotify.ping();
          }
        } catch (e) { /* ignore */ }
        toast((o.title || "有新消息") + (o.body ? "：" + o.body : ""));
      };
      x.onerror = function () {};
      x.send();
    } catch (e) { /* 没网就不查 */ }
  }
  window.__noticePerm = function (ok) {
    toast(ok ? "好，有更新会弹通知" : "系统里没给通知权限，有更新就不会弹了");
  };
  function verNewer(a, b) {
    const pa = String(a || "").split("."), pb = String(b || "").split(".");
    const n = Math.max(pa.length, pb.length);
    for (let i = 0; i < n; i++) {
      const x = parseInt(pa[i], 10) || 0, y = parseInt(pb[i], 10) || 0;
      if (x !== y) return x > y;
    }
    return false;
  }

  function refreshUpdLabels() {
    const cur = document.getElementById("updCur");
    const sub = document.getElementById("updSub");
    const go = document.getElementById("updGo");
    if (cur) cur.textContent = "v" + APP_VERSION;
    if (!sub) return;
    if (!updHasApp()) {
      sub.textContent = "网页版：刷新浏览器就是最新";
      if (go) { go.textContent = "检查更新"; go.classList.remove("primary"); }
      return;
    }
    const content = safeContentVersion();
    const app = safeAppVersion();
    // 「内容可以单独更新、外壳偶尔才换」这件事写明白，省得看两个版本号犯迷糊
    sub.textContent = "内容包 · 外壳 " + (app || "?") + "（两个号不同是正常的）";
    const p = pendingUpdate();
    if (go) {
      go.textContent = p ? "更新到 v" + p.v : "检查更新";
      go.classList.toggle("primary", !!p);
    }
  }

  function safeAppVersion() {
    try { return window.AndroidUpdate.appVersion ? window.AndroidUpdate.appVersion() : ""; } catch (e) { return ""; }
  }
  function safeContentVersion() {
    try { return window.AndroidUpdate.contentVersion ? window.AndroidUpdate.contentVersion() : ""; } catch (e) { return ""; }
  }

  /* 有没有新版：壳新也算，内容新也算 */
  function pendingUpdate() {
    const o = updPending;
    if (!o) return null;
    // 拿不到壳的真实版本就别拿页面版本凑数，否则会把"要装包"判成"换个页面就行"
    const appV = safeAppVersion() || "0";
    const apkNew = o.apkVersion && verNewer(o.apkVersion, appV);
    const htmlNew = verNewer(o.version, APP_VERSION);
    if (!apkNew && !htmlNew) return null;
    return { apk: !!apkNew, html: htmlNew, v: o.version, apkV: o.apkVersion || o.version };
  }

  function checkUpdate(auto) {
    if (!updHasApp()) {
      toast("手机 App 里才有在线更新；网页上刷新浏览器就是最新的");
      return;
    }
    updAuto = !!auto;
    if (!updAuto) { toast("正在检查…"); refreshUpdLabels(); }
    try { window.AndroidUpdate.check(updBase()); } catch (e) { toast("调不动更新接口"); }
  }

  /* 安装包下载：一条线被掐断就换下一条。
     手机上 github.io 拉大文件经常半路 Connection reset，多备一条路能救回来。 */
  let apkQueue = [];

  function apkCandidates() {
    const o = updPending || {};
    const name = o.apk || "lunji-words.apk";
    const out = [];
    if (/^https?:/i.test(name)) out.push(name);
    const local = updBase() + "/" + String(name).replace(/^.*\//, "");
    if (out.indexOf(local) < 0) out.push(local);
    return out;
  }

  function startApkDownload() {
    if (!apkQueue.length) apkQueue = apkCandidates();
    const url = apkQueue.shift();
    if (!url) {
      toast("几条线都没下成，过一会儿再点一次「更新」");
      return;
    }
    try { window.AndroidUpdate.installApk(url); } catch (e) { toast("调不动更新接口"); }
  }

  /* 一键更新：拿现成的清单直接干，不再分两步 */
  function applyUpdate() {
    const p = pendingUpdate();
    if (!p) {
      if (updPending) { toast("已是最新 · v" + APP_VERSION); refreshUpdLabels(); }
      else checkUpdate(false);
      return;
    }
    const o = updPending;
    if (p.apk) {
      // 壳新：装壳最稳 —— 装完自带新内容，而且不用再点一次
      toast("这次要装一次新版本 v" + p.apkV + "，正在下…");
      buzz("tap");
      apkQueue = [];
      startApkDownload();
      return;
    }
    const html = o.html || "ship-words.html";
    const url = /^https?:/i.test(html) ? html : updBase() + "/" + html;
    toast("正在下 v" + p.v + "…");
    try { window.AndroidUpdate.applyContent(url, o.version); } catch (e) { toast("调不动更新接口"); }
  }

  function installApkOnline() {
    if (!updHasApp()) { toast("网页版不用装包，刷新就是最新的"); return; }
    toast("正在下安装包…");
    apkQueue = [];
    startApkDownload();
    refreshUpdLabels();
  }

  /* 原生那边的回调 */
  window.__updCheck = function (raw, err) {
    if (!raw) {
      if (!updAuto) toast("连不上：" + (err || "网络不通"));
      refreshUpdLabels();
      return;
    }
    let o = null;
    try { o = JSON.parse(raw); } catch (e) { o = null; }
    if (!o || !o.version) {
      if (!updAuto) toast("更新信息看不懂，检查一下地址");
      return;
    }
    updPending = o;
    refreshUpdLabels();
    const pd = pendingUpdate();
    if (pd) splashSayUpdate(pd);   // 开屏页还开着就直接写在它上面
    if (updAuto) {
      if (pd) { showUpdateBanner(o, pd); }
      return;
    }
    applyUpdate();
  };

  /* 换完页面怎么让新页面真的跑起来。
     老壳的 reload 只做 location.reload()，而 WebView 对拦截下来的 https://app.local/index.html
     会吃缓存 —— 结果就是「提示正在重开，画面没变」，得手动清后台。
     所以这里走两步：先叫壳重载，1.2 秒后还没跳成就自己带个时间戳硬跳一次（URL 不同就不会命中缓存）。 */
  function relaunch() {
    try {
      if (window.AndroidUpdate && typeof window.AndroidUpdate.reload === "function") {
        window.AndroidUpdate.reload();
      }
    } catch (e) { /* 落到下面那次硬跳 */ }
    window.setTimeout(function () {
      try {
        if (location.search.indexOf("_r=") >= 0) return;   // 已经带过参数了，别反复刷
        location.replace(location.pathname + "?_r=" + Date.now());
      } catch (e) {
        try { location.reload(); } catch (e2) {}
      }
    }, 1200);
  }

  window.__updApplied = function (ok, msg) {
    if (!ok) { toast("更新没成：" + (msg || "未知原因")); return; }
    buzz("done");
    toast("已更新到 v" + ((updPending && updPending.version) || "") + "，正在重开页面");
    window.setTimeout(relaunch, 700);
  };

  window.__updApk = function (ok, msg) {
    if (!ok) {
      if (apkQueue.length) {
        toast("这条线断了，换一条再试…");
        startApkDownload();
        return;
      }
      toast("安装包没下成：" + (msg || "未知原因") + " —— 过一会儿再点「更新」");
      return;
    }
    apkQueue = [];
    buzz("done");
    toast("下好了，点「安装」覆盖旧版 —— 背词进度不动");
  };

  /* 从本地文件导入（不走网络）*/
  window.__imported = function (ok, msg) {
    if (!ok) { toast("导入没成：" + (msg || "未知原因")); return; }
    toast("导入好了 · " + (msg || "") + "，正在重开页面");
    window.setTimeout(relaunch, 600);
  };

  function importFromFile() {
    if (!updHasApp() || typeof window.AndroidUpdate.pickFile !== "function") {
      toast("这个安装包还不支持文件导入，装一次 1.8.2 以后的");
      return;
    }
    try { window.AndroidUpdate.pickFile(); } catch (e) { toast("打不开文件选择器"); }
  }

  /* ══════════ 开屏更新提示 ══════════
     打开 App 静默查一次，有新版就在顶部挂一条横幅：点「更新」一键装好，点 ✕ 今天不再烦你。 */
  function showUpdateBanner(o, p) {
    const el = document.getElementById("banner");
    if (!el) return;
    el.innerHTML = '<span class="bn-txt">有新版 <b>v' + esc(p.v) + "</b>"
      + (p.apk ? " · 要先装一次包" : "") + "</span>"
      + '<button class="bn-go" id="bnGo">更新</button>'
      + '<button class="bn-x" id="bnClose" title="先不更新">✕</button>';
    el.classList.add("show");
    const go = document.getElementById("bnGo");
    const x = document.getElementById("bnClose");
    if (go) go.addEventListener("click", function () { applyUpdate(); });
    if (x) x.addEventListener("click", function () { el.classList.remove("show"); });
  }

  /* ══════════ 通知被系统关了 ══════════
     不是设置里那个开关，是系统「轮机背词 → 通知」那一层 —— 代码既不能替用户打开，
     也不能把自己的渠道设成必开。能做的是把那个页面直接摆到他面前。 */
  function openNotifySettings() {
    try {
      if (window.AndroidNotify && typeof window.AndroidNotify.openSettings === "function") {
        window.AndroidNotify.openSettings();
        return;
      }
    } catch (e) { /* 掉到下面的提示 */ }
    toast("这个壳还跳不过去：系统设置 → 应用 → 轮机背词 → 通知");
  }

  function notifyBlocked() {
    try {
      if (!window.AndroidNotify || typeof window.AndroidNotify.canPost !== "function") return false;
      if (!window.AndroidNotify.enabled()) return false;      // 自己关的，别烦人
      return !window.AndroidNotify.canPost();
    } catch (e) { return false; }
  }

  function showNotifyBanner() {
    const el = document.getElementById("banner");
    if (!el || el.classList.contains("show")) return;
    el.innerHTML = '<span class="bn-txt">系统里把通知关了，<b>收不到新版提醒</b></span>'
      + '<button class="bn-go" id="bnOpenNotify">去打开</button>'
      + '<button class="bn-x" id="bnClose" title="知道了">✕</button>';
    el.classList.add("show");
    const go = document.getElementById("bnOpenNotify");
    if (go) go.addEventListener("click", function () { el.classList.remove("show"); openNotifySettings(); });
    const x = document.getElementById("bnClose");
    if (x) x.addEventListener("click", function () { el.classList.remove("show"); });
  }

  /* ══════════ 开屏页（今日简报） ══════════
     打开先看一眼今天该干什么：还差几个、有没有到期的、连着几天。
     **不自动关**（点空白处或 ✕ 关掉）；有新版时底下多一行「更新」。
     ⚙ → 外观 里可以整个关掉。
     以前这里是「这一版改了什么」—— 那是给开发看的，用户每次打开只想知道今天背什么。 */
  let splashEl = null;
  let splashTimer = 0;

  function splashNums() {
    const live = WORDS.filter(function (w) { return !card(w.en).skip; });
    let due = 0, mastered = 0;
    live.forEach(function (w) {
      const c = card(w.en);
      if (c.box >= 3) mastered++;
      if (c.box > 0 && c.box < 5 && c.due <= now()) due++;
    });
    const todayN = st.today.d === todayStr() ? st.today.n : 0;
    const goal = st.perDay || 20;
    return {
      todayN: todayN, goal: goal, left: Math.max(0, goal - todayN),
      due: due, mastered: mastered, n: live.length, streak: st.streak.n || 0
    };
  }

  function splashBriefText(b) {
    if (b.todayN === 0 && b.left === b.goal) return "今天还没开始";
    if (b.left > 0) return "今天还差 " + b.left + " 个";
    return "今天的量够了";
  }

  function showSplash() {
    if (st.splashOn === false) return;
    if (document.getElementById("splash")) return;
    const b = splashNums();
    const bits = [];
    bits.push("待复习 " + b.due);
    if (b.streak >= 2) bits.push("连续 " + b.streak + " 天");
    bits.push("掌握 " + b.mastered + "/" + b.n);
    const mainLabel = b.due > 0 ? "先过到期的（" + b.due + "）" : "接着背";

    const el = document.createElement("div");
    el.className = "splash";
    el.id = "splash";
    el.innerHTML =
      '<button class="sp-x" id="spClose" title="关掉">✕</button>'
      + '<div class="sp-box">'
      + '<div class="sp-title"><span class="dot"></span>轮机背词</div>'
      + '<div class="sp-brief">'
      + '<div class="sp-big" id="spBig">' + esc(splashBriefText(b)) + "</div>"
      + '<div class="sp-sub" id="spSub">' + esc(bits.join(" · ")) + "</div>"
      + "</div>"
      + '<div class="sp-actions">'
      + '<button class="btn primary" id="spGo">' + esc(mainLabel) + "</button>"
      + '<button class="btn" id="spList">看列表</button>'
      + "</div>"
      + '<div class="sp-upd" id="spUpd" style="display:none"></div>'
      + '<div class="sp-copy">v' + esc(APP_VERSION) + " · © 2026 轮机背词 · 词条取自《轮机英语》</div>"
      + '<div class="sp-hint" id="spHint">点空白处或 ✕ 关掉</div>'
      + "</div>";
    document.body.appendChild(el);
    splashEl = el;
    /* 不自动关：这页现在是"今天背什么"，让人自己看完再点。
       嫌每次都要点一下的，⚙ → 外观 → 开屏页 关掉就是直接进。 */
    el.addEventListener("click", closeSplash);

    const go = el.querySelector("#spGo");
    if (go) go.addEventListener("click", function (ev) {
      ev.stopPropagation();
      closeSplash();
      area = "word"; mode = "card";
      if (b.due > 0) { filter = "@due"; posByFilter["@due"] = 0; }
      buildQueue(); render();
      if (mode === "card") autoSpeakCurrent();
    });
    const lst = el.querySelector("#spList");
    if (lst) lst.addEventListener("click", function (ev) {
      ev.stopPropagation();
      closeSplash();
      area = "word"; mode = "list"; render();
    });
  }

  function closeSplash() {
    if (!splashEl) return;
    const el = splashEl;
    splashEl = null;
    window.clearTimeout(splashTimer);
    el.classList.add("out");
    window.setTimeout(function () { try { el.remove(); } catch (e) {} }, 280);
  }

  /* 开屏页还开着的时候发现了新版：底部多一行「更新」，照样不自动关 */
  function splashSayUpdate(p) {
    if (!splashEl || !p) return;
    const box = splashEl.querySelector("#spUpd");
    if (!box) return;
    box.style.display = "";
    box.innerHTML = '<button class="mini primary sp-go">更新到 v' + esc(p.v) + "</button>"
      + "<span>背词进度一点不动</span>";
    const go = box.querySelector(".sp-go");
    if (go) go.addEventListener("click", function (ev) { ev.stopPropagation(); applyUpdate(); });
    const hint = splashEl.querySelector("#spHint");
    if (hint) hint.textContent = "点空白处或 ✕ 关掉，照常用现在这版";
  }

  /* ══════════ 队列 ══════════ */
  const cats = () => {
    const m = {};
    WORDS.forEach((w) => { m[w.cat || "未分类"] = (m[w.cat || "未分类"] || 0) + 1; });
    return m;
  };
  /* 词库里挑出来临时背的一批（点「背这些」时填） */
  let pickMap = null;

  function inFilter(w) {
    const c = card(w.en);
    if (filter === "@lib") return !!(pickMap && pickMap[w.en]);
    if (filter === "@due") return c.box > 0 && c.box < 5 && c.due <= now();
    if (c.skip) return false;                 // 移出背词范围的词，任何筛选里都不出现
    if (filter === "all") return true;
    if (filter === "新词") return c.box === 0;
    if (filter === "错词") return c.wrong > 0 && c.box < 4;
    if (filter === "收藏") return !!c.fav;
    return (w.cat || "未分类") === filter;
  }
  function buildQueue() {
    const list = WORDS.filter(inFilter);
    shuffle(list);
    const t = now();
    list.sort((x, y) => {
      const a = card(x.en), b = card(y.en);
      if (a.box !== b.box) return a.box - b.box;
      const pa = a.due <= t ? 0 : 1, pb = b.due <= t ? 0 : 1;
      if (pa !== pb) return pa - pb;
      if ((a.wrong > 0) !== (b.wrong > 0)) return a.wrong > 0 ? -1 : 1;
      return 0;
    });
    queue = list; qpos = 0; finished = queue.length === 0;
    cardFlipped = false; quiz = null; spellState = null; listenState = null;
  }
  const cur = () => queue[qpos] || null;

  /* 换筛选 / 换模式时重建队列，但**停在现在这个词上**：
     以前是一重建就回到第 1 个，点一下「错词」就把背到一半的位置弄丢了。 */
  function rebuildKeep() {
    const keep = cur() ? cur().en : "";
    buildQueue();
    if (!keep) return true;
    const i = queue.findIndex(function (w) { return w.en === keep; });
    if (i >= 0) { qpos = i; return true; }
    return false;
  }

  /* ══════════ 评分 ══════════ */
  function grade(ok) {
    const w = cur();
    if (!w) return;
    const c = card(w.en);
    if (ok) {
      c.right++;
      c.box = Math.min(5, c.box + 1);
      c.due = now() + BOX_DAYS[c.box] * DAY;
    } else {
      c.wrong++;
      c.box = Math.max(0, c.box - 1);
      c.due = now() + 10 * 60000;
    }
    const t = todayStr();
    if (st.today.d !== t) st.today = { d: t, n: 0 };
    st.today.n++;
    st.hist[t] = (st.hist[t] || 0) + 1;
    if (st.streak.last !== t) {
      const y = todayStr(Date.now() - DAY);
      st.streak.n = st.streak.last === y ? (st.streak.n || 1) + 1 : 1;
      st.streak.last = t;
    }
    beep(ok);
    buzz(ok ? "ok" : "no");
    save();
  }

  function advance() {
    qpos++;
    cardFlipped = false; quiz = null; spellState = null; listenState = null;
    if (qpos >= queue.length) { finished = true; buzz("done"); }
    rememberPos();
    render();
    if (!finished && mode === "card") autoSpeakCurrent();
  }

  /* 翻面不重绘整个舞台，只切 class —— 这样才有真正的 3D 翻转动画 */
  function toggleCard() {
    if (mode !== "card" || finished || !cur()) return;
    cardFlipped = !cardFlipped;
    const el = document.querySelector(".card");
    if (el) el.classList.toggle("flipped", cardFlipped);
    buzz("tap");
    if (cardFlipped) speak(cur().en);   // 只在翻到背面时念，翻回来不重复
  }

  /* 纯翻词：只移动指针，不改变掌握度。dir = +1 下一个 / -1 上一个 */
  function step(dir) {
    if (mode !== "card" || !cur()) return false;
    const np = qpos + dir;
    if (np < 0 || np >= queue.length) return false;
    qpos = np;
    finished = false;
    cardFlipped = false;
    rememberPos();
    render();
    if (st.autoSpeak) autoSpeakCurrent();
    return true;
  }
  function autoSpeakCurrent() {
    if (st.autoSpeak && mode === "card" && cur()) speak(cur().en);
  }

  /* ══════════ 出题 ══════════ */
  function buildQuiz() {
    const w = cur(); if (!w) return;
    const dir = Math.random() < 0.5 ? "en2zh" : "zh2en";
    const field = dir === "en2zh" ? "zh" : "en";
    const pool = WORDS.filter((x) => x.en !== w.en && x[field] !== w[field]);
    shuffle(pool);
    const opts = [w[field]].concat(pool.slice(0, 3).map((x) => x[field]));
    shuffle(opts);
    quiz = { dir, field, opts, answered: false, chosen: null };
  }
  function buildListen() {
    const w = cur(); if (!w) return;
    const pool = WORDS.filter((x) => x.en !== w.en);
    shuffle(pool);
    const opts = [w.en].concat(pool.slice(0, 3).map((x) => x.en));
    shuffle(opts);
    listenState = { opts, answered: false, chosen: null };
    setTimeout(() => speak(w.en), 220);
  }

  /* ══════════ 渲染 ══════════ */
  /* ══════════ 内容分区 ══════════
     现在只有「背单词」是通的。朗读材料 / 听力 / 对话先把入口和位置占住，
     以后接数据只改这里和 AREA_COPY，别的地方不用动。 */
  const AREAS = [
    { id: "word", label: "背单词" },
    { id: "read", label: "朗读" },
    { id: "audio", label: "听力" },
    { id: "talk", label: "对话" }
  ];
  /* 词库是工具，不常驻：收进右边「⋯」 */
  const MORE_AREAS = [
    { id: "bank", label: "📚 词库" }
  ];

  function moreCount(id) {
    try {
      if (id === "bank") return WORDS.length;
      if (id === "audio") {
        return (window.LISTENING || []).reduce(function (a, c) { return a + (c.items ? c.items.length : 0); }, 0);
      }
      if (id === "talk") {
        const T = window.TALK || {};
        return ((T.speech || []).reduce(function (a, c) { return a + (c.items ? c.items.length : 0); }, 0))
          + ((T.qa || []).reduce(function (a, c) { return a + (c.items ? c.items.length : 0); }, 0));
      }
    } catch (e) { /* ignore */ }
    return 0;
  }
  const AREA_COPY = {
    read: {
      ico: "📖", title: "朗读材料", tag: "还没上线",
      lead: "把教材里能开口的段落收进来：先听一遍，再一句一句跟读，读完能回放自己听。",
      bullet: [
        "按句切开，点哪句念哪句，单句能循环",
        "跟读录音回放，自己听哪里不对劲",
        "背词这边已经认识的词，在材料里给你标出来"
      ]
    },
    audio: {
      ico: "🎧", title: "听力", tag: "还没上线",
      lead: "轮机场景的短材料，精听和泛听分开：先听明白，再动手听写。",
      bullet: [
        "0.8× / 1.0× 变速，一句一句反复放",
        "听写挖空，听错的词自动回到背词队列",
        "干净版和带机舱底噪的版本对照着练"
      ]
    },
    talk: {
      ico: "💬", title: "对话", tag: "还没上线",
      lead: "机舱值班、甲板作业、PSC 检查这种一问一答，一轮一轮过。",
      bullet: [
        "按场景分的问答对，先看中文再翻英文",
        "我念完这句，接着念对方那句",
        "常用应答句式单独抽出来，反复练到顺口"
      ]
    }
  };

  function renderAreas() {
    const el = document.getElementById("areas");
    if (!el) return;
    const main = AREAS.map(function (a) {
      return '<button class="area' + (area === a.id ? " on" : "") + '" data-area="' + a.id + '">'
        + esc(a.label) + "</button>";
    }).join("");
    const inSoon = MORE_AREAS.some(function (a) { return a.id === area; });
    el.innerHTML = '<div class="areas-main">' + main + "</div>"
      + '<button class="area-more' + (inSoon ? " on" : "") + '" id="moreBtn" title="词库">⋯</button>'
      + '<div class="more-pop" id="morePop">'
      + MORE_AREAS.map(function (a) {
        const n = moreCount(a.id);
        return '<button data-area="' + a.id + '">' + esc(a.label)
          + '<span class="mn">' + (n || "") + "</span></button>";
      }).join("")
      + "</div>";
    const app = document.querySelector(".app");
    if (app) app.classList.toggle("solo", area !== "word");
  }

  /* ══════════ 词库（两个 tab） ══════════
     lib   = 教材全词表：搜 / 按分类翻 / 移出背词范围 / 挑一批出来背
     draft = 我的新词本：拍来的词先攒这儿，改干净再进单词表 */
  let bankTab = "lib";
  let libQ = "";
  let libCat = "all";

  /* 多选：libSel 为 null 就是普通模式；是 Set 就是多选模式（存英文）
     支持「一键全选」和「按住往下扫」连选（长按 220ms 才算拖选，短按仍是点选）。 */
  let libSel = null;
  let libRowMap = null;
  let libDrag = null;
  let suppressLibClick = 0;

  function bindLibRows() {
    libRowMap = null;
    if (!libSel) return;
    libRowMap = {};
