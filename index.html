    const rows = document.querySelectorAll("#libRows .lib-row");
    Array.prototype.forEach.call(rows, function (el) { libRowMap[el.dataset.librow] = el; });
  }

  function paintPick(en) {
    if (!libRowMap) bindLibRows();
    const el = libRowMap && libRowMap[en];
    if (!el) return;
    const on = !!(libSel && libSel.has(en));
    el.classList.toggle("picked", on);
    const ck = el.querySelector(".ck");
    if (ck) ck.classList.toggle("on", on);
  }

  function updateMultiFoot() {
    const n = libSel ? libSel.size : 0;
    const map = { "lib-sel-study": "背这些", "lib-sel-off": "移出", "lib-sel-on": "加回" };
    Object.keys(map).forEach(function (k) {
      const b = document.querySelector('[data-act="' + k + '"]');
      if (b) b.textContent = map[k] + "（" + n + "）";
    });
  }

  function togglePick(en) {
    if (!libSel) return;
    if (libSel.has(en)) libSel.delete(en); else libSel.add(en);
    paintPick(en);
    updateMultiFoot();
    buzz("tap");
  }

  function libFilterRows() {
    const q = libQ.trim().toLowerCase();
    return WORDS.filter(function (w) {
      if (libCat !== "all" && (w.cat || "未分类") !== libCat) return false;
      if (!q) return true;
      return String(w.en || "").toLowerCase().indexOf(q) >= 0
        || String(w.zh || "").toLowerCase().indexOf(q) >= 0
        || String(w.ipa || "").toLowerCase().indexOf(q) >= 0;
    });
  }

  function libRowHtml(w) {
    const c = card(w.en);
    const off = !!c.skip;
    const on = !!(libSel && libSel.has(w.en));
    return '<div class="lib-row' + (off ? " off" : "") + (on ? " picked" : "") + '" data-librow="' + esc(w.en) + '">'
      + (libSel ? '<span class="ck' + (on ? " on" : "") + '"></span>' : "")
      + '<div class="grow"><div><span class="en">' + esc(w.en) + "</span>"
      + (w.ipa ? '<span class="ipa">' + esc(w.ipa) + "</span>" : "") + "</div>"
      + '<div class="zh">' + esc(w.zh || "") + "</div>"
      + levelBar(c.box) + "</div>"
      + (libSel
        ? ""
        : '<button class="mini" data-act="lib-toggle" data-en="' + esc(w.en) + '">' + (off ? "加回" : "移出") + "</button>")
      + "</div>";
  }

  function renderLib() {
    const all = WORDS.length;
    const offN = WORDS.filter(function (w) { return card(w.en).skip; }).length;
    const rows = libFilterRows();
    const cm = cats();
    const chips = '<div class="chips" id="libCats">'
      + '<button class="chip' + (libCat === "all" ? " on" : "") + '" data-libcat="all">全部<span class="n">' + all + "</span></button>"
      + Object.keys(cm).map(function (k) {
        return '<button class="chip' + (libCat === k ? " on" : "") + '" data-libcat="' + esc(k) + '">'
          + esc(k) + '<span class="n">' + cm[k] + "</span></button>";
      }).join("")
      + "</div>";
    return '<div class="lib-wrap">'
      + '<div class="lib-intro">教材的全词表 —— 背单词的题都从这里出。不想背的点「移出」，它不进队列，但词条还在，随时加回。</div>'
      + '<div class="lib-stat"><span>全表 <b>' + all + "</b></span>"
      + "<span>在背 <b>" + (all - offN) + "</b></span>"
      + "<span>已移出 <b>" + offN + "</b></span>"
      + "<span>筛出 <b>" + rows.length + "</b></span></div>"
      + '<div class="search-box"><input type="search" id="libSearch" class="search-input"'
      + ' placeholder="搜英文 / 中文 / 音标" value="' + esc(libQ) + '" autocomplete="off" spellcheck="false"></div>'
      + chips
      + '<div class="lib-rows" id="libRows">'
      + (rows.length ? rows.map(libRowHtml).join("") : '<div class="shot-empty">没有匹配的词。</div>')
      + "</div>"
      + '<div class="lib-foot' + (libSel ? " multi" : "") + '">'
      + (libSel
        ? '<button class="mini" data-act="lib-all">全选 / 清空</button>'
          + '<button class="mini" data-act="lib-sel-study">背这些（' + libSel.size + "）</button>"
          + '<button class="mini" data-act="lib-sel-off">移出（' + libSel.size + "）</button>"
          + '<button class="mini" data-act="lib-sel-on">加回（' + libSel.size + "）</button>"
          + '<button class="mini primary" data-act="lib-sel-exit">完成</button>'
        : '<button class="mini primary" data-act="lib-study">背这些（' + rows.length + "）</button>"
          + '<button class="mini" data-act="lib-multi">选择</button>'
          + '<button class="mini" data-act="lib-off">筛出的全部移出</button>'
          + '<button class="mini" data-act="lib-on">筛出的全部加回</button>')
      + "</div></div>";
  }

  function renderBank() {
    return '<div class="bank-top">'
      + '<button class="mini primary" data-act="open-add">📷 拍照 / 选图加词</button>'
      + '<span class="hint">拍完先落在「我的新词本」，核对干净再一键进单词表</span>'
      + "</div>"
      + '<div class="lib-tabs">'
      + '<button class="' + (bankTab === "lib" ? "on" : "") + '" data-act="lib-tab" data-tab="lib">教材词库</button>'
      + '<button class="' + (bankTab === "draft" ? "on" : "") + '" data-act="lib-tab" data-tab="draft">我的新词本</button>'
      + "</div>"
      + (bankTab === "draft" ? renderBanks() : renderLib());
  }

  /* 从词库挑一批直接背：设个临时筛选 @lib */
  function studyPicked(list) {
    const arr = (list || []).map(function (w) { return w.en; });
    if (!arr.length) { toast("这一批是空的"); return; }
    pickMap = {};
    arr.forEach(function (e) { pickMap[e] = 1; });
    filter = "@lib";
    posByFilter["@lib"] = 0;      // 新挑的一批，从头开始
    area = "word";
    buildQueue();
    render();
    toast("这次只背这 " + arr.length + " 个");
    buzz("done");
  }

  function handleLibAct(btn) {
    const a = btn.dataset.act;
    if (a === "bank-tab" || a === "lib-tab") { bankTab = btn.dataset.tab || "lib"; libSel = null; render(); return; }
    if (a === "lib-toggle") {
      const c = card(btn.dataset.en);
      c.skip = !c.skip;
      save();
      if (filter === "@lib" || filter === "all") buildQueue();
      render();
      buzz("tap");
      return;
    }
    if (a === "lib-multi") { libSel = new Set(); render(); buzz("tap"); return; }
    if (a === "lib-sel-exit") { libSel = null; render(); return; }
    if (a === "lib-all") {
      if (!libSel) return;
      const rows = libFilterRows();
      const allOn = rows.length > 0 && rows.every(function (w) { return libSel.has(w.en); });
      rows.forEach(function (w) { if (allOn) libSel.delete(w.en); else libSel.add(w.en); });
      render();
      toast(allOn ? "清空选择" : ("选了 " + libSel.size + " 个"));
      return;
    }
    if (a === "lib-sel-study") {
      if (!libSel || !libSel.size) { toast("还没选词"); return; }
      const list = WORDS.filter(function (w) { return libSel.has(w.en); });
      libSel = null;
      studyPicked(list);
      return;
    }
    if (a === "lib-sel-off" || a === "lib-sel-on") {
      if (!libSel || !libSel.size) { toast("还没选词"); return; }
      const target = a === "lib-sel-on" ? false : true;   // 加回 = 取消 skip；移出 = 设 skip
      let n = 0;
      libSel.forEach(function (en) {
        const c = card(en);
        if (!!c.skip !== target) { c.skip = target; n++; }
      });
      save(); buildQueue();
      libSel = null;
      render();
      toast((target ? "移出 " : "加回 ") + n + " 个");
      buzz("done");
      return;
    }
    if (a === "lib-study") { studyPicked(libFilterRows()); return; }
    if (a === "lib-off" || a === "lib-on") {
      const target = a === "lib-on" ? false : true;
      let n = 0;
      libFilterRows().forEach(function (w) {
        const c = card(w.en);
        if (!!c.skip !== target) { c.skip = target; n++; }
      });
      save();
      buildQueue(); render();
      toast((target ? "移出 " : "加回 ") + n + " 个");
      return;
    }
  }

  /* ══════════ 我的新词本（原来的词库草稿本） ══════════ */
  let bankOpen = null;

  const bankById = (id) => st.banks.filter(function (b) { return b.id === id; })[0] || null;

  function newBank(name) {
    const id = "b" + now() + Math.floor(Math.random() * 1000);
    const b = { id: id, name: name || ("新词库 " + (st.banks.length + 1)), words: [], at: todayStr() };
    st.banks.unshift(b);
    save();
    return b;
  }

  function bankRowsHtml(b) {
    if (!b.words.length) {
      return '<div class="shot-empty">这个词库还空着。用「拍照 / 选图加词」把词存进来，或者点下面「+ 加一行」。</div>';
    }
    return b.words.map(function (w, i) {
      const used = WORDS.some(function (x) { return String(x.en).toLowerCase() === String(w.en).toLowerCase(); });
      return '<div class="add-row"><span class="rn">' + (i + 1) + "</span>"
        + '<input data-bk="en" data-bi="' + i + '" value="' + esc(w.en) + '" placeholder="english" autocapitalize="off" autocorrect="off" spellcheck="false">'
        + '<input data-bk="zh" data-bi="' + i + '" value="' + esc(w.zh) + '" placeholder="中文">'
        + (used
          ? '<span class="bk-used" title="单词表里已经有了">已在表里</span>'
          : '<button class="del" data-act="bank-delrow" data-i="' + i + '" title="删掉这一行">✕</button>')
        + "</div>";
    }).join("");
  }

  function renderBanks() {
    if (bankOpen) {
      const b = bankById(bankOpen);
      if (!b) { bankOpen = null; }
      else {
        return '<div class="bank-detail">'
          + '<div class="bank-bar">'
          + '<button class="mini" data-act="bank-back">← 全部词库</button>'
          + '<input class="bank-name" id="bankName" value="' + esc(b.name) + '" maxlength="20" placeholder="词库名">'
          + '<button class="mini danger" data-act="bank-del">删库</button>'
          + "</div>"
          + '<div class="bank-rows">' + bankRowsHtml(b) + "</div>"
          + '<div class="bank-foot">'
          + '<button class="mini" data-act="bank-addrow">+ 加一行</button>'
          + '<button class="mini primary" data-act="bank-push">全部加入单词表（' + b.words.length + "）</button>"
          + "</div></div>";
      }
    }
    const list = st.banks.map(function (b) {
      return '<div class="bank-item">'
        + '<div class="bi-main"><b>' + esc(b.name) + "</b><small>" + b.words.length + " 个词 · " + esc(b.at || "") + "</small></div>"
        + '<button class="mini" data-act="bank-open" data-id="' + b.id + '">打开</button>'
        + '<button class="mini primary" data-act="bank-push" data-id="' + b.id + '">加到单词表</button>'
        + "</div>";
    }).join("");
    return '<div class="bank-wrap">'
      + '<div class="bank-intro hint">词库是新词的草稿本：拍下来的词先存这儿，改干净了再一键加进单词表。'
      + "只有加进单词表的词才会出现在背词队列里。</div>"
      + '<div class="mini-btns"><button class="mini primary" data-act="bank-new">+ 新建词库</button>'
      + '<span class="hint">共 ' + st.banks.length + " 个</span></div>"
      + '<div class="bank-list">'
      + (list || '<div class="shot-empty">还没有词库。新建一个，或者用「拍照 / 选图加词」把照片里的词先存进来。</div>')
      + "</div></div>";
  }

  function pushBankToWords(b) {
    if (!b) return;
    const have = {};
    WORDS.forEach(function (w) { have[String(w.en).toLowerCase()] = 1; });
    let n = 0, dup = 0;
    b.words.forEach(function (w) {
      const en = String(w.en || "").trim();
      if (en.length < 2) return;
      const k = en.toLowerCase();
      if (have[k]) { dup++; return; }
      have[k] = 1;
      st.custom.push({ en: en, pos: "n.", zh: String(w.zh || "").trim() || en, phrase: "", cat: "自加", ipa: "", hom: "" });
      n++;
    });
    if (!n) { toast(dup ? "这些词单词表里都有了（" + dup + " 个）" : "这个词库里没有能用的词"); return; }
    rebuildWordlist(); buildQueue(); save(); render();
    buzz("done");
    toast("往单词表加了 " + n + " 个" + (dup ? "，跳过 " + dup + " 个重复的" : ""));
  }

  function handleBankAct(btn) {
    const a = btn.dataset.act;
    const id = btn.dataset.id || bankOpen;
    const b = bankById(id);
    if (a === "bank-new") { const nb = newBank(); bankOpen = nb.id; render(); return; }
    if (a === "bank-open") { bankOpen = btn.dataset.id; render(); return; }
    if (a === "bank-back") { bankOpen = null; render(); return; }
    if (a === "bank-push") { pushBankToWords(b); return; }
    if (a === "bank-addrow") { if (b) { b.words.push({ en: "", zh: "" }); save(); render(); } return; }
    if (a === "bank-delrow") { if (b) { b.words.splice(Number(btn.dataset.i), 1); save(); render(); } return; }
    if (a === "bank-del") {
      if (!b) return;
      if (btn.dataset.armed === "1") {
        st.banks = st.banks.filter(function (x) { return x.id !== id; });
        bankOpen = null;
        save(); render();
        toast("词库删了（单词表没动）");
        return;
      }
      btn.dataset.armed = "1";
      btn.textContent = "再点一次";
      window.setTimeout(function () {
        if (btn.dataset.armed === "1") { btn.dataset.armed = ""; btn.textContent = "删库"; }
      }, 3000);
      return;
    }
  }

  /* ══════════ 朗读材料 ══════════
     数据在 materials.js（window.MATERIALS）：按章分，每条一段英文 + 一段中文。
     英文按句切开，点哪句念哪句；「整段」连着念，「跟读」扔进录音面板。
     来源：教材配套《轮机英语朗读材料（中英对照）》PDF，解析脚本 _t/parse-materials.py。 */
  let readCh = 0;

  function readBooks() {
    return (window.MATERIALS || []).filter(function (c) {
      return c && c.items && c.items.length;
    });
  }

  /* 按句切：句号/问号/感叹号收尾，顺带把缩写（Mr. No.）放过 */
  function splitSent(text) {
    const t = String(text || "").replace(/\s+/g, " ").trim();
    if (!t) return [];
    const parts = t.match(/[^.?!]+[.?!]+["')\]]?|[^.?!]+$/g) || [t];
    return parts.map(function (s) { return s.trim(); }).filter(Boolean);
  }

  function readItem() {
    const books = readBooks();
    if (!books.length) return null;
    const ch = books[Math.min(readCh, books.length - 1)];
    return ch;
  }

  function renderRead() {
    const books = readBooks();
    if (!books.length) {
      return '<div class="done-card"><div class="big">📖</div><h2>还没有朗读材料</h2>'
        + '<p>把《轮机英语朗读材料（中英对照）》解析好放进 materials.js 就有了。</p></div>';
    }
    const ch = readItem();
    const chips = books.map(function (c, i) {
      return '<button class="chip' + (i === readCh ? " on" : "") + '" data-rch="' + i + '">'
        + esc(c.name) + '<span class="n">' + c.items.length + "</span></button>";
    }).join("");
    const items = ch.items.map(function (it, i) {
      const sents = splitSent(it.en).map(function (s, j) {
        return '<span class="sent">' + wordsHtml(s)
          + '<button class="sent-play" data-rsent="' + i + "|" + j + '" title="念这一句">🔊</button></span>';
      }).join(" ");
      return '<div class="mt-item">'
        + '<div class="mt-head"><span class="mt-n">' + (it.n || (i + 1)) + "</span>"
        + '<button class="mini" data-act="mt-play" data-i="' + i + '">🔊 整段</button>'
        + '<button class="mini" data-act="mt-read" data-i="' + i + '">🎤 跟读</button></div>'
        + '<div class="mt-en">' + sents + "</div>"
        + (it.zh ? '<div class="mt-zh">' + esc(it.zh) + "</div>" : "")
        + "</div>";
    }).join("");
    return '<div class="read-wrap">'
      + '<div class="lib-intro">教材里的朗读段落：点一个单词看它的音标和中文（还能加进单词表），点句尾的 🔊 念整句；「跟读」录一段回放。'
      + " 共 " + books.length + " 章 / " + books.reduce(function (a, c) { return a + c.items.length; }, 0) + " 段。</div>"
      + '<div class="chips" id="readChips">' + chips + "</div>"
      + '<div class="mt-list">' + items + "</div></div>";
  }

  /* 把一句英文拆成可点的单词（标点、空格原样留着） */
  function wordsHtml(sentence) {
    return String(sentence || "").split(/(\s+)/).map(function (tok) {
      if (!tok.trim()) return esc(tok);
      const m = tok.match(/^([^A-Za-z'-]*)([A-Za-z][A-Za-z'-]*)(.*)$/);
      if (!m) return esc(tok);
      if (m[2].length < 2) return esc(tok);   // A / I 这种单字母不值得单独成点
      return esc(m[1]) + '<span class="wd" data-w="' + esc(m[2]) + '">' + esc(m[2]) + "</span>" + esc(m[3]);
    }).join("");
  }

  /* 查词：先原样找，再退一步去复数 / 时态后缀 */
  function lookupWord(raw) {
    const k = String(raw || "").toLowerCase().replace(/[^a-z'-]/g, "").trim();
    if (k.length < 2) return null;
    const cands = [k];
    if (/s$/.test(k)) cands.push(k.slice(0, -1));
    if (/es$/.test(k)) cands.push(k.slice(0, -2));
    if (/ed$/.test(k)) cands.push(k.slice(0, -2), k.slice(0, -1));
    if (/ing$/.test(k)) cands.push(k.slice(0, -3), k.slice(0, -3) + "e");
    if (/ies$/.test(k)) cands.push(k.slice(0, -3) + "y");
    for (let i = 0; i < cands.length; i++) {
      const c = cands[i];
      const hit = WORDS.filter(function (w) { return String(w.en).toLowerCase() === c; })[0];
      if (hit) return hit;
    }
    return null;
  }

  let wordPopEl = null;
  let wordPopRaw = "";
  const dictCache = {};      // 查过的在线释义（英文原文 → 中文），省得来回请求

  function closeWordPop() {
    if (wordPopEl) wordPopEl.classList.remove("show");
    document.body.classList.remove("wp-on");
  }

  /* ---------- 在线词典 ----------
     词库只有轮机词（520 个），材料里别的词就走词典：先问壳要（页面自己 fetch 会被 CORS 拦），
     壳拿回来是 JSON，从 entries[0].explain 里抠中文。查到的只放在内存缓存，不塞进词库 ——
     词库还是只有轮机词，除非你自己点「加入单词表」。 */
  function dictUrl(w) {
    return "https://dict.youdao.com/suggest?num=1&ver=3.0&doctype=json&cache=false&le=en&q="
      + encodeURIComponent(w);
  }

  function parseDictExplain(text) {
    try {
      const o = JSON.parse(text);
      const list = (o && o.data && o.data.entries) || [];
      for (let i = 0; i < list.length; i++) {
        if (list[i] && list[i].explain) return String(list[i].explain);
      }
    } catch (e) { /* 不是 JSON 就当没查到 */ }
    return "";
  }

  let dictWaiting = null;

  function askDict(word, cb) {
    if (Object.prototype.hasOwnProperty.call(dictCache, word)) { cb(dictCache[word]); return; }
    if (!(window.AndroidNet && typeof window.AndroidNet.get === "function")) { cb(""); return; }
    dictWaiting = { word: word, cb: cb };
    try {
      window.AndroidNet.get(dictUrl(word));
    } catch (e) {
      dictWaiting = null;
      cb("");
      return;
    }
    window.setTimeout(function () {
      if (dictWaiting && dictWaiting.word === word) {
        const c = dictWaiting.cb;
        dictWaiting = null;
        c("");
      }
    }, 9000);
  }

  window.__netOk = function (url, text) {
    if (!dictWaiting) return;
    const w = dictWaiting;
    dictWaiting = null;
    const exp = parseDictExplain(text);
    dictCache[w.word] = exp;
    w.cb(exp);
  };
  window.__netErr = function () {
    if (!dictWaiting) return;
    const w = dictWaiting;
    dictWaiting = null;
    w.cb("");
  };

  function paintWordPop(raw, exp, pending) {
    const hit = lookupWord(raw);
    const show = function (s) { return esc(s); };
    let html = '<div class="wp-main"><b>' + show(hit ? hit.en : raw) + "</b>";
    if (hit && hit.ipa) html += '<span class="wp-ipa">' + show(hit.ipa) + "</span>";
    html += "</div>";
    if (hit) {
      html += '<div class="wp-zh">' + show(hit.zh || "") + "</div>";
      if (hit.phrase) html += '<div class="wp-ph">' + show(hit.phrase) + "</div>";
    } else if (pending) {
      html += '<div class="wp-zh dim">词库里没有，正在查词典…</div>';
    } else if (exp) {
      html += '<div class="wp-zh">' + show(exp) + "</div>";
      html += '<div class="wp-ph">在线词典 · 没进词库</div>';
    } else {
      html += '<div class="wp-zh dim">词库里没有，词典也没查到（可能没网）</div>';
    }
    const canAdd = !!hit || !!exp;
    html += '<div class="wp-btns">'
      + '<button class="mini primary" data-wp="say">🔊 念这个</button>'
      + (canAdd ? '<button class="mini" data-wp="add">＋ 加入单词表</button>' : "")
      + '<button class="mini" data-wp="close">关掉</button></div>';
    wordPopEl.innerHTML = html;
  }

  function showWordPop(raw) {
    if (!wordPopEl) {
      wordPopEl = document.createElement("div");
      wordPopEl.className = "word-pop";
      wordPopEl.id = "wordPop";
      document.body.appendChild(wordPopEl);
      wordPopEl.addEventListener("click", function (e) {
        const b = e.target.closest("[data-wp]");
        if (!b) return;
        const act = b.dataset.wp;
        if (act === "close") { closeWordPop(); return; }
        if (act === "say") { speak(wordPopRaw); buzz("tap"); return; }
        if (act === "add") {
          const hit = lookupWord(wordPopRaw);
          const en = hit ? hit.en : wordPopRaw;
          const zh = hit ? (hit.zh || "") : (dictCache[wordPopRaw] || "");
          if (!zh) { toast("没有中文，先查一次再加"); return; }
          const inCustom = st.custom.some(function (w) {
            return String(w.en).toLowerCase() === String(en).toLowerCase();
          });
          if (inCustom) { toast("已经在单词表里了"); return; }
          st.custom.push({
            en: en, pos: hit ? (hit.pos || "n.") : "n.", zh: zh,
            phrase: "", cat: "自加", ipa: hit ? (hit.ipa || "") : "", hom: hit ? (hit.hom || "") : ""
          });
          rebuildWordlist(); buildQueue(); save(); render();
          toast("加进单词表了：" + en);
          buzz("done");
          return;
        }
      });
    }
    wordPopRaw = raw;
    const hit = lookupWord(raw);
    if (hit || Object.prototype.hasOwnProperty.call(dictCache, raw)) {
      paintWordPop(raw, dictCache[raw] || "", false);
    } else {
      paintWordPop(raw, "", true);
      askDict(raw, function (exp) {
        if (wordPopRaw !== raw) return;   // 已经点别的词了，别覆盖
        paintWordPop(raw, exp, false);
      });
    }
    wordPopEl.classList.add("show");
    document.body.classList.add("wp-on");
  }

  function handleReadAct(btn) {
    const ch = readItem();
    if (!ch) return;
    const i = Number(btn.dataset.i);
    const it = ch.items[i];
    if (!it) return;
    if (btn.dataset.act === "mt-play") { speak(it.en); buzz("tap"); return; }
    if (btn.dataset.act === "mt-read") {
      openReadPanel({ en: it.en, zh: it.zh, ipa: "", pos: "" });
      return;
    }
  }

  /* ══════════ 听力（短对话理解） ══════════
     数据 window.LISTENING：每段 S1/S2 两句 + 一道理解题，中英各一份。
     点某一句念那一句，「播对话」两句连着念，答案默认藏着。 */
  let hearCh = 0;
  const hearOpen = {};

  function hearBooks() {
    return (window.LISTENING || []).filter(function (c) { return c && c.items && c.items.length; });
  }

  function hearItem() {
    const books = hearBooks();
    if (!books.length) return null;
    return books[Math.min(hearCh, books.length - 1)];
  }

  function renderHear() {
    const books = hearBooks();
    if (!books.length) {
      return '<div class="done-card"><div class="big">🎧</div><h2>还没有听力材料</h2>'
        + "<p>listening.js 放进去就有了。</p></div>";
    }
    const ch = hearItem();
    const chips = books.map(function (c, i) {
      return '<button class="chip' + (i === hearCh ? " on" : "") + '" data-hch="' + i + '">'
        + esc(c.name) + '<span class="n">' + c.items.length + "</span></button>";
    }).join("");
    const items = ch.items.map(function (it, i) {
      const open = !!hearOpen[ch.name + "#" + i];
      const qaKey = "hear#" + ch.name + "#" + i;
      const line = function (who, en, zh) {
        if (!en) return "";
        return '<div class="ls-line"><span class="who' + (who === "S2" ? " s2" : "") + '">' + who + "</span>"
          + '<span class="say">' + wordsHtml(en)
          + '<button class="sent-play" data-act="ls-say" data-i="' + i + '" data-who="' + who
          + '" title="念这一句">🔊</button></span></div>'
          + (zh ? '<div class="ls-zh">' + esc(zh) + "</div>" : "");
      };
      return '<div class="ls-item">'
        + '<div class="ls-head"><span class="mt-n">' + (it.n || (i + 1)) + "</span>"
        + '<button class="mini" data-act="ls-play" data-i="' + i + '">🔊 播对话</button></div>'
        + line("S1", it.s1, it.s1Zh)
        + line("S2", it.s2, it.s2Zh)
        + (it.q ? '<div class="ls-q"><span class="q-tag">Q</span>' + esc(it.q) + "</div>" : "")
        + (it.qZh ? '<div class="ls-zh">' + esc(it.qZh) + "</div>" : "")
        /* 理解题先自己答一句 —— 跟问答题同一套：打字或 🎤，提交后按实词覆盖率给分、逐词标红绿 */
        + (it.q
          ? '<div class="qa-box" data-qakey="' + qaKey + '">'
            + '<textarea class="qa-in" data-hqi="' + i + '" rows="2" placeholder="先自己用英文答一句，再对答案">'
            + esc(qaDraft[qaKey] || "") + "</textarea>"
            + '<div class="qa-btns">'
            + '<button class="mini" data-act="hqa-mic" data-i="' + i + '">🎤 说出来</button>'
            + '<button class="mini primary" data-act="hqa-submit" data-i="' + i + '">提交</button>'
            + '<button class="mini" data-act="hqa-clear" data-i="' + i + '">清空</button>'
            + '<button class="mini" data-act="ls-toggle" data-i="' + i + '">' + (open ? "收起答案" : "参考答案") + "</button>"
            + "</div>"
            + '<div class="qa-res" id="hqaRes-' + i + '"></div>'
            + "</div>"
          : "")
        + (open
          ? '<div class="ls-a"><span class="q-tag a">A</span>' + wordsHtml(it.a || "")
            + (it.aZh ? '<div class="ls-zh">' + esc(it.aZh) + "</div>" : "") + "</div>"
          : "")
        + "</div>";
    }).join("");
    return '<div class="read-wrap">'
      + '<div class="lib-intro">两个人说两句，然后一道理解题。先听：点句尾的 🔊 念那一句、点单词看意思；'
      + "然后自己用英文答一句（打字或 🎤），提交后逐词给你标对错，最后再看参考答案。</div>"
      + '<div class="chips" id="hearChips">' + chips + "</div>"
      + '<div class="mt-list">' + items + "</div></div>";
  }

  /* ══════════ 对话（口述题 + 问答题） ══════════ */
  let talkTab = "speech";
  let talkCh = 0;
  const talkOpen = {};
  const qaDraft = {};   // 问答作答：已打的字（切章回来还在）

  /* ---------- 问答作答：打字 / 说出来 → 跟参考答案比 ---------- */
  const QA_STOP = ("a an the and or but if then than that this these those there here is are was were be been " +
    "being am do does did have has had will would shall should can could may might must not no nor so as at by " +
    "for from in into of on onto out over to up with within about after again against all any both each few more " +
    "most other some such only own same too very just now also it its they them their he him his she her we us our " +
    "you your yours i me my mine what which who whom whose when where why how").split(" ");

  /* 数字词和阿拉伯数字视为同一个词：four years 和 4 years 该算对上 */
  const QA_NUM = {
    zero: "0", one: "1", two: "2", three: "3", four: "4", five: "5", six: "6", seven: "7", eight: "8",
    nine: "9", ten: "10", eleven: "11", twelve: "12", thirteen: "13", fourteen: "14", fifteen: "15",
    sixteen: "16", seventeen: "17", eighteen: "18", nineteen: "19", twenty: "20", thirty: "30",
    forty: "40", fifty: "50", sixty: "60", seventy: "70", eighty: "80", ninety: "90", hundred: "100"
  };

  function qaWords(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9\s'-]/g, " ").split(/\s+/).filter(Boolean)
      .map(function (w) { return QA_NUM[w] || w; });
  }

  function qaContentWords(s) {
    return qaWords(s).filter(function (w) { return QA_STOP.indexOf(w) < 0; });
  }

  /* 编辑距离：容一点识别误差（pistn / pisten 这种），长词放宽到 2 */
  function qaDist(a, b) {
    if (a === b) return 0;
    const m = a.length, n = b.length;
    if (Math.abs(m - n) > 3) return 99;
    const prev = [];
    for (let j = 0; j <= n; j++) prev[j] = j;
    for (let i = 1; i <= m; i++) {
      let dl = prev[0];
      prev[0] = i;
      for (let j = 1; j <= n; j++) {
        const tmp = prev[j];
        prev[j] = Math.min(prev[j] + 1, prev[j - 1] + 1, dl + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
        dl = tmp;
      }
    }
    return prev[n];
  }

  function qaClose(a, b) {
    if (a === b) return true;
    if (!a || !b) return false;
    const lim = Math.max(a.length, b.length) >= 7 ? 2 : 1;
    return qaDist(a, b) <= lim;
  }

  /* 覆盖率：参考答案里的实词，有多少被自己的答案说到了（容忍拼写/识别误差） */
  function compareAnswer(ref, user) {
    const refW = qaContentWords(ref);
    const uni = {};
    refW.forEach(function (w) { uni[w] = 1; });
    const keys = Object.keys(uni);
    if (!keys.length) return { score: 0, hit: 0, total: 0 };
    const have = qaContentWords(user);
    let hit = 0;
    keys.forEach(function (w) {
      for (let i = 0; i < have.length; i++) {
        if (qaClose(have[i], w)) { hit++; return; }
      }
    });
    return { score: Math.round((100 * hit) / keys.length), hit: hit, total: keys.length };
  }

  /* 参考答案逐词上色：说到的绿、没说到并且是实词的红、虚词灰 */
  function qaMarkHtml(ref, user) {
    const have = qaWords(user);
    return String(ref || "").split(/(\s+)/).filter(Boolean).map(function (tok) {
      const raw = tok.toLowerCase().replace(/[^a-z0-9'-]/g, "");
      if (!raw) return esc(tok);
      const w = QA_NUM[raw] || raw;
      if (QA_STOP.indexOf(w) >= 0) return '<span class="q-st">' + esc(tok) + "</span>";
      let ok = false;
      for (let i = 0; i < have.length; i++) {
        if (qaClose(have[i], w)) { ok = true; break; }
      }
      return '<span class="' + (ok ? "q-hit" : "q-miss") + '">' + esc(tok) + "</span>";
    }).join("");
  }

  let asrCb = null;

  function askSpeech(cb) {
    if (!(window.AndroidAsr && typeof window.AndroidAsr.listen === "function")) {
      toast("这个壳没有语音输入，直接打字答吧");
      return;
    }
    asrCb = cb;
    try {
      window.AndroidAsr.listen();
    } catch (e) {
      asrCb = null;
      cb("");
    }
  }

  window.__asrResult = function (text) {
    const c = asrCb; asrCb = null;
    if (!c) return;
    let s = String(text || "").trim();
    // 系统识别常常整句全大写（小米的就这样），先转成正常大小写，看着不刺眼
    if (s && s === s.toUpperCase()) {
      s = s.toLowerCase().replace(/(^|[.!?]\s+)([a-z])/g, function (m, p1, p2) { return p1 + p2.toUpperCase(); });
    }
    c(s);
  };
  window.__asrFail = function (msg) {
    const c = asrCb; asrCb = null;
    if (c) c("");
    if (msg) toast(String(msg));
  };

  function paintQaResult(boxId, it, user, cmp) {
    const box = document.getElementById(boxId);
    if (!box) return;
    const tail = cmp.score >= 80 ? "说得挺全了" : (cmp.score >= 45 ? "意思到了大半，缺的下面标红了" : "差得有点多，先看看参考答案");
    box.innerHTML = '<div class="qa-score">' + cmp.score + "<small> 分 · " + cmp.hit + "/" + cmp.total + " 个实词</small></div>"
      + '<div class="qa-tip">' + esc(tail) + "</div>"
      + '<div class="qa-ref">参考答案：' + qaMarkHtml(it.a || "", user) + "</div>"
      + '<div class="qa-mine">你答的：' + esc(user) + "</div>";
    buzz(cmp.score >= 80 ? "ok" : (cmp.score < 40 ? "no" : "tap"));
  }

  function qaSubmit(i) {
    if (talkTab !== "qa") return;
    const ch = talkItem();
    if (!ch) return;
    const it = ch.items[i];
    if (!it) return;
    const key = talkTab + "#" + ch.name + "#" + i;
    const el = document.querySelector('[data-qakey="' + key + '"] .qa-in');
    const user = (el ? el.value : (qaDraft[key] || "")).trim();
    if (!user) { toast("先写点什么，或者点 🎤 说出来"); return; }
    qaDraft[key] = user;
    paintQaResult("qaRes-" + i, it, user, compareAnswer(it.a || "", user));
  }

  function talkBooks() {
    const T = window.TALK || {};
    const list = T[talkTab] || [];
    return list.filter(function (c) { return c && c.items && c.items.length; });
  }

  function talkItem() {
    const books = talkBooks();
    if (!books.length) return null;
    return books[Math.min(talkCh, books.length - 1)];
  }

  function renderTalk() {
    const tabs = '<div class="lib-tabs">'
      + '<button class="' + (talkTab === "speech" ? "on" : "") + '" data-act="talk-tab" data-tab="speech">口述题</button>'
      + '<button class="' + (talkTab === "qa" ? "on" : "") + '" data-act="talk-tab" data-tab="qa">问答题</button>'
      + "</div>";
    const books = talkBooks();
    if (!books.length) {
      return '<div class="read-wrap">' + tabs
        + '<div class="done-card"><div class="big">💬</div><h2>还没有内容</h2></div></div>';
    }
    const ch = talkItem();
    const chips = books.map(function (c, i) {
      return '<button class="chip' + (i === talkCh ? " on" : "") + '" data-tch="' + i + '">'
        + esc(c.name) + '<span class="n">' + c.items.length + "</span></button>";
    }).join("");
    const items = ch.items.map(function (it, i) {
      const open = !!talkOpen[talkTab + "#" + ch.name + "#" + i];
      if (talkTab === "speech") {
        return '<div class="talk-item">'
          + '<div class="mt-head"><span class="mt-n">' + (it.n || (i + 1)) + "</span>"
          + '<span class="talk-title">' + esc(it.title || "") + "</span>"
          + '<button class="mini" data-act="talk-play" data-i="' + i + '">🔊</button>'
          + '<button class="mini" data-act="talk-read" data-i="' + i + '">🎤</button></div>'
          + '<div class="talk-en">' + wordsHtml(it.en || "") + "</div>"
          + (it.zh ? '<div class="talk-zh">' + esc(it.zh) + "</div>" : "")
          + "</div>";
      }
      return '<div class="talk-item" data-qakey="' + talkTab + "#" + ch.name + "#" + i + '">'
        + '<div class="mt-head"><span class="mt-n">' + (it.n || (i + 1)) + "</span>"
        + '<button class="mini" data-act="talk-play" data-i="' + i + '">🔊 问</button></div>'
        + '<div class="talk-q">' + wordsHtml(it.q || "") + "</div>"
        + (it.qZh ? '<div class="talk-qzh">' + esc(it.qZh) + "</div>" : "")
        + '<div class="qa-box">'
        + '<textarea class="qa-in" data-qi="' + i + '" rows="2" placeholder="先自己答：打字，或者点右边的 🎤 说出来">'
        + esc(qaDraft[talkTab + "#" + ch.name + "#" + i] || "") + "</textarea>"
        + '<div class="qa-btns">'
        + '<button class="mini" data-act="qa-mic" data-i="' + i + '">🎤 说出来</button>'
        + '<button class="mini primary" data-act="qa-submit" data-i="' + i + '">提交</button>'
        + '<button class="mini" data-act="qa-clear" data-i="' + i + '">清空</button>'
        + '<button class="mini" data-act="talk-open" data-i="' + i + '">' + (open ? "收起答案" : "参考答案") + "</button>"
        + "</div>"
        + '<div class="qa-res" id="qaRes-' + i + '"></div>'
        + "</div>"
        + (open
          ? '<div class="talk-a">' + wordsHtml(it.a || "")
            + (it.aZh ? '<div class="talk-azh">' + esc(it.aZh) + "</div>" : "") + "</div>"
          : "")
        + "</div>";
    }).join("");
    return '<div class="read-wrap">' + tabs
      + '<div class="lib-intro">' + (talkTab === "speech"
        ? "口述题：先照着念顺，再自己讲一遍。🔊 听一遍，🎤 录一段对照。"
        : "问答题：先自己答，再点「参考答案」看怎么说；🔊 是念问题。")
      + "</div>"
      + '<div class="chips" id="talkChips">' + chips + "</div>"
      + '<div class="mt-list">' + items + "</div></div>";
  }

  /* 两个说话人的音色：S1 细、S2 沉（差得越多越像两个人，但过高会发尖、过低会糊） */
  const HEAR_P1 = 1.3;
  const HEAR_P2 = 0.7;

  function handleHearAct(btn) {
    const ch = hearItem();
    if (!ch) return;
    const i = Number(btn.dataset.i);
    const it = ch.items[i];
    if (!it) return;
    const a = btn.dataset.act;

    /* 理解题作答：打字 / 说出来 → 提交 → 按实词覆盖率给分（跟对话的问答题同一套） */
    if (a === "hqa-submit" || a === "hqa-clear" || a === "hqa-mic") {
      const key = "hear#" + ch.name + "#" + i;
      const sel = '[data-qakey="' + key + '"] .qa-in';
      if (a === "hqa-submit") {
        const el = document.querySelector(sel);
        const user = (el ? el.value : (qaDraft[key] || "")).trim();
        if (!user) { toast("先写点什么，或者点 🎤 说出来"); return; }
        qaDraft[key] = user;
        paintQaResult("hqaRes-" + i, it, user, compareAnswer(it.a || "", user));
        return;
      }
      if (a === "hqa-clear") {
        const el = document.querySelector(sel);
        if (el) { el.value = ""; el.focus(); }
        qaDraft[key] = "";
        const box = document.getElementById("hqaRes-" + i);
        if (box) box.innerHTML = "";
        return;
      }
      toast("说完先看一眼，改对了再提交");
      askSpeech(function (text) {
        if (!text) return;
        const el = document.querySelector(sel);
        if (el) { el.value = text; el.focus(); }
        qaDraft[key] = text;   // 不自动提交，识别难免有错
      });
      return;
    }

    if (a === "ls-play") {
      // 壳里能串着念：S1 用细一点的音高、S2 用沉的，中间不换人声的毛病
      if (window.AndroidTTS && typeof window.AndroidTTS.seq === "function") {
        const parts = [];
        if (it.s1) parts.push({ t: it.s1, p: HEAR_P1 });
        if (it.s2) parts.push({ t: it.s2, p: HEAR_P2 });
        try {
          window.AndroidTTS.seq(JSON.stringify(parts));
          buzz("tap");
          return;
        } catch (e) { /* 退到一次念完 */ }
      }
      speak([it.s1, it.s2].filter(Boolean).join(". "));
      buzz("tap");
      return;
    }
    if (a === "ls-say") {
      const who = btn.dataset.who === "S2" ? "S2" : "S1";
      speak(who === "S1" ? it.s1 : it.s2, who === "S1" ? HEAR_P1 : HEAR_P2);
      buzz("tap");
      return;
    }
    if (a === "ls-toggle") {
      // 只改这一张卡片，不整页重绘 —— 否则一展开列表就跳回顶部
      const key = ch.name + "#" + i;
      hearOpen[key] = !hearOpen[key];
      const item = btn.closest(".ls-item");
      const old = item ? item.querySelector(".ls-a") : null;
      if (old) old.parentNode.removeChild(old);
      if (hearOpen[key] && item) {
        const div = document.createElement("div");
        div.className = "ls-a";
        div.innerHTML = '<span class="q-tag a">A</span>' + wordsHtml(it.a || "")
          + (it.aZh ? '<div class="ls-zh">' + esc(it.aZh) + "</div>" : "");
        item.appendChild(div);
      }
      btn.textContent = hearOpen[key] ? "收起答案" : "参考答案";
      return;
    }
  }

  function handleTalkAct(btn) {
    const a = btn.dataset.act;
    if (a === "talk-tab") { talkTab = btn.dataset.tab || "speech"; talkCh = 0; render(); return; }
    const ch = talkItem();
    if (!ch) return;
    const i = Number(btn.dataset.i);
    const it = ch.items[i];
    if (!it) return;
    if (a === "talk-play") { speak(talkTab === "speech" ? it.en : it.q); buzz("tap"); return; }
    if (a === "talk-read") { openReadPanel({ en: it.en, zh: it.zh, ipa: "", pos: "" }); return; }
    if (a === "qa-submit") { qaSubmit(i); return; }
    if (a === "qa-clear") {
      const key = talkTab + "#" + ch.name + "#" + i;
      const el = document.querySelector('[data-qakey="' + key + '"] .qa-in');
      if (el) { el.value = ""; el.focus(); }
      qaDraft[key] = "";
      const box = document.getElementById("qaRes-" + i);
      if (box) box.innerHTML = "";
      return;
    }
    if (a === "qa-mic") {
      const key = talkTab + "#" + ch.name + "#" + i;
      toast("说完先看一眼，改对了再提交");
      askSpeech(function (text) {
        if (!text) return;
        const el = document.querySelector('[data-qakey="' + key + '"] .qa-in');
        if (el) { el.value = text; el.focus(); }
        qaDraft[key] = text;
        // 不自动提交：识别难免有错，让人先改一眼再说
      });
      return;
    }
    if (a === "talk-open") {
      // 同样只动这一张卡片，保持滚动位置
      const k = talkTab + "#" + ch.name + "#" + i;
      talkOpen[k] = !talkOpen[k];
      const item = btn.closest(".talk-item");
      const old = item ? item.querySelector(".talk-a") : null;
      if (old) old.parentNode.removeChild(old);
      if (talkOpen[k] && item) {
        const div = document.createElement("div");
        div.className = "talk-a";
        div.innerHTML = wordsHtml(it.a || "")
          + (it.aZh ? '<div class="talk-azh">' + esc(it.aZh) + "</div>" : "");
        item.appendChild(div);
      }
      btn.textContent = talkOpen[k] ? "收起答案" : "参考答案";
      return;
    }
  }

  function renderSoon() {
    const c = AREA_COPY[area];
    if (!c) {
      return '<div class="done-card"><div class="big">🫗</div><h2>这里还空着</h2>'
        + '<p>先回去背单词。</p>'
        + '<button class="btn primary" data-act="area-word" style="max-width:200px">回背单词</button></div>';
    }
    return '<div class="soon-card">'
      + '<div class="big-ico">' + c.ico + "</div>"
      + '<h2>' + esc(c.title) + ' <span class="tag">' + esc(c.tag) + "</span></h2>"
      + "<p>" + esc(c.lead) + "</p>"
      + "<ul>" + c.bullet.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>"
      + '<div class="soon-foot">'
      + '<button class="btn primary" data-act="area-word" style="max-width:190px">先去背单词</button>'
      + '<span class="hint">词库到 800 以后再排期</span>'
      + "</div></div>";
  }

  /* 只算「在背」的词：词库里移出去的不进统计 */
  function statWords() {
    return WORDS.filter(function (w) { return !card(w.en).skip; });
  }

  function renderStats() {
    let mastered = 0, due = 0, n = 0;
    statWords().forEach((w) => {
      const c = card(w.en);
      n++;
      if (c.box >= 3) mastered++;
      if (c.box > 0 && c.box < 5 && c.due <= now()) due++;
    });
    $("#statMastered").innerHTML = mastered + "<small>/" + n + "</small>";
    $("#statToday").innerHTML = (st.today.d === todayStr() ? st.today.n : 0) + "<small>/" + st.perDay + "</small>";
    $("#statDue").textContent = due;
    $("#statStreak").textContent = st.streak.n || 0;
    const done = Math.min(1, (st.today.d === todayStr() ? st.today.n : 0) / st.perDay);
    $("#bar").style.width = (done * 100).toFixed(1) + "%";
    $("#ptext").textContent = Math.round(done * 100) + "%";
  }

  /* ══════════ 统计详情（四个方块点进来） ══════════ */
  let statKind = null;

  function openStat(kind) {
    statKind = kind;
    let el = document.getElementById("statPanel");
    if (!el) {
      el = document.createElement("div");
      el.className = "mask";
      el.id = "statPanel";
      el.innerHTML = '<div class="sheet sp-sheet" id="statBody"></div>';
      document.body.appendChild(el);
      el.addEventListener("click", function (e) { if (e.target === el) closeStat(); });
    }
    el.classList.add("show");
    renderStat();
    buzz("tap");
  }

  function closeStat() {
    const el = document.getElementById("statPanel");
    if (el) el.classList.remove("show");
    statKind = null;
  }

  function renderStat() {
    const body = document.getElementById("statBody");
    if (!body || !statKind) return;
    if (statKind === "today") body.innerHTML = statTodayHtml();
    else if (statKind === "streak") body.innerHTML = statStreakHtml();
    else if (statKind === "due") body.innerHTML = statListHtml("due");
    else body.innerHTML = statListHtml("mastered");
  }

  function statPick(kind) {
    return statWords().filter(function (w) {
      const c = card(w.en);
      return kind === "due" ? (c.box > 0 && c.box < 5 && c.due <= now()) : c.box >= 3;
    }).sort(function (a, b) { return card(b.en).box - card(a.en).box; });
  }

  function statListHtml(kind) {
    const list = statPick(kind);
    const title = kind === "due" ? "待复习" : "已掌握";
    const note = kind === "due"
      ? "按记忆曲线算，这些词今天该再过一遍了。可以只背这一批。"
      : "掌握度到 3 格以上的词。觉得自己其实没记住，就在这儿点「重学」，它回到生词。";
    const rows = list.slice(0, 150).map(function (w) {
      const c = card(w.en);
      return '<div class="sp-row"><div class="grow">'
        + '<div class="en">' + esc(w.en) + "</div>"
        + '<div class="zh">' + esc(w.zh || "") + "</div></div>"
        + levelBar(c.box)
        + (kind === "due" ? "" : '<button class="mini" data-sp="reset" data-en="' + esc(w.en) + '">重学</button>')
        + "</div>";
    }).join("");
    return '<div class="sp-head"><span class="sp-title">' + title + "</span>"
      + '<span class="sp-num">' + list.length + "<small>个</small></span></div>"
      + '<div class="sp-note">' + note + "</div>"
      + '<div class="sp-list">'
      + (rows || '<div class="sp-empty">' + (kind === "due" ? "今天没有到期要复习的。" : "还没有词到 3 格，先背几轮。") + "</div>")
      + "</div>"
      + '<div class="sp-btns">'
      + (list.length ? '<button class="mini primary" data-sp="study" data-kind="' + kind + '">背这些（' + list.length + "）</button>" : "")
      + '<button class="mini" data-sp="close">关掉</button></div>'
      + (list.length > 150 ? '<div class="sp-note">只列前 150 个</div>' : "");
  }

  function statTodayHtml() {
    const n = st.today.d === todayStr() ? st.today.n : 0;
    const goal = st.perDay || 20;
    const pct = Math.min(100, Math.round((n / goal) * 100));
    const left = goal - n;
    return '<div class="sp-head"><span class="sp-title">今日</span>'
      + '<span class="sp-num">' + n + "<small>/ " + goal + "</small></span></div>"
      + '<div class="sp-bar"><i style="width:' + pct + '%"></i></div>'
      + '<div class="sp-note">'
      + (left > 0 ? "还差 " + left + " 个到今天的量。" : "今天的量已经够了，多背的也照样算。")
      + " 每判定一次算一个，同一个词反复背也计数。</div>"
      + '<div class="sp-btns">'
      + '<button class="mini" data-sp="goal" data-d="-5">目标 −5</button>'
      + '<button class="mini" data-sp="goal" data-d="5">目标 +5</button>'
      + '<button class="mini" data-sp="today-reset" data-armed="">清零今天的</button>'
      + '<button class="mini primary" data-sp="close">关掉</button></div>';
  }

  function statStreakHtml() {
    const days = [];
    for (let i = 13; i >= 0; i--) {
      const d = todayStr(Date.now() - i * DAY);
      days.push({ d: d, n: st.hist[d] || 0 });
    }
    let max = 1;
    days.forEach(function (x) { if (x.n > max) max = x.n; });
    const bars = days.map(function (x) {
      const h = x.n ? Math.max(9, Math.round((x.n / max) * 100)) : 4;
      return '<div class="d' + (x.n ? " on" : "") + '" title="' + esc(x.d) + " · " + x.n + ' 个">'
        + '<i style="height:' + h + '%"></i><span>' + x.d.slice(8) + "</span></div>";
    }).join("");
    let total = 0;
    days.forEach(function (x) { total += x.n; });
    return '<div class="sp-head"><span class="sp-title">连续</span>'
      + '<span class="sp-num">' + (st.streak.n || 0) + "<small>天</small></span></div>"
      + '<div class="sp-note">连着背了多少天。断一天就从头算，今天背过就算续上。</div>'
      + '<div class="sp-note">最近 14 天一共背了 ' + total + " 个。</div>"
      + '<div class="sp-days">' + bars + "</div>"
      + '<div class="sp-btns"><button class="mini primary" data-sp="close">关掉</button></div>';
  }

  /* 分类不再常驻一行，收进「分类 ▾」浮层（点一下展开，选完自动收起） */
  let catOpen = false;

  function renderChips() {
    /* 统计和队列一样，只算「在背」的词（移出背词范围的不算进去） */
    const live = WORDS.filter(function (w) { return !card(w.en).skip; });
    const c = {};
    live.forEach(function (w) {
      const k = w.cat || "未分类";
      c[k] = (c[k] || 0) + 1;
    });
    const total = live.length;
    const newN = live.filter((w) => card(w.en).box === 0).length;
    const wrongN = live.filter((w) => card(w.en).wrong > 0 && card(w.en).box < 4).length;
    const favN = live.filter((w) => card(w.en).fav).length;

    /* 第一排固定四个：错词 / 收藏 在前，然后全部、新词；后面挂一个「分类 ▾」。 */
    const pin = [
      { f: "错词", n: wrongN },
      { f: "收藏", n: favN },
      { f: "all", n: total, label: "全部" },
      { f: "新词", n: newN }
    ];
    const PIN_F = { all: 1, "错词": 1, "收藏": 1, "新词": 1 };
    let catNow = "";
    if (filter === "@due") catNow = "待复习";
    else if (!PIN_F[filter] && filter !== "@lib") catNow = String(filter || "");

    let html = "";
    /* 从词库挑着背的时候，第一排最前面给一个能一键退出的「选集」chip */
    if (filter === "@lib" && pickMap) {
      const n = Object.keys(pickMap).length;
      html += '<button class="chip on" data-f="all" title="点一下取消选集">词库选集<span class="n">' + n + "</span>✕</button>";
    }
    pin.forEach((p) => {
      html += '<button class="chip' + (filter === p.f ? " on" : "") + '" data-f="' + esc(p.f) + '">'
        + esc(p.label || p.f) + '<span class="n">' + p.n + "</span></button>";
    });
    html += '<button class="chip cat-btn' + (catNow ? " on" : "") + '" id="catBtn" title="按分类挑">'
      + (catNow ? esc(catNow) : "分类") + '<span class="car">▾</span></button>';
    $("#chips").innerHTML = html;

    /* 分类浮层：一屏排完，不用横着滑 */
    let cs = '<div class="cats-head"><span>按分类背</span>'
      + '<span class="hint">' + Object.keys(c).length + " 类 · 点一个就开始</span></div>"
      + '<div class="cats-cloud">'
      + '<button class="chip sm' + (!catNow ? " on" : "") + '" data-f="all">全部<span class="n">' + total + "</span></button>";
    Object.keys(c).forEach((k) => {
      cs += '<button class="chip sm' + (filter === k ? " on" : "") + '" data-f="' + esc(k) + '">'
        + esc(k) + '<span class="n">' + c[k] + "</span></button>";
    });
    cs += "</div>";
    const catsEl = $("#cats");
    if (catsEl) {
      catsEl.innerHTML = cs;
      catsEl.classList.toggle("show", catOpen);
    }
  }

  function renderTabs() {
    document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.m === mode));
  }

  function doneBlock() {
    const empty = queue.length === 0;
    return '<div class="done-card"><div class="big">' + (empty ? "🫗" : "✅") + "</div>"
      + "<h2>" + (empty ? "这个范围里没词" : "这一轮走完了") + "</h2>"
      + "<p>" + (empty ? "换个分类，或者把筛选切回「全部」。" : "答过的都记进去了，掌握度低的下一轮会先出来。") + "</p>"
      + '<div style="display:flex;gap:10px;max-width:320px;width:100%">'
      + '<button class="btn primary" data-act="restart">再来一轮</button>'
      + '<button class="btn" data-act="openlist">看看列表</button></div></div>';
  }

  function renderStage() {
    const el = $("#stage");
    if (area === "bank") { el.innerHTML = renderBank(); return; }
    if (area === "read") { el.innerHTML = renderRead(); return; }
    if (area === "audio") { el.innerHTML = renderHear(); return; }
    if (area === "talk") { el.innerHTML = renderTalk(); return; }
    if (area !== "word") { el.innerHTML = renderSoon(); return; }
    if (mode === "list") { el.innerHTML = renderList(); return; }
    if (finished || !cur()) { el.innerHTML = doneBlock(); return; }
    if (mode === "card") return renderCard(el);
    if (mode === "quiz") { if (!quiz) buildQuiz(); return renderQuiz(el); }
    if (mode === "spell") return renderSpell(el);
    if (mode === "listen") { if (!listenState) buildListen(); return renderListen(el); }
  }

  function levelBar(box) {
    let s = '<span class="lv">';
    for (let i = 0; i < 5; i++) s += "<i" + (i < box ? ' class="f"' : "") + "></i>";
    return s + "</span>";
  }

  /* 一键回到正在背的那个词：在词库 / 列表 / 朗读里翻着，点一下就回卡片原位（队列和位置都没动过） */
  function renderBackCard() {
    let el = document.getElementById("backCard");
    const w = cur();
    const inCard = area === "word" && mode === "card";
    /* 只属于「背单词」这一摊：朗读 / 听力 / 对话里别冒出来一个回单词卡的按钮 */
    const sameArea = area === "word" || area === "bank";
    const show = !!w && !finished && sameArea && !inCard;
    if (!show) { if (el) el.remove(); return; }
    if (!el) {
      el = document.createElement("button");
      el.id = "backCard";
      el.className = "back-card";
      el.addEventListener("click", function (ev) {
        ev.stopPropagation();
        area = "word"; mode = "card";
        render();
        try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
        buzz("tap");
      });
      document.body.appendChild(el);
    }
    const besideBar = !!document.querySelector(".lib-foot.multi") || !!document.querySelector(".lib-foot");
    el.classList.toggle("high", besideBar);
    el.innerHTML = '<span class="bc-ico">↩</span>回到第 ' + (qpos + 1) + " 个";
  }

  function renderCard(el) {
    const w = cur(); const c = card(w.en);
    /* 词组（emergency fire pump 这种）把每个词拆开，点谁查谁；单个词还是点整张卡朗读 */
    const isPhrase = /\s/.test(String(w.en || "").trim());
    const meta = (w.pos || w.ipa)
      ? '<div class="meta-line">'
        + (w.pos ? '<span class="pos">' + esc(w.pos) + "</span>" : "")
        + (w.ipa ? '<span class="ipa">' + esc(w.ipa) + "</span>" : "")
        + "</div>"
      : "";
    const hom = (w.hom && st.showHom)
      ? '<div class="hom"><span class="hom-tag">谐音</span>' + esc(w.hom) + "</div>"
      : "";
    const tools = '<div class="card-tools">'
      + '<button class="tool-btn' + (c.fav ? " on" : "") + '" data-act="fav" title="收藏 / 取消收藏">' + (c.fav ? "★" : "☆") + "</button>"
      + '<button class="tool-btn" data-act="read" title="跟读：录一段、听回放">🎤</button>'
      + '<button class="tool-btn flip-btn" data-act="flip" title="翻面：中文 / 英文">' + (cardFlipped ? "EN" : "中") + "</button>"
      + "</div>";
    el.innerHTML =
      '<div class="card-wrap"><div class="card' + (cardFlipped ? " flipped" : "") + '" data-act="speak">'
      + '<div class="face front">'
      + tools
      + '<span class="cat-tag">' + esc(w.cat || "") + "</span>"
      + '<div class="word' + (isPhrase ? " is-phrase" : "") + '">'
      + (isPhrase ? wordsHtml(w.en) : esc(w.en)) + "</div>"
      + meta + hom
      + '<div class="hint">' + levelBar(c.box) + "&nbsp; "
      + (isPhrase ? "点其中任何一个词看意思，点空白处念整串" : "点单词念一遍")
      + "，点右上角「中」看中文</div>"
      + "</div>"
      + '<div class="face back">'
      + tools
      + '<span class="cat-tag">' + esc(w.cat || "") + "</span>"
      + '<div class="zh">' + esc(w.zh) + "</div>"
      + (w.phrase ? '<div class="phrase">' + esc(w.phrase) + "</div>" : "")
      + (w.ipa ? '<div class="back-word">' + esc(w.ipa) + "</div>" : "")
      + (w.hom && st.showHom ? '<div class="hom small"><span class="hom-tag">谐音</span>' + esc(w.hom) + "</div>" : "")
      + "</div></div></div>"
      + '<div class="actions">'
      + '<button class="btn bad" data-act="no">不认识 <span class="kbd">1</span></button>'
      + '<button class="btn ok" data-act="yes">认识 <span class="kbd">2</span></button>'
      + "</div>"
      + '<div class="hint" style="text-align:center;margin-top:12px">第 ' + (qpos + 1) + " / " + queue.length
      + " 个 · 左右滑翻词，1/2 判定 · 点单词朗读</div>";
  }

  function renderQuiz(el) {
    const w = cur(); const q = quiz;
    const prompt = q.dir === "en2zh" ? w.en : w.zh;
    const sub = q.dir === "en2zh" ? "选出它的中文意思" : "选出对应的英文";
    let opts = q.opts.map((o, i) => {
      let cls = "opt";
      if (q.answered) {
        cls += " done";
        if (o === w[q.field]) cls += " correct";
        else if (o === q.chosen) cls += " wrong";
      }
      return '<button class="' + cls + '" data-opt="' + i + '"><span class="idx">' + (i + 1) + "</span><span>" + esc(o) + "</span></button>";
    }).join("");
    el.innerHTML =
      '<div class="q-head"><span class="cat-tag">' + esc(w.cat || "") + '</span>'
      + '<span class="hint">' + (qpos + 1) + " / " + queue.length + '</span></div>'
      + '<div class="q-prompt">' + esc(prompt) + "</div>"
      + '<div class="q-sub">' + sub + (q.dir === "en2zh" && q.answered ? " · " + esc(w.phrase || "") : "") + "</div>"
      + '<div class="opts">' + opts + "</div>"
      + (q.answered
        ? '<div class="actions"><button class="btn primary" data-act="next">下一题 <span class="kbd">↵</span></button></div>'
        : '<div class="actions"><button class="btn" data-act="speak">🔊 念一遍</button></div>');
  }

  function renderSpell(el) {
    const w = cur();
    const s = spellState || { answered: false, ok: false };
    const hint = (w.zh || "") + (w.pos ? "  (" + w.pos + ")" : "");
    const len = w.en.replace(/[^A-Za-z ]/g, "").trim();
    const first = len.charAt(0).toUpperCase();
    const wordCount = len.split(/\s+/).filter(Boolean).length;
    let sub = esc(hint);
    let ph = "拼出英文";
    if (st.spellHint === "length") {
      sub += " · " + esc(len.replace(/[A-Za-z]/g, "·")) + "（" + wordCount + " 个词）";
      ph = "首字母 " + first + " 开头";
    } else if (st.spellHint === "first") {
      sub += " · 首字母 " + esc(first);
      ph = "首字母 " + first + " 开头";
    }
    el.innerHTML =
      '<div class="q-head"><span class="cat-tag">' + esc(w.cat || "") + '</span>'
      + '<span class="hint">' + (qpos + 1) + " / " + queue.length + "</span></div>"
      + '<div class="q-prompt">' + esc(w.zh) + "</div>"
      + '<div class="q-sub">' + sub + "</div>"
      + '<div class="spell-box">'
      + '<input class="spell-input" id="spellIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + esc(ph) + '"'
      + (s.answered ? " disabled" : "") + ">"
      + '<div class="feedback' + (s.answered ? (s.ok ? " ok" : " bad") : "") + '" id="fb">'
      + (s.answered ? (s.ok ? "对，就是它。" : "正确答案：<em>" + esc(w.en) + "</em>") : "&nbsp;")
      + "</div>"
      + '<div class="actions">'
      + (s.answered
        ? '<button class="btn primary" data-act="next">下一题 <span class="kbd">↵</span></button>'
        : '<button class="btn primary" data-act="submit">提交 <span class="kbd">↵</span></button>'
          + '<button class="btn" data-act="show">看答案</button>')
      + "</div></div>";
    if (!s.answered) {
      const inp = $("#spellIn");
      if (inp) setTimeout(() => inp.focus(), 30);
    }
  }

  function renderListen(el) {
    const w = cur(); const s = listenState;
    let opts = s.opts.map((o, i) => {
      let cls = "opt";
      if (s.answered) {
        cls += " done";
        if (o === w.en) cls += " correct";
        else if (o === s.chosen) cls += " wrong";
      }
      return '<button class="' + cls + '" data-opt="' + i + '"><span class="idx">' + (i + 1) + "</span><span>" + esc(o) + "</span></button>";
    }).join("");
    el.innerHTML =
      '<div class="q-head"><span class="cat-tag">' + esc(w.cat || "") + '</span>'
      + '<span class="hint">' + (qpos + 1) + " / " + queue.length + "</span></div>"
      + '<div class="q-prompt">🔊 听发音，选出你听到的词</div>'
      + '<div class="q-sub">' + (s.answered ? esc(w.zh) + " · " + esc(w.phrase || "") : "没声就点下面的按钮再放一次") + "</div>"
      + '<div class="opts">' + opts + "</div>"
      + '<div class="actions">'
      + '<button class="btn" data-act="speak">🔊 再放一次</button>'
      + (s.answered ? '<button class="btn primary" data-act="next">下一题 <span class="kbd">↵</span></button>' : "")
      + "</div>";
  }

  function matchSearch(w) {
    const q = searchText.trim().toLowerCase();
    if (!q) return true;
    const hay = (w.en + " " + w.zh + " " + (w.ipa || "") + " " + (w.phrase || "") + " " + (w.hom || "") + " " + (w.cat || "")).toLowerCase();
    return hay.indexOf(q) >= 0;
  }

  function renderRows() {
    const list = WORDS.filter(inFilter).filter(matchSearch);
    if (!list.length) {
      return '<div class="search-empty">'
        + (searchText ? "没搜到「" + esc(searchText) + "」" : "这个范围里没词")
        + "</div>";
    }
    let html = "";
    const q = searchText.trim().toLowerCase();
    list.forEach((w) => {
      const c = card(w.en);
      // 搜的是例句时，把例句也显示出来，不然看不出为什么命中
      const hitPhrase = q && (w.phrase || "").toLowerCase().indexOf(q) >= 0
        && (w.en + " " + w.zh + " " + (w.ipa || "")).toLowerCase().indexOf(q) < 0;
      html += '<div class="row" data-en="' + esc(w.en) + '">'
        + levelBar(c.box)
        + '<div><div class="en">' + esc(w.en) + " <span class=\"pos-inline\">" + esc(w.pos || "") + "</span></div>"
        + '<div class="zh2">' + esc(w.zh) + (w.ipa ? '<span class="ipa2">' + esc(w.ipa) + "</span>" : "") + "</div>"
        + (hitPhrase ? '<div class="zh2 phrase-hit">' + esc(w.phrase) + "</div>" : "")
        + "</div>"
        + '<button class="fav' + (c.fav ? " on" : "") + '" data-fav="' + esc(w.en) + '">' + (c.fav ? "★" : "☆") + "</button>"
        + "</div>";
    });
    return html;
  }

  function renderList() {
    return '<div class="search-box">'
      + '<input type="search" id="listSearch" class="search-input" placeholder="搜英文 / 中文 / 音标 / 例句"'
      + ' value="' + esc(searchText) + '" autocomplete="off" spellcheck="false"></div>'
      + '<div class="list" id="listBody">' + renderRows() + "</div>";
  }

  function render() {
    renderAreas();
    renderStats(); renderChips(); renderTabs(); renderStage();
    bindLibRows();
    renderBackCard();
    $("#foot").innerHTML = WORDS.length + " 个词 · 进度存在本机"
      + ' · <span class="ver">v' + APP_VERSION + "</span>"
      + (hotUpdated() ? '<span class="hot">热更</span>' : "");
  }

  /* ══════════ 交互 ══════════ */
  function submitSpell() {
    const w = cur(); if (!w || (spellState && spellState.answered)) return;
    const inp = $("#spellIn"); if (!inp) return;
    const val = inp.value;
    const alts = [w.en, w.en.replace(/\s*[（(][^)）]*[)）]/g, ""), (w.en.match(/[（(]([^)）]+)[)）]/) || [])[1] || ""]
      .map(norm).filter(Boolean);
    const ok = alts.indexOf(norm(val)) >= 0 && norm(val).length > 1;
    spellState = { answered: true, ok };
    grade(ok);
    render();
    if (ok) speak(w.en);
  }

    } else if (mode === "listen" && listenState && !listenState.answered) {
      const chosen = listenState.opts[i];

  /* ══════════ 卡片左右滑 ══════════ */
  let drag = null;
  let suppressClick = 0;

  function resetDrag() {
    const wrap = document.querySelector(".card-wrap");
    if (wrap) { wrap.style.transition = ""; wrap.style.transform = ""; wrap.style.opacity = ""; }
    drag = null;
  }
  function fling(visual, move) {
    const wrap = document.querySelector(".card-wrap");
    if (wrap) {
      wrap.style.transition = "transform .24s ease-out, opacity .24s";
      wrap.style.transform = "translateX(" + visual * 620 + "px) rotate(" + visual * 10 + "deg)";
      wrap.style.opacity = "0";
    }
    suppressClick = now() + 350;
    window.setTimeout(function () {
      const ok = step(move);
      if (!ok) {
        // 到边界了：把卡片拉回来
        const w2 = document.querySelector(".card-wrap");
        if (w2) {
          w2.style.transition = "transform .26s cubic-bezier(.2,.9,.3,1), opacity .26s";
          w2.style.transform = "";
          w2.style.opacity = "";
        }
        toast(move < 0 ? "已经是第一个了" : "已经是最后一个了");
      }
    }, 160);
    drag = null;
  }

  document.addEventListener("pointerdown", function (e) {
    if (mode !== "card" || finished || !cur()) return;
    if (!e.target || !e.target.closest) return;
    if (!e.target.closest(".card")) return;
    if (e.target.closest(".speak-btn")) return;
    drag = { x: e.clientX, y: e.clientY, dx: 0, moved: false };
  });

  document.addEventListener("pointermove", function (e) {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved) {
      if (Math.abs(dx) < 8) return;
      if (Math.abs(dx) <= Math.abs(dy)) { drag = null; return; }
    }
    drag.moved = true;
    drag.dx = dx;
    const wrap = document.querySelector(".card-wrap");
    if (wrap) {
      wrap.style.transition = "none";
      wrap.style.transform = "translateX(" + dx + "px) rotate(" + dx * 0.03 + "deg)";
    }
  }, { passive: true });

  document.addEventListener("pointerup", function () {
    if (!drag) return;
    const dx = drag.dx, moved = drag.moved;
    if (moved && Math.abs(dx) > 62) {
      // 向右拖 = 回到上一个（像翻相册），向左拖 = 下一个
      fling(dx > 0 ? 1 : -1, dx > 0 ? -1 : 1);
      return;
    }
    if (moved) { resetDrag(); suppressClick = now() + 120; return; }
    drag = null;
  });

  document.addEventListener("pointercancel", function () { if (drag) resetDrag(); });

  /* 词库多选：按住 220ms 之后滑动 = 连选（列表照常跟着滚）；短按仍是点选 */
  document.addEventListener("pointerdown", function (e) {
    if (!libSel) return;

    const row = t && t.closest ? t.closest("[data-librow]") : null;
    if (!row) return;
    const en = row.dataset.librow;
    libDrag = { en: en, val: !libSel.has(en), armed: false, timer: 0, last: en };
    libDrag.timer = window.setTimeout(function () {
      if (!libDrag) return;
      libDrag.armed = true;
      if (libDrag.val) libSel.add(libDrag.en); else libSel.delete(libDrag.en);
      paintPick(libDrag.en);
      updateMultiFoot();
      buzz("tap");
    }, 220);
  });

  document.addEventListener("pointermove", function (e) {
    if (!libSel || !libDrag) return;
    if (!libDrag.armed) {
      // 按不满 220ms 就动了 → 用户是在滚列表，不进入拖选
      if (libDrag.timer) window.clearTimeout(libDrag.timer);
      libDrag = null;
      return;
    }
    const el = document.elementFromPoint ? document.elementFromPoint(e.clientX, e.clientY) : null;
    const row = el && el.closest ? el.closest("[data-librow]") : null;
    if (!row) return;
    const en = row.dataset.librow;
    if (en === libDrag.last) return;
    libDrag.last = en;
    if (libDrag.val) libSel.add(en); else libSel.delete(en);
    paintPick(en);
    updateMultiFoot();
  }, { passive: true });

    if (t.closest("#catBtn")) {

  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT" && e.target.type === "number") return;
    if (e.target && e.target.id === "spellIn") {
      if (e.key === "Enter") {
        if (spellState && spellState.answered) advance(); else submitSpell();
        e.preventDefault();
      }
      return;
    }
    if (e.target && e.target.tagName === "TEXTAREA") return;

    const k = e.key;
    // 在朗读材料 / 听力 / 对话那几页里，1/2/空格不该偷偷给单词判分
    if (area !== "word") return;

    // 拼写模式：焦点不在输入框时 Enter 也要能用
    if (mode === "spell" && cur() && !finished && k === "Enter") {
      const inp = document.getElementById("spellIn");
      if (spellState && spellState.answered) { e.preventDefault(); advance(); }
      else if (inp && document.activeElement === inp) { e.preventDefault(); submitSpell(); }
      else if (inp) { e.preventDefault(); inp.focus(); }
      return;
    }
    if (mode === "card" && cur() && !finished) {
      if (k === " ") { e.preventDefault(); toggleCard(); return; }
      if (k === "Enter") { e.preventDefault(); grade(true); advance(); return; }
      if (k === "1") { e.preventDefault(); grade(false); advance(); return; }
      if (k === "2") { e.preventDefault(); grade(true); advance(); return; }
      if (k === "ArrowLeft") { e.preventDefault(); step(-1); return; }
      if (k === "ArrowRight") { e.preventDefault(); step(1); return; }
      if (k === "r" || k === "R") { speak(cur().en); return; }
    }
    if ((mode === "quiz" || mode === "listen") && cur() && !finished) {
      if (/^[1-4]$/.test(k)) {
        e.preventDefault();
        const answered = mode === "quiz" ? (quiz && quiz.answered) : (listenState && listenState.answered);

        pickOpt(Number(k) - 1);

      if (k === "Enter") {
        const answered = mode === "quiz" ? (quiz && quiz.answered) : (listenState && listenState.answered);
        if (answered) { e.preventDefault(); advance(); }
        return;
      }
      if (k === "r" || k === "R") { speak(cur().en); return; }
    }
  });
