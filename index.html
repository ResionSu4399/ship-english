<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="轮机背词">
<title>轮机背词</title>
<style>
/* ══════════════════════════════════════════════════════════════
   两套主题：默认夜间（深），[data-theme="light"] 换成白天。
   颜色一律走变量 —— 换主题只改下面两块，别在别处写死颜色，
   否则白天模式下会有一块是黑的。
   ══════════════════════════════════════════════════════════════ */
:root {
  --bg: #0b1014;
  --bg2: #10171d;
  --panel: #151e26;
  --panel2: #1b262f;
  --line: #24323d;
  --line2: #1b262f;
  --txt: #e8f1f4;
  --dim: #8ba0ab;
  --dim2: #5d7079;
  --dim3: #4a6470;
  --acc: #35e0c9;
  --acc2: #6ee7ff;
  --acc-soft: rgba(53, 224, 201, .12);
  --ok: #38d67f;
  --bad: #ff6b6b;
  --warn: #ffc857;
  --r: 18px;

  /* 结构性颜色：浅色主题只覆盖这一组 */
  --glow1: #14313a;
  --glow2: #16283f;
  --input-bg: #0c131a;
  --sheet-bg: #111a21;
  --card1: #17222b;
  --card2: #101820;
  --cardB1: #16252c;
  --cardB2: #101a1e;
  --stat2: #121a20;
  --tabon1: #22323d;
  --tabon2: #1a262f;
  --barbg: #1a252d;
  --lvbg: #2c3d49;
  --upd1: #16232b;
  --upd2: #111a21;
  --maskbg: #04070acc;
  --seg-bg: #0c131a;
  --toolbg: #ffffff08;
  --idxbg: #ffffff0d;
  --oktxt: #b9f5d3;
  --badtxt: #ffd2d2;
  --shadowed: #00000066;
  --shadowdeep: #00000099;
  --switchbg: #22323d;
  --switchknob: #8ba0ab;
  --splash1: #0e1a20;
  --splash2: #0a1216;
  --inset: #ffffff0a;
  --toastbg: #1e2c36;
  --toastline: #2f4756;
}

/* 白天：底色偏冷的浅灰蓝，别用纯白，太阳底下刺眼 */
[data-theme="light"] {
  --bg: #f1f6f8;
  --bg2: #e9f1f4;
  --panel: #ffffff;
  --panel2: #f1f7fa;
  --line: #d3e1e8;
  --line2: #e4edf1;
  --txt: #10222a;
  --dim: #4d6772;
  --dim2: #77919c;
  --dim3: #93a9b2;
  --acc: #0a8a7e;
  --acc2: #116f9e;
  --acc-soft: rgba(10, 138, 126, .1);
  --ok: #15803d;
  --bad: #cc3327;
  --warn: #a56400;

  --glow1: #ddeff1;
  --glow2: #e2ecfa;
  --input-bg: #ffffff;
  --sheet-bg: #fbfdfe;
  --card1: #ffffff;
  --card2: #edf5f7;
  --cardB1: #f8fdfe;
  --cardB2: #eaf4f7;
  --stat2: #f2f8fa;
  --tabon1: #e4f2f3;
  --tabon2: #ffffff;
  --barbg: #e0eaee;
  --lvbg: #ccdbe2;
  --upd1: #ffffff;
  --upd2: #eff8f9;
  --maskbg: #16262c66;
  --seg-bg: #f1f7fa;
  --toolbg: #0b1b2210;
  --idxbg: #0b1b2214;
  --oktxt: #0c5a2a;
  --badtxt: #7a1710;
  --shadowed: #0d243014;
  --shadowdeep: #0d24301f;
  --switchbg: #dae5ea;
  --switchknob: #93a9b2;
  --splash1: #ffffff;
  --splash2: #eaf4f7;
  --inset: #ffffff;
  --toastbg: #ffffff;
  --toastline: #cfe0e6;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html {
  height: 100%;
  /* 底色也铺在根上：WebView 里页面画不到的地方（缩放、安全区、窗口比内容高）
     露出来的是这层，而不是壳的 #0b1014 —— 那才是那两条"黑边" */
  background: var(--bg);
}

body {
  margin: 0;
  overflow-x: hidden;   /* 窄屏下有任何一处撑宽，都别让整页横滑 */
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background:
    radial-gradient(1100px 620px at 12% -12%, var(--glow1) 0%, transparent 60%),
    radial-gradient(900px 520px at 96% 6%, var(--glow2) 0%, transparent 58%),
    var(--bg);
  color: var(--txt);
  min-height: 100vh;
  min-height: 100dvh;              /* 手机上看的是这块：跟着可视高度走，别留尾巴 */
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 18px 14px 40px;
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transition: background-color .25s, color .25s;
}

/* 内容撑满一屏：卡片跟着长，进度条和页码沉到底，别让底下空一大块 */
.app {
  width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 14px;
  min-height: calc(100vh - 66px);
  min-height: calc(100dvh - 66px);
}
/* 子项一律不压缩：列表拉长时 chips / 统计不能被吃掉 */
.app > * { flex: 0 0 auto; }
/* 但「舞台」要吃掉剩下的高度（只在卡片模式里，别的模式内容高度本身就不定） */
.app > .stage { flex: 1 1 auto; }
/* 卡片模式：整组（卡 + 两个按钮 + 那行提示）在高屏上居中，卡片自己也跟着长一点 */
.stage:has(> .card-wrap) { display: flex; flex-direction: column; justify-content: center; }
.stage:has(> .card-wrap) .card { min-height: clamp(300px, 42dvh, 470px); }

/* ── 顶部 ── */
.hd { display: flex; align-items: center; gap: 12px; padding: 2px 4px; }
.brand { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.brand h1 {
  margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .3px;
  display: flex; align-items: center; gap: 8px;
}
.brand h1 .dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--acc);
  box-shadow: 0 0 12px var(--acc);
}
.brand .sub { font-size: 11.5px; color: var(--dim2); letter-spacing: .4px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel); color: var(--dim); font-size: 16px; cursor: pointer;
  display: grid; place-items: center; transition: .18s;
}
.icon-btn:hover { color: var(--acc); border-color: #2f4756; transform: translateY(-1px); }

/* ── 内容分区：四个内容入口（背单词 / 朗读 / 听力 / 对话）+「⋯」放词库 ── */
.areas { display: flex; gap: 6px; position: relative; }
.areas-main {
  flex: 1; display: flex; gap: 2px; padding: 4px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 14px;
}
.area {
  position: relative; flex: 1 1 0; min-width: 0;
  padding: 9px 2px; border: 0; border-radius: 11px; background: transparent;
  color: var(--dim); font-size: 12px; font-family: inherit; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  transition: .16s; white-space: nowrap; letter-spacing: .2px;
}
.area:hover { color: var(--txt); }
.area.on {
  background: linear-gradient(180deg, var(--tabon1), var(--tabon2));
  color: var(--acc); box-shadow: 0 2px 10px var(--shadowed); font-weight: 620;
}
/* 选中那条下面再加一道短线，扫一眼就知道现在在哪 */
.area.on::after {
  content: ""; position: absolute; left: 50%; bottom: 3px;
  width: 16px; height: 2px; border-radius: 2px; margin-left: -8px; background: var(--acc);
}
.area .soon {
  font-size: 9px; letter-spacing: .4px; color: var(--warn);
  border: 1px solid rgba(255, 200, 87, .5); border-radius: 4px; padding: 0 3px; line-height: 1.5;
}
.area-more {
  flex: 0 0 auto; width: 46px; border: 1px solid var(--line); border-radius: 14px;
  background: var(--panel); color: var(--dim); font: inherit; font-size: 16px;
  line-height: 1; cursor: pointer; transition: .16s;
  display: flex; align-items: center; justify-content: center;
}
.area-more:hover { color: var(--txt); border-color: #2f4756; }
.area-more.on { color: var(--acc); border-color: rgba(53, 224, 201, .5); box-shadow: 0 2px 10px var(--shadowed); }
.more-pop {
  display: none; position: absolute; right: 0; top: calc(100% + 7px); z-index: 45;
  min-width: 190px; padding: 6px; border-radius: 14px;
  background: var(--sheet-bg); border: 1px solid var(--line);
  box-shadow: 0 16px 36px var(--shadowdeep);
}
.more-pop.show { display: block; }
.more-pop button {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 10px; border: 0; border-radius: 10px; background: transparent;
  color: var(--dim); font: inherit; font-size: 13px; cursor: pointer; text-align: left;
}
.more-pop button:hover { background: var(--inset); color: var(--txt); }
.more-pop .soon {
  font-size: 9px; letter-spacing: .4px; color: var(--warn);
  border: 1px solid rgba(255, 200, 87, .5); border-radius: 4px; padding: 0 3px; line-height: 1.5;
}
/* 切到别的分区时，背单词那一套统计 / 筛选 / 模式都不该留着 */
.app.solo .stats, .app.solo .chips, .app.solo .tabs, .app.solo .progress { display: none; }

/* ── 统计：四个方块都能点开看明细 ── */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat {
  display: flex; flex-direction: column; align-items: flex-start; text-align: left;
  background: linear-gradient(180deg, var(--panel) 0%, var(--stat2) 100%);
  border: 1px solid var(--line); border-radius: 14px; padding: 9px 10px;
  font: inherit; color: var(--txt); cursor: pointer; transition: .16s;
}
.stat:hover { border-color: #2f4756; transform: translateY(-1px); }
.stat:active { transform: translateY(0); }
.stat .k { font-size: 10.5px; color: var(--dim2); letter-spacing: .7px; text-transform: uppercase; }
.stat .v { font-size: 18px; font-weight: 660; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 11px; color: var(--dim2); font-weight: 400; margin-left: 2px; }
.stat.hot .v { color: var(--acc); }

/* ── 筛选 chips ── */
.chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; padding: 6px 12px; border-radius: 999px; font-size: 12.5px;
  border: 1px solid var(--line); background: var(--panel); color: var(--dim);
  cursor: pointer; transition: .16s; white-space: nowrap;
}
.chip:hover { color: var(--txt); border-color: #2f4756; }
.chip.on { background: rgba(53, 224, 201, .12); border-color: rgba(53, 224, 201, .5); color: var(--acc); }
.chip .n { opacity: .55; font-size: 11px; margin-left: 3px; }

/* 第二排：分类。单词多了以后第一排只留四个常用筛，分类单占一行横向滑 */
.chips.cats { margin-top: -7px; gap: 6px; }
/* 右边留一道渐隐，提示这排还能往左滑 */
.chips.cats {
  -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 30px), transparent 100%);
  mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 30px), transparent 100%);
}
.chip.sm { font-size: 11.5px; padding: 5px 10px; border-radius: 9px; color: var(--dim2); }
.chip.sm:hover { color: var(--txt); }
.chip.sm.on { color: var(--acc); }
.cats-label {
  flex: 0 0 auto; align-self: center; font-size: 10.5px; letter-spacing: 1px;
  color: var(--dim2); padding-right: 2px;
}

/* ── 模式 tabs ── */
.tabs {
  display: flex; gap: 4px; padding: 4px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 14px;
}
.tab {
  flex: 1 1 0; min-width: 0; padding: 9px 4px; border: 0; border-radius: 11px; background: transparent;
  color: var(--dim); font-size: 13px; cursor: pointer; transition: .16s;
  font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 5px;
}
.tab:hover { color: var(--txt); }
.tab.on { background: linear-gradient(180deg, var(--tabon1), var(--tabon2)); color: var(--acc); box-shadow: 0 2px 10px var(--shadowed); }
.tab .kbd { font-size: 9.5px; opacity: .5; border: 1px solid currentColor; border-radius: 4px; padding: 0 3px; }

/* ── 舞台 ── */
.stage { position: relative; min-height: 340px; }

/* 卡片翻转 */
.card-wrap {
  perspective: 1600px;
  transition: transform .3s cubic-bezier(.2, .9, .3, 1), opacity .3s;
  will-change: transform;
}
.card {
  position: relative; width: 100%; min-height: 300px; transform-style: preserve-3d;
  transition: transform .5s cubic-bezier(.4, .05, .2, 1); cursor: pointer;
  touch-action: pan-y;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.card.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: var(--r); padding: 26px 22px;
  touch-action: pan-y;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; gap: 14px; border: 1px solid var(--line);
  background: linear-gradient(160deg, var(--card1) 0%, var(--card2) 100%);
  box-shadow: 0 18px 44px -22px var(--shadowdeep), inset 0 1px 0 var(--inset);
  overflow-y: auto;
}
.face::after {
  content: ""; position: absolute; inset: 0; border-radius: var(--r); pointer-events: none;
  background: radial-gradient(520px 200px at 50% 0%, rgba(53, 224, 201, .07), transparent 70%);
}
.face.back {
  transform: rotateY(180deg);
  background: linear-gradient(160deg, var(--cardB1) 0%, var(--cardB2) 100%);
}
.cat-tag {
  font-size: 10.5px; letter-spacing: 1.2px; color: var(--dim2); text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px;
}
.word {
  font-size: clamp(26px, 6.4vw, 40px); font-weight: 640; line-height: 1.22;
  letter-spacing: -.4px; word-break: break-word;
}
.pos { font-size: 12.5px; color: var(--acc2); font-style: italic; opacity: .8; }
.meta-line {
  display: flex; align-items: baseline; justify-content: center; gap: 9px; flex-wrap: wrap;
  max-width: 94%;
}
.ipa {
  font-size: 15px; color: var(--acc2); opacity: .92; line-height: 1.5;
  letter-spacing: .2px; word-break: break-word;
  font-family: "Lucida Sans Unicode", "Segoe UI", "DejaVu Sans", "Arial Unicode MS", system-ui, sans-serif;
}
.hom {
  font-size: 13.5px; color: var(--dim); line-height: 1.6; max-width: 94%;
  display: flex; align-items: center; justify-content: center; gap: 7px; flex-wrap: wrap;
}
.hom.small { font-size: 12px; }
.hom-tag {
  flex: 0 0 auto; font-size: 9.5px; letter-spacing: 1.2px; color: var(--dim2);
  border: 1px solid var(--line); border-radius: 999px; padding: 1px 6px; line-height: 1.5;
}
.back-word { font-size: 12.5px; color: var(--dim2); line-height: 1.6; }
.zh { font-size: clamp(22px, 5.4vw, 32px); font-weight: 620; color: var(--txt); }
.phrase {
  font-size: 13.5px; color: var(--dim); line-height: 1.6; max-width: 92%;
  border-left: 2px solid rgba(53, 224, 201, .45); padding-left: 10px; text-align: left;
}
.hint { font-size: 11.5px; color: var(--dim2); letter-spacing: .3px; }
.card-tools {
  position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 3;
}
.tool-btn {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--toolbg); color: var(--dim); cursor: pointer;
  font-size: 15px; display: grid; place-items: center; transition: .16s; padding: 0;
}
.tool-btn:hover { color: var(--acc); border-color: rgba(53, 224, 201, .5); }
.tool-btn.flip-btn { font-size: 13px; font-weight: 640; letter-spacing: .5px; }
.tool-btn.on { color: var(--warn); border-color: rgba(255, 200, 87, .55); background: rgba(255, 200, 87, .12); }

/* 操作按钮 */
.actions { display: flex; gap: 10px; margin-top: 14px; }
.btn {
  flex: 1; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--panel); color: var(--txt); font-size: 14.5px; font-weight: 560;
  font-family: inherit; cursor: pointer; transition: .16s; display: flex;
  align-items: center; justify-content: center; gap: 7px;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.99); }
.btn.ok:hover { border-color: rgba(56, 214, 127, .6); color: var(--ok); background: rgba(56, 214, 127, .07); }
.btn.bad:hover { border-color: rgba(255, 107, 107, .6); color: var(--bad); background: rgba(255, 107, 107, .07); }
.btn.primary {
  background: linear-gradient(180deg, rgba(53, 224, 201, .18), rgba(53, 224, 201, .08));
  border-color: rgba(53, 224, 201, .45); color: var(--acc);
}
.btn.primary:hover { background: rgba(53, 224, 201, .22); }
.btn:disabled { opacity: .4; cursor: default; transform: none; }
.btn .kbd { font-size: 10px; opacity: .55; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }

/* ── 测验 ── */
.q-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; }
.q-prompt {
  font-size: clamp(24px, 5.6vw, 34px); font-weight: 650; line-height: 1.25;
  padding: 22px 6px 6px; letter-spacing: -.3px;
}
.q-sub { font-size: 13px; color: var(--dim2); padding: 0 6px 16px; }
.opts { display: grid; gap: 9px; }
.opt {
  display: flex; align-items: center; gap: 11px; padding: 14px 15px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--panel); color: var(--txt);
  font-size: 15px; font-family: inherit; cursor: pointer; text-align: left; transition: .15s;
  width: 100%;
}
.opt:hover:not(.done) { border-color: #33505e; background: var(--panel2); transform: translateX(2px); }
.opt .idx {
  flex: 0 0 22px; height: 22px; border-radius: 7px; background: var(--idxbg); color: var(--dim2);
  font-size: 11.5px; display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
.opt.correct { border-color: rgba(56, 214, 127, .65); background: rgba(56, 214, 127, .1); color: var(--oktxt); }
.opt.correct .idx { background: rgba(56, 214, 127, .25); color: var(--ok); }
.opt.wrong { border-color: rgba(255, 107, 107, .6); background: rgba(255, 107, 107, .1); color: var(--badtxt); animation: shake .32s; }
.opt.wrong .idx { background: rgba(255, 107, 107, .22); color: var(--bad); }
.opt.done { cursor: default; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

/* ── 拼写 ── */
.spell-box { display: flex; flex-direction: column; gap: 11px; }
.spell-input {
  width: 100%; padding: 15px 16px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--input-bg); color: var(--txt); font-size: 19px; font-family: inherit;
  letter-spacing: .3px; outline: none; transition: .16s;
}
.spell-input:focus { border-color: rgba(53, 224, 201, .55); box-shadow: 0 0 0 3px rgba(53, 224, 201, .09); }
.spell-input.ok { border-color: rgba(56, 214, 127, .7); box-shadow: 0 0 0 3px rgba(56, 214, 127, .12); }
.spell-input.bad { border-color: rgba(255, 107, 107, .7); box-shadow: 0 0 0 3px rgba(255, 107, 107, .12); }
.feedback { font-size: 13.5px; line-height: 1.65; min-height: 22px; padding: 0 4px; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }
.feedback em { color: var(--txt); font-style: normal; font-weight: 600; }

/* ── 列表 ── */
.search-box { margin-bottom: 10px; }
.search-input {
  width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--input-bg); color: var(--txt); font-size: 14px; font-family: inherit;
  outline: none; transition: .16s;
}
.search-input:focus { border-color: rgba(53, 224, 201, .5); box-shadow: 0 0 0 3px rgba(53, 224, 201, .08); }
.search-input::placeholder { color: var(--dim3); }
.search-input::-webkit-search-cancel-button { -webkit-appearance: none; height: 14px; width: 14px; background: var(--dim2); cursor: pointer; border-radius: 50%; }
.phrase-hit { color: var(--dim2); font-style: italic; }
.search-empty { text-align: center; color: var(--dim2); font-size: 13px; padding: 34px 0; }
.list { display: flex; flex-direction: column; gap: 7px; }
.list::-webkit-scrollbar { width: 6px; }
.list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.row {
  display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 11px;
  padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel); cursor: pointer; transition: .14s;
}
.row:hover { background: var(--panel2); border-color: #33505e; }
.lv { display: inline-flex; gap: 3px; vertical-align: middle; align-items: center; }
.lv i { display: block; width: 4px; height: 14px; border-radius: 2px; background: var(--lvbg); }
.lv i.f { background: var(--acc); }
.row .en { font-size: 14.5px; font-weight: 560; }
.row .zh2 { font-size: 12px; color: var(--dim2); margin-top: 2px; }
.pos-inline { color: var(--dim2); font-size: 11.5px; font-style: italic; font-weight: 400; }
.ipa2 {
  margin-left: 8px; font-size: 11.5px; color: var(--dim2); letter-spacing: .1px;
  font-family: "Lucida Sans Unicode", "Segoe UI", "DejaVu Sans", system-ui, sans-serif;
}
.row .fav { font-size: 15px; color: var(--dim2); background: none; border: 0; cursor: pointer; padding: 4px; }
.row .fav.on { color: var(--warn); }

/* ── 进度条 ── */
.progress { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
.bar { flex: 1; height: 5px; border-radius: 3px; background: var(--barbg); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--acc2), var(--acc)); transition: width .35s; }
.progress .t { font-size: 11.5px; color: var(--dim2); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ── 开屏更新横幅 ── */
.banner {
  display: none; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px;
  border: 1px solid rgba(53, 224, 201, .45);
  background: linear-gradient(180deg, rgba(53, 224, 201, .16), rgba(53, 224, 201, .06));
}
.banner.show { display: flex; }
.banner .bn-txt { flex: 1; font-size: 13px; color: var(--txt); }
.banner .bn-txt b { color: var(--acc); font-weight: 650; }
.banner .bn-go {
  border: 0; background: var(--acc); color: #06211d; font-weight: 700; font-size: 13px;
  padding: 7px 15px; border-radius: 10px; cursor: pointer; font-family: inherit;
}
.banner .bn-x {
  border: 0; background: none; color: var(--dim2); font-size: 15px; cursor: pointer; padding: 2px 4px;
}

/* ── 设置里的更新卡片与分节标题 ── */
.upd-card {
  border: 1px solid var(--line); border-radius: 16px; padding: 12px 13px; margin-bottom: 4px;
  background: linear-gradient(180deg, var(--upd1) 0%, var(--upd2) 100%);
}
.upd-row { display: flex; align-items: center; gap: 10px; }
.upd-cur { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.upd-cur b { font-size: 17px; color: var(--acc); font-variant-numeric: tabular-nums; }
.upd-cur small { font-size: 11.5px; color: var(--dim2); }
.mini.primary { background: rgba(53, 224, 201, .16); border-color: rgba(53, 224, 201, .5); color: var(--acc); }
.mini.primary:hover { background: rgba(53, 224, 201, .24); color: var(--acc); }
.set-sec {
  margin: 22px 0 2px; font-size: 11px; letter-spacing: 1.4px; color: var(--dim2);
  display: flex; align-items: center; gap: 9px; font-weight: 600;
}
/* 组标题右边拖一条细线，扫一眼就知道分组从哪开始 */
.set-sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.set-sec:first-of-type { margin-top: 14px; }
.log-more { margin-top: 10px; }
/* ── 设置面板 ── */
.mask {
  position: fixed; inset: 0; background: var(--maskbg); backdrop-filter: blur(6px);
  display: none; align-items: flex-end; justify-content: center; z-index: 50; padding: 0;
}
.mask.show { display: flex; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  width: 100%; max-width: 860px; background: var(--sheet-bg); border: 1px solid var(--line);
  border-radius: 22px 22px 0 0; padding: 20px 18px 26px; max-height: 88vh; overflow-y: auto;
  animation: up .24s cubic-bezier(.2, .9, .3, 1);
}
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet h3 { margin: 0 0 14px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.sheet h3 .x { margin-left: auto; background: none; border: 0; color: var(--dim2); font-size: 18px; cursor: pointer; }
.set-row {
  display: flex; align-items: center; gap: 12px; padding: 11px 0;
  border-bottom: 1px solid var(--line2);
}
.set-row:last-of-type { border-bottom: 0; }
.set-row .lab { flex: 1; font-size: 14px; }
.set-row .lab small { display: block; color: var(--dim2); font-size: 11.5px; margin-top: 3px; }
.set-row input[type="number"] {
  width: 78px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--input-bg); color: var(--txt); font-size: 14px; font-family: inherit; text-align: center;
}
.set-row input[type="range"] { width: 130px; accent-color: var(--acc); }
/* 每日目标：− / 数字 / ＋ 一排放，点起来比开键盘快 */
.step-ctl { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.step-ctl input[type="number"] { width: 62px; }
.step-ctl .mini { width: 34px; padding: 7px 0; text-align: center; font-size: 15px; line-height: 1; }
.switch {
  position: relative; width: 46px; height: 26px; border-radius: 999px; background: var(--switchbg);
  border: 1px solid var(--line); cursor: pointer; transition: .2s; flex: 0 0 auto;
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--switchknob); transition: .2s;
}
.switch.on { background: rgba(53, 224, 201, .3); border-color: rgba(53, 224, 201, .5); }
.switch.on::after { left: 23px; background: var(--acc); }
#backupText { height: 118px; }
textarea.imp {
  width: 100%; height: 96px; margin-top: 8px; padding: 11px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--input-bg); color: var(--txt);
  font-size: 12.5px; font-family: ui-monospace, Consolas, monospace; line-height: 1.6;
  resize: vertical; outline: none;
}
.mini-btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
/* 在线更新的地址框 */
.url-input {
  width: 100%; margin-top: 8px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--input-bg); color: var(--txt); font-size: 12.5px; outline: none; transition: .16s;
  font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
}
.url-input:focus { border-color: rgba(53, 224, 201, .5); box-shadow: 0 0 0 3px rgba(53, 224, 201, .08); }
.url-input::placeholder { color: var(--dim3); }
.mini {
  padding: 9px 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel);
  color: var(--dim); font-size: 12.5px; font-family: inherit; cursor: pointer; transition: .15s;
}
.mini:hover { color: var(--txt); border-color: #33505e; }
.mini.danger:hover { color: var(--bad); border-color: rgba(255, 107, 107, .5); }
.mini.armed { color: var(--bad); border-color: rgba(255, 107, 107, .65); background: rgba(255, 107, 107, .1); }

/* 分段选择 */
.seg { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 11px; background: var(--seg-bg); }
.seg button {
  border: 0; background: transparent; color: var(--dim2); font-size: 11.5px; font-family: inherit;
  padding: 6px 9px; border-radius: 8px; cursor: pointer; transition: .15s; white-space: nowrap;
}
.seg button:hover { color: var(--txt); }
.seg button.on { background: var(--tabon1); color: var(--acc); }

/* ── 完成态 ── */
.done-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; min-height: 300px; text-align: center; border-radius: var(--r);
  border: 1px solid var(--line); background: linear-gradient(160deg, var(--card1), var(--card2));
  padding: 30px 22px;
}
.done-card .big { font-size: 40px; }
.done-card h2 { margin: 0; font-size: 19px; }
.done-card p { margin: 0; color: var(--dim); font-size: 13.5px; line-height: 1.7; max-width: 360px; }

/* ── 还没上线的分区（朗读材料 / 听力 / 对话） ── */
.soon-card {
  border: 1px solid var(--line); border-radius: var(--r); padding: 26px 22px;
  background: linear-gradient(160deg, var(--card1), var(--card2));
  display: flex; flex-direction: column; gap: 12px; min-height: 300px;
}
.soon-card .big-ico { font-size: 34px; line-height: 1; }
.soon-card h2 { margin: 0; font-size: 19px; display: flex; align-items: center; gap: 9px; }
.soon-card .tag {
  font-size: 10px; letter-spacing: 1px; color: var(--warn); font-weight: 400;
  border: 1px solid rgba(255, 200, 87, .5); border-radius: 999px; padding: 2px 8px;
}
.soon-card p { margin: 0; color: var(--dim); font-size: 13.5px; line-height: 1.8; max-width: 460px; }
.soon-card ul { margin: 0; padding-left: 18px; color: var(--dim); font-size: 13px; line-height: 1.9; }
.soon-card .soon-foot { margin-top: auto; padding-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ── 开屏页 ── */
.splash {
  position: fixed; inset: 0; z-index: 70; padding: 26px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(760px 420px at 50% -8%, var(--acc-soft) 0%, transparent 68%),
    linear-gradient(180deg, var(--splash1), var(--splash2));
  animation: fade .2s;
}
.splash.out { opacity: 0; transition: opacity .26s; }
.splash .sp-x {
  position: absolute; top: 16px; right: 16px; width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--toolbg); color: var(--dim);
  font-size: 15px; cursor: pointer; display: grid; place-items: center; padding: 0;
}
.splash .sp-box {
  width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center;
  gap: 14px; text-align: center;
}
.sp-title { font-size: 21px; font-weight: 700; letter-spacing: .6px; display: flex; align-items: center; gap: 9px; }
.sp-title .dot {
  width: 9px; height: 9px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 14px var(--acc);
}
.sp-ver { font-size: 11.5px; letter-spacing: 1.2px; color: var(--dim2); }
.sp-news {
  width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 16px;
  padding: 13px 16px; background: var(--acc-soft);
}
.sp-news h4 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: 1.1px; color: var(--acc); font-weight: 650; }
.sp-news ul { margin: 0; padding-left: 16px; color: var(--dim); font-size: 12.5px; line-height: 1.85; }
.sp-copy { font-size: 11px; color: var(--dim3); line-height: 1.85; }
.sp-hint { font-size: 11px; color: var(--dim2); letter-spacing: .8px; animation: spPulse 2.2s ease-in-out infinite; }
@keyframes spPulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
.sp-go { margin-top: 2px; }

/* ── 开屏页 · 今日简报（v2.8.3）──   大字号给「今天还差几个」，下面一行把待复习 / 连续 / 掌握挤在一起，
   再下面是两个按钮。原来的「这一版改了什么」整块不要了。 */
.sp-brief { width: 100%; margin: 2px 0 -2px; }
.sp-big {
  font-size: 27px; font-weight: 700; letter-spacing: -.3px; line-height: 1.3;
  font-variant-numeric: tabular-nums; word-break: break-word;
}
.sp-sub {
  font-size: 13px; color: var(--dim); margin-top: 8px; line-height: 1.7;
  font-variant-numeric: tabular-nums;
}
.sp-actions { width: 100%; display: flex; gap: 10px; margin-top: 18px; }
.sp-actions .btn { flex: 1 1 0; min-width: 0; }
.sp-upd {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 9px;
  font-size: 11.5px; color: var(--dim2); margin-top: 4px;
}
.sp-upd .sp-go { margin-top: 0; }

/* ── 拍照加词面板 ── */
.mask.add {
  align-items: stretch; justify-content: center; z-index: 60; padding: 0;
  background: var(--maskbg);
}
.add-sheet {
  width: 100%; max-width: 860px; margin: 0 auto; height: 100vh; height: 100dvh;
  display: flex; flex-direction: column; gap: 10px; padding: 16px 14px 18px;
  background: var(--bg); border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  overflow: hidden;
}
.add-head { display: flex; align-items: center; gap: 10px; }
.add-head b { font-size: 16px; }
.add-head .hint { flex: 1; }
.add-head .x {
  border: 0; background: none; color: var(--dim2); font-size: 18px; cursor: pointer; padding: 2px 6px;
}
.add-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.add-actions .mini:disabled { opacity: .45; cursor: default; }
.add-status { min-height: 16px; color: var(--acc); }
.add-shots {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; min-height: 78px;
  scrollbar-width: none; align-items: flex-start;
}
.add-shots::-webkit-scrollbar { display: none; }
.shot {
  position: relative; flex: 0 0 auto; width: 66px; height: 66px; padding: 0; cursor: pointer;
  border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--panel);
}
.shot.on { border-color: rgba(53, 224, 201, .75); box-shadow: 0 0 0 2px rgba(53, 224, 201, .22); }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot i {
  position: absolute; left: 0; right: 0; bottom: 0; font-style: normal; font-size: 9.5px;
  line-height: 15px; text-align: center; background: #000000a8; color: #fff;
}
.shot.done i { background: rgba(56, 214, 127, .9); color: #04240f; }
.shot-empty { color: var(--dim2); font-size: 12px; line-height: 1.7; padding: 10px 2px; }
.add-preview { flex: 0 0 auto; display: flex; gap: 10px; align-items: flex-start; max-height: 30vh; }
.add-preview img {
  max-height: 30vh; max-width: 100%; border-radius: 12px; border: 1px solid var(--line);
  object-fit: contain; background: #ffffff;
}
.add-preview .mini { flex: 0 0 auto; }
.add-preview img { cursor: zoom-in; }
.prev-btns { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

/* 识别结果太离谱时的提醒条 */
.add-warn {
  display: none; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 12px;
  border: 1px solid rgba(255, 200, 87, .5); background: rgba(255, 200, 87, .1);
  font-size: 12px; color: var(--txt); line-height: 1.6;
}
.add-warn span { flex: 1; }
.add-warn .mini { flex: 0 0 auto; }

/* 全屏看图：双指缩放做不到就给你 1×→4× 加滚动，够看清手写 */
.viewer {
  position: fixed; inset: 0; z-index: 80; display: none; flex-direction: column;
  background: #05090ccc;
}
.viewer.show { display: flex; }
.viewer-scroll { flex: 1 1 auto; overflow: auto; -webkit-overflow-scrolling: touch; }
.viewer-scroll img { display: block; margin: 0 auto; width: 100%; }
.viewer-bar {
  flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px;
  padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--sheet-bg); border-top: 1px solid var(--line);
}
.viewer-bar .zoom-lv {
  font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 48px; text-align: center;
}
.add-list {
  flex: 1 1 auto; min-height: 90px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
  padding-right: 2px;
}
.add-row { display: grid; grid-template-columns: 20px 1fr 1fr 28px; gap: 6px; align-items: center; }
.add-row .rn { font-size: 10.5px; color: var(--dim2); text-align: right; }
.add-row input {
  width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--input-bg); color: var(--txt); font-size: 13.5px; font-family: inherit; outline: none;
}
.add-row input:focus { border-color: rgba(53, 224, 201, .55); box-shadow: 0 0 0 2px rgba(53, 224, 201, .09); }
.add-row .del { border: 0; background: none; color: var(--dim2); font-size: 13px; cursor: pointer; padding: 4px; }
.add-row .del:hover { color: var(--bad); }
.add-foot { display: flex; gap: 8px; align-items: center; }
.add-foot .mini:first-child { flex: 0 0 auto; }
.add-foot .primary { flex: 1; }

/* ── 词库 ── */
.bank-wrap { display: flex; flex-direction: column; gap: 12px; }
.bank-intro { line-height: 1.85; }
.bank-list { display: flex; flex-direction: column; gap: 8px; }
.bank-item {
  display: flex; align-items: center; gap: 10px; padding: 12px 13px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--panel);
}
.bank-item .bi-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.bank-item .bi-main b { font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bank-item small { color: var(--dim2); font-size: 11.5px; }
.bank-detail { display: flex; flex-direction: column; gap: 10px; }
.bank-bar { display: flex; gap: 8px; align-items: center; }
.bank-name {
  flex: 1; min-width: 0; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--input-bg); color: var(--txt); font-size: 14px; font-family: inherit; outline: none;
}
.bank-name:focus { border-color: rgba(53, 224, 201, .55); }
.bank-rows { display: flex; flex-direction: column; gap: 6px; }
.bk-used {
  font-size: 10px; color: var(--ok); border: 1px solid rgba(56, 214, 127, .4);
  border-radius: 6px; padding: 2px 4px; white-space: nowrap; text-align: center;
}
.bank-foot { display: flex; gap: 8px; }
.bank-foot .primary { flex: 1; }

/* 拍照加词：导入到哪儿 */
.add-target-row { display: flex; gap: 8px; align-items: center; }
.add-target {
  flex: 1; min-width: 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--input-bg); color: var(--txt); font-size: 12.5px; font-family: inherit; outline: none;
}

/* ── 跟读 ── */
.read-sheet {
  width: 100%; max-width: 560px; margin: 0 auto; height: 100vh; height: 100dvh;
  display: flex; flex-direction: column; gap: 16px;
  padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--bg); border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  overflow: hidden;
}
.read-word { flex: 0 0 auto; text-align: center; padding: 18px 6px 6px; display: flex; flex-direction: column; gap: 8px; }
.rw-en { font-size: clamp(26px, 7vw, 40px); font-weight: 640; letter-spacing: -.3px; word-break: break-word; }
.rw-ipa { color: var(--acc2); font-size: 14px; }
.rw-zh { color: var(--dim); font-size: 14px; }
.read-level { height: 8px; border-radius: 4px; background: var(--barbg); overflow: hidden; }
.read-level i {
  display: block; height: 100%; width: 0; border-radius: 4px;
  background: linear-gradient(90deg, var(--acc2), var(--acc)); transition: width .08s linear;
}
.read-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.read-btns .btn { flex: 1 1 40%; }
.read-score {
  flex: 1 1 auto; display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start; gap: 8px; text-align: center; overflow-y: auto;
}
.rs-num { font-size: 44px; font-weight: 700; color: var(--acc); font-variant-numeric: tabular-nums; line-height: 1.1; }
.rs-num small { font-size: 14px; color: var(--dim2); font-weight: 400; }
.rs-tip { color: var(--txt); font-size: 13.5px; line-height: 1.7; max-width: 360px; }
.rs-note { color: var(--dim3); font-size: 11px; line-height: 1.75; max-width: 330px; }

/* ── 裁剪 ── */
.viewer-scroll { position: relative; }
.viewer.cropping .viewer-scroll { touch-action: none; }
.crop-box {
  position: absolute; display: none; border: 2px dashed var(--acc);
  background: rgba(53, 224, 201, .12); pointer-events: none;
}

/* ── 轻提示 ── */.toast {
  position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%); max-width: 82vw;
  background: var(--toastbg); border: 1px solid var(--toastline); color: var(--txt);
  padding: 10px 16px; border-radius: 12px; font-size: 13px; z-index: 99;
  box-shadow: 0 12px 34px var(--shadowdeep); transition: opacity .28s;
}

.foot { text-align: center; font-size: 11px; color: var(--dim3); padding-top: 4px; font-variant-numeric: tabular-nums; }
.foot .ver { color: var(--acc); opacity: .7; }

}

/* ══════════ 词库页（教材全量词表） ══════════ */
.lib-wrap { display: flex; flex-direction: column; gap: 10px; }
.lib-tabs {

}

.lib-intro { font-size: 12px; color: var(--dim2); line-height: 1.7; }

.app.solo .lib-wrap .chips { display: flex; }
.lib-stat { display: flex; gap: 14px; font-size: 12px; color: var(--dim); flex-wrap: wrap; }
.lib-stat b { color: var(--txt); font-variant-numeric: tabular-nums; }
.lib-osus { color: var(--acc); }
.lib-rows { display: flex; flex-direction: column; gap: 6px; max-height: 54vh; overflow-y: auto; padding-right: 2px; }
.lib-row {

  border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
}
.lib-row .grow { flex: 1; min-width: 0; }
.lib-row .en { font-weight: 620; font-size: 13.5px; color: var(--txt); }
.lib-row .ipa { color: var(--dim2); font-size: 11px; margin-left: 6px; }
.lib-row .zh { color: var(--dim); font-size: 12px; margin-top: 2px; }

.lib-row .mini { flex: 0 0 auto; }
/* 多选：行左边一个勾，选中那行整块高亮 */
.lib-row .ck {

  border: 1px solid var(--line); background: var(--seg-bg); transition: .12s;
}
.lib-row .ck.on { background: var(--acc); border-color: var(--acc); box-shadow: 0 0 0 2px var(--acc-soft); }
.lib-row.picked { border-color: rgba(53, 224, 201, .5); background: var(--acc-soft); }
.lib-foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ══════════ 统计详情面板 ══════════ */
.sp-sheet { max-height: 78vh; overflow-y: auto; }
.sp-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.sp-num { font-size: 28px; font-weight: 720; color: var(--acc); font-variant-numeric: tabular-nums; }
.sp-num small { font-size: 13px; color: var(--dim2); font-weight: 400; margin-left: 4px; }
.sp-title { font-size: 14px; font-weight: 620; }
.sp-note { font-size: 12px; color: var(--dim2); line-height: 1.75; margin: 6px 0 10px; }
.sp-bar { height: 8px; border-radius: 999px; background: var(--barbg); overflow: hidden; margin: 8px 0 12px; }
.sp-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--acc), var(--acc2)); }
.sp-list { display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow-y: auto; }
.sp-row {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;

}
.sp-row .grow { flex: 1; min-width: 0; }
.sp-row .en { font-weight: 620; font-size: 13px; }
.sp-row .zh { color: var(--dim); font-size: 11.5px; margin-top: 1px; }
.sp-empty { padding: 20px 6px; text-align: center; color: var(--dim2); font-size: 12.5px; line-height: 1.8; }
.sp-days { display: flex; gap: 5px; align-items: stretch; height: 86px; margin: 10px 0 6px; }
.sp-days .d { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; }
.sp-days .d i {

}
.sp-days .d.on i { background: linear-gradient(180deg, var(--acc), rgba(53, 224, 201, .3)); border-color: rgba(53, 224, 201, .6); }

.sp-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ══════════ 加词时从词库备选 ══════════ */
.add-libhint { display: flex; flex-direction: column; gap: 6px; margin-top: 9px; }
.add-libhint .lh { font-size: 11.5px; color: var(--dim2); }
.add-libhint button {
  text-align: left; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--toolbg); color: var(--dim); font: inherit; font-size: 12px; cursor: pointer;
}
.add-libhint button b { color: var(--txt); font-size: 12.5px; margin-right: 6px; }

/* 拍照加词：常驻的说明 —— 只认印刷体这件事得写在前头，别让人白拍 */
.add-tip {
  margin: 2px 0 8px; padding: 8px 10px; border-radius: 10px;
  background: rgba(255, 200, 87, .10); border: 1px solid rgba(255, 200, 87, .28);

}

/* ══════════ 朗读材料 ══════════ */
.read-wrap { display: flex; flex-direction: column; gap: 10px; }
/* 切到朗读区时 .app.solo 会把背单词那排 chips 藏掉，朗读自己这排得留着（前缀写全才压得住） */
.app.solo .read-wrap .chips { display: flex; }
.mt-list {
  display: flex; flex-direction: column; gap: 10px; max-height: 62vh;
  overflow-y: auto; padding-right: 2px;
}
/* 底部查词条开着时，列表多留一截，滚到底别把最后一行盖住 */
body.wp-on .mt-list { padding-bottom: 120px; }
.mt-item { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 11px 12px; }
.mt-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.mt-n {
  min-width: 22px; height: 22px; padding: 0 5px; border-radius: 7px;
  background: var(--acc-soft); color: var(--acc); font-size: 11px;
  display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums;
}
.mt-head .mini { flex: 0 0 auto; margin-left: 0; }
.mt-head .mini:nth-of-type(1) { margin-left: auto; }
.mt-en { font-size: 13.5px; line-height: 1.85; color: var(--txt); }
.mt-en .sent { display: inline; }
/* 单个单词：朗读 / 听力 / 对话里都能点开查意思 */
.wd {
  cursor: pointer; border-radius: 4px; padding: 0 1px; transition: .12s;
  border-bottom: 1px dotted transparent;
}
.wd:hover { background: var(--acc-soft); color: var(--acc); border-bottom-color: rgba(53, 224, 201, .5); }
/* 句尾的小喇叭：念这一句 */
.sent-play {
  border: 0; background: transparent; color: var(--dim2); font-size: 11px;
  padding: 0 2px; margin-left: 1px; cursor: pointer; border-radius: 5px; vertical-align: middle;
}
.sent-play:hover { color: var(--acc); background: var(--acc-soft); }

/* 查词条：底部固定的窄条，点单词就更新，不挡列表 */
.word-pop {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  transform: translateY(120%); transition: transform .22s ease-out;
  background: var(--sheet-bg); border-top: 1px solid var(--line);
  box-shadow: 0 -12px 30px var(--shadowdeep);
  padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 6px;
}
.word-pop.show { transform: translateY(0); }
.word-pop .wp-main { display: flex; align-items: baseline; gap: 8px; font-size: 16px; color: var(--txt); }
.word-pop .wp-main b { font-size: 17px; }
.word-pop .wp-ipa { color: var(--dim2); font-size: 12px; }
.word-pop .wp-zh { font-size: 13px; color: var(--dim); line-height: 1.6; }
.word-pop .wp-zh.dim { color: var(--dim3); }
.word-pop .wp-ph { font-size: 11.5px; color: var(--dim3); }
.word-pop .wp-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.mt-zh {
  margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line);
  font-size: 12.5px; line-height: 1.85; color: var(--dim);
}
/* 跟读一整个段落时，英文块换成长文样式，别撑爆面板 */
.read-word.long .rw-en {
  font-size: 14px; line-height: 1.7; text-align: left; word-break: break-word;
  max-height: 28vh; overflow-y: auto;
}

/* ══════════ 听力 / 对话 ══════════ */
.more-pop .mn { font-size: 10.5px; color: var(--dim3); }
.ls-item, .talk-item {
  border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 11px 12px;
}
.ls-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.ls-head .mini:nth-of-type(1) { margin-left: auto; }
.ls-line { font-size: 13.5px; line-height: 1.7; color: var(--txt); display: flex; gap: 7px; }
.ls-line .who {
  flex: 0 0 auto; font-size: 10.5px; color: var(--acc); background: var(--acc-soft);
  border-radius: 5px; padding: 1px 5px; align-self: flex-start; margin-top: 4px; letter-spacing: .5px;
}
/* S1 绿、S2 蓝：跟两个音色对上，眼睛也能分谁在说 */
.ls-line .who.s2 { color: var(--acc2); background: rgba(110, 231, 255, .13); }
.ls-line .say .sent-play { margin-left: 2px; }
.ls-zh { font-size: 11.5px; color: var(--dim2); line-height: 1.7; margin: 2px 0 6px 30px; }
.ls-q {
  margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line);
  font-size: 13px; color: var(--acc); line-height: 1.7;
}
.ls-q .q-tag, .ls-a .q-tag {
  display: inline-block; min-width: 15px; text-align: center; font-size: 10px; font-weight: 700;
  border-radius: 4px; padding: 0 4px; margin-right: 6px; background: var(--acc-soft); color: var(--acc);
}
.ls-a { margin-top: 8px; font-size: 13px; color: var(--txt); line-height: 1.7; }
.ls-a .q-tag.a { background: rgba(56, 214, 127, .15); color: var(--ok); }
.talk-title { flex: 1; font-size: 13px; font-weight: 620; color: var(--txt); }
.talk-en { font-size: 13.5px; line-height: 1.85; color: var(--txt); margin-top: 6px; }
.talk-zh {
  margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line);
  font-size: 12.5px; line-height: 1.85; color: var(--dim);
}
.talk-q { font-size: 13.5px; line-height: 1.7; color: var(--txt); }
.talk-qzh { font-size: 12px; color: var(--dim2); line-height: 1.7; margin-top: 3px; }
.talk-a {
  margin-top: 9px; padding: 9px 10px; border-radius: 10px;
  background: var(--toolbg); font-size: 13px; line-height: 1.75; color: var(--txt);
}
.talk-azh { font-size: 12px; color: var(--dim2); line-height: 1.75; margin-top: 5px; }

/* 问答作答区：打字 / 说出来 / 提交比对 */
.qa-box { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.qa-in {
  width: 100%; box-sizing: border-box; min-height: 56px; resize: vertical;
  padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--input-bg); color: var(--txt); font: inherit;
  font-size: 13px; line-height: 1.6;
}
.qa-in:focus { outline: none; border-color: rgba(53, 224, 201, .5); }
.qa-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.qa-res { font-size: 12.5px; line-height: 1.8; }
.qa-score { font-size: 19px; font-weight: 720; color: var(--acc); font-variant-numeric: tabular-nums; }
.qa-score small { font-size: 11px; color: var(--dim2); font-weight: 400; }
.qa-tip { color: var(--dim2); font-size: 12px; margin-top: 1px; }
.qa-ref { margin-top: 7px; color: var(--dim); }
.qa-ref .q-hit { color: var(--ok); }
.qa-ref .q-miss { color: var(--bad); border-bottom: 1px dotted var(--bad); }

@media (min-width: 720px) {
  body { padding-top: 30px; }

}

/* ══════════════════════════════════════════════════════════════

/* 整体节奏比 v2.6 紧一点 */

.tabs { padding: 3px; border-radius: 12px; }

.back-card {
