  /* 朗读：安卓壳子里走系统 TTS（AndroidTTS），浏览器里走 Web Speech。
     Android WebView 没有 Web Speech 的实现，speechSynthesis 存在但不出声，所以必须先问原生接口。 */
  function speak(t) {
    if (!t) return;
    const text = String(t).replace(/[()（）]/g, " ").replace(/\s+/g, " ").trim();
    if (!text) return;

    if (window.AndroidTTS && typeof window.AndroidTTS.speak === "function") {
      try {
        if (!window.AndroidTTS.speak(text)) {
          const ready = window.AndroidTTS.ready ? window.AndroidTTS.ready() : false;
          if (ready || now() - bootAt > 4000) ttsWarn();
        }
        return;
      } catch (e) { /* 退到 Web Speech */ }
    }

    if (!window.speechSynthesis) { ttsWarn(); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = st.ttsRate;
      const v = voices.find((x) => /^en[-_]US/i.test(x.lang)) || voices.find((x) => /^en/i.test(x.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* 语速同步给原生 TTS（WebView 之外的安卓壳子） */
  function applyRate() {
    if (window.AndroidTTS && typeof window.AndroidTTS.setRate === "function") {
      try { window.AndroidTTS.setRate(st.ttsRate); } catch (e) {}
    }
  }

  /* ══════════ 震动 ══════════
     安卓壳子里走 AndroidHaptic（系统 Vibrator），浏览器里退到 navigator.vibrate。
     只在「手上能感觉到的地方」震：判定对错、选项对错、收藏、翻面、一轮走完、更新成功。
     打字、翻页面、开关设置都不震 —— 那些震了只会烦。 */
  function buzz(kind) {
    if (!st.haptic) return;
    const pattern = {
      tap: [0, 8],
      ok: [0, 16],
      no: [0, 26, 60, 26],
      done: [0, 30, 80, 30, 80, 70]
    }[kind] || [0, 10];
    try {
      if (window.AndroidHaptic && typeof window.AndroidHaptic.pattern === "function") {
        window.AndroidHaptic.pattern(pattern.join(","));
        return;
      }
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch (e) { /* 没有就算了 */ }
  }
  function toast(msg) {
    const d = document.createElement("div");
    d.className = "toast";
    d.textContent = msg;
    document.body.appendChild(d);
    setTimeout(() => { d.style.opacity = "0"; setTimeout(() => d.remove(), 320); }, 1500);
  }

  /* ══════════ 在线更新 ══════════
     两条路：
     1) 内容（词库 / 页面 / 样式）—— 从电脑上的目录拉一份新的单文件 HTML，存进 App 私有目录，
        刷新页面即生效。不用重装 APK，进度（localStorage）一点不动。
     2) 安装包 —— 只有安卓壳子本身改了才需要。点一下下载，下完自动叫出系统安装器。
     接口由 MainActivity 的 UpdaterBridge 提供：window.AndroidUpdate。 */
  let updPending = null;   // 最近一次 update.json
  let updAuto = false;     // 打开软件时那一次静默检查：只提示，不自动换

  function updHasApp() {
    return !!(window.AndroidUpdate && typeof window.AndroidUpdate.check === "function");
  }
  /* 现在这页是安装包里自带的，还是从网上换下来的？
     原生那边记着下过哪个版本号，对得上就是热更新来的。 */
  function hotUpdated() {
    if (!updHasApp()) return false;
    try {
      const c = window.AndroidUpdate.contentVersion ? window.AndroidUpdate.contentVersion() : "";
      return !!c && c === APP_VERSION;
    } catch (e) { return false; }
  }
  function updBase() {
    return String(st.updateUrl || UPD_DEFAULT).replace(/\/+$/, "");
  }
  function verNewer(a, b) {
    const pa = String(a || "").split("."), pb = String(b || "").split(".");
    const n = Math.max(pa.length, pb.length);
    for (let i = 0; i < n; i++) {
      const x = parseInt(pa[i], 10) || 0, y = parseInt(pb[i], 10) || 0;
      if (x !== y) return x > y;
    }
    return false;
  }

  function refreshUpdLabels() {
    const cur = document.getElementById("updCur");
    const sub = document.getElementById("updSub");
    const go = document.getElementById("updGo");
    if (cur) cur.textContent = "v" + APP_VERSION;
    if (!sub) return;
    if (!updHasApp()) {
      sub.textContent = "网页版：刷新浏览器就是最新";
      if (go) { go.textContent = "检查更新"; go.classList.remove("primary"); }
      return;
    }
    const content = safeContentVersion();
    const app = safeAppVersion();
    sub.textContent = (content && content !== APP_VERSION ? "已热更到 " + content + " · " : "")
      + "安装包 v" + (app || "?");
    const p = pendingUpdate();
    if (go) {
      go.textContent = p ? "更新到 v" + p.v : "检查更新";
      go.classList.toggle("primary", !!p);
    }
  }

  function safeAppVersion() {
    try { return window.AndroidUpdate.appVersion ? window.AndroidUpdate.appVersion() : ""; } catch (e) { return ""; }
  }
  function safeContentVersion() {
    try { return window.AndroidUpdate.contentVersion ? window.AndroidUpdate.contentVersion() : ""; } catch (e) { return ""; }
  }

  /* 有没有新版：壳新也算，内容新也算 */
  function pendingUpdate() {
    const o = updPending;
    if (!o) return null;
    // 拿不到壳的真实版本就别拿页面版本凑数，否则会把"要装包"判成"换个页面就行"
    const appV = safeAppVersion() || "0";
    const apkNew = o.apkVersion && verNewer(o.apkVersion, appV);
    const htmlNew = verNewer(o.version, APP_VERSION);
    if (!apkNew && !htmlNew) return null;
    return { apk: !!apkNew, html: htmlNew, v: o.version, apkV: o.apkVersion || o.version };
  }

  function checkUpdate(auto) {
    if (!updHasApp()) {
      toast("手机 App 里才有在线更新；网页上刷新浏览器就是最新的");
      return;
    }
    updAuto = !!auto;
    if (!updAuto) { toast("正在检查…"); refreshUpdLabels(); }
    try { window.AndroidUpdate.check(updBase()); } catch (e) { toast("调不动更新接口"); }
  }

  /* 安装包下载：一条线被掐断就换下一条。
     手机上 github.io 拉大文件经常半路 Connection reset，多备一条路能救回来。 */
  let apkQueue = [];

  function apkCandidates() {
    const o = updPending || {};
    const name = o.apk || "lunji-words.apk";
    const out = [];
    if (/^https?:/i.test(name)) out.push(name);
    const local = updBase() + "/" + String(name).replace(/^.*\//, "");
    if (out.indexOf(local) < 0) out.push(local);
    return out;
  }

  function startApkDownload() {
    if (!apkQueue.length) apkQueue = apkCandidates();
    const url = apkQueue.shift();
    if (!url) {
      toast("几条线都没下成，过一会儿再点一次「更新」");
      return;
    }
    try { window.AndroidUpdate.installApk(url); } catch (e) { toast("调不动更新接口"); }
  }

  /* 一键更新：拿现成的清单直接干，不再分两步 */
  function applyUpdate() {
    const p = pendingUpdate();
    if (!p) {
      if (updPending) { toast("已是最新 · v" + APP_VERSION); refreshUpdLabels(); }
      else checkUpdate(false);
      return;
    }
    const o = updPending;
    if (p.apk) {
      // 壳新：装壳最稳 —— 装完自带新内容，而且不用再点一次
      toast("这次要装一次新版本 v" + p.apkV + "，正在下…");
      buzz("tap");
      apkQueue = [];
      startApkDownload();
      return;
    }
    const html = o.html || "ship-words.html";
    const url = /^https?:/i.test(html) ? html : updBase() + "/" + html;
    toast("正在下 v" + p.v + "…");
    try { window.AndroidUpdate.applyContent(url, o.version); } catch (e) { toast("调不动更新接口"); }
  }

  function installApkOnline() {
    if (!updHasApp()) { toast("网页版不用装包，刷新就是最新的"); return; }
    toast("正在下安装包…");
    apkQueue = [];
    startApkDownload();
    refreshUpdLabels();
  }

  /* 原生那边的回调 */
  window.__updCheck = function (raw, err) {
    if (!raw) {
      if (!updAuto) toast("连不上：" + (err || "网络不通"));
      refreshUpdLabels();
      return;
    }
    let o = null;
    try { o = JSON.parse(raw); } catch (e) { o = null; }
    if (!o || !o.version) {
      if (!updAuto) toast("更新信息看不懂，检查一下地址");
      return;
    }
    updPending = o;
    refreshUpdLabels();
    const pd = pendingUpdate();
    if (pd) splashSayUpdate(pd);   // 开屏页还开着就直接写在它上面
    if (updAuto) {
      if (pd) { showUpdateBanner(o, pd); }
      return;
    }
    applyUpdate();
  };

  window.__updApplied = function (ok, msg) {
    if (!ok) { toast("更新没成：" + (msg || "未知原因")); return; }
    buzz("done");
    toast("已更新到 v" + ((updPending && updPending.version) || "") + "，正在重开页面");
    window.setTimeout(function () {
      try { window.AndroidUpdate.reload(); } catch (e) { try { location.reload(); } catch (e2) {} }
    }, 700);
  };

  window.__updApk = function (ok, msg) {
    if (!ok) {
      if (apkQueue.length) {
        toast("这条线断了，换一条再试…");
        startApkDownload();
        return;
      }
      toast("安装包没下成：" + (msg || "未知原因") + " —— 过一会儿再点「更新」");
      return;
    }
    apkQueue = [];
    buzz("done");
    toast("下好了，点「安装」覆盖旧版 —— 背词进度不动");
  };

  /* 从本地文件导入（不走网络）*/
  window.__imported = function (ok, msg) {
    if (!ok) { toast("导入没成：" + (msg || "未知原因")); return; }
    toast("导入好了 · " + (msg || "") + "，正在重开页面");
    window.setTimeout(function () {
      try { window.AndroidUpdate.reload(); } catch (e) { try { location.reload(); } catch (e2) {} }
    }, 600);
  };

  function importFromFile() {
    if (!updHasApp() || typeof window.AndroidUpdate.pickFile !== "function") {
      toast("这个安装包还不支持文件导入，装一次 1.8.2 以后的");
      return;
    }
    try { window.AndroidUpdate.pickFile(); } catch (e) { toast("打不开文件选择器"); }
  }

  /* ══════════ 开屏更新提示 ══════════
     打开 App 静默查一次，有新版就在顶部挂一条横幅：点「更新」一键装好，点 ✕ 今天不再烦你。 */
  function showUpdateBanner(o, p) {
    const el = document.getElementById("banner");
    if (!el) return;
    el.innerHTML = '<span class="bn-txt">有新版 <b>v' + esc(p.v) + "</b>"
      + (p.apk ? " · 要先装一次包" : "") + "</span>"
      + '<button class="bn-go" id="bnGo">更新</button>'
      + '<button class="bn-x" id="bnClose" title="先不更新">✕</button>';
    el.classList.add("show");
    const go = document.getElementById("bnGo");
    const x = document.getElementById("bnClose");
    if (go) go.addEventListener("click", function () { applyUpdate(); });
    if (x) x.addEventListener("click", function () { el.classList.remove("show"); });
  }

  /* ══════════ 开屏页 ══════════
     打开先给一眼：这是什么、这一版改了什么、版权归谁。
     点空白处或 ✕ 就关；没新版的自己 2.6 秒后走，发现新版就停住等你看。
     ⚙ → 外观 里可以整个关掉。 */
  let splashEl = null;
  let splashTimer = 0;

  function showSplash() {
    if (st.splashOn === false) return;
    if (document.getElementById("splash")) return;
    const cur = CHANGELOG[0] || { add: [] };
    const items = (cur.add || []).slice(0, 3)
      .map((t) => "<li>" + esc(t) + "</li>").join("");
    const el = document.createElement("div");
    el.className = "splash";
    el.id = "splash";
    el.innerHTML =
      '<button class="sp-x" id="spClose" title="关掉">✕</button>'
      + '<div class="sp-box">'
      + '<div class="sp-title"><span class="dot"></span>轮机英语 · 背词</div>'
      + '<div class="sp-ver">v' + esc(APP_VERSION) + " · " + esc(APP_DATE) + "</div>"
      + '<div class="sp-news"><h4>这一版</h4><ul>' + (items || "<li>" + esc(WORDS.length + " 个词等你背") + "</li>") + "</ul></div>"
      + '<div class="sp-copy">© 2026 轮机英语背词 · 词条取自《轮机英语》（大连海事大学出版社）<br>'
      + "自己学习用，不对外分发</div>"
      + '<div class="sp-hint" id="spHint">点击空白处或 ✕ 继续</div>'
      + "</div>";
    document.body.appendChild(el);
    splashEl = el;
    el.addEventListener("click", closeSplash);
    splashTimer = window.setTimeout(closeSplash, 2600);
  }

  function closeSplash() {
    if (!splashEl) return;
    const el = splashEl;
    splashEl = null;
    window.clearTimeout(splashTimer);
    el.classList.add("out");
    window.setTimeout(function () { try { el.remove(); } catch (e) {} }, 280);
  }

  /* 开屏页还开着的时候发现了新版：停住不自动关，把更新提示换进去 */
  function splashSayUpdate(p) {
    if (!splashEl || !p) return;
    window.clearTimeout(splashTimer);
    const box = splashEl.querySelector(".sp-news");
    if (box) {
      box.innerHTML = '<h4>发现新版 v' + esc(p.v) + "</h4><ul>"
        + "<li>点下面的「更新」直接换，背词进度一点不动</li>"
        + "<li>不想现在更，点空白处或 ✕ 关掉，下次打开还会提</li>"
        + "<li>现在这版 v" + esc(APP_VERSION) + " 照常用</li></ul>";
    }
    const hint = splashEl.querySelector("#spHint");
    if (hint) hint.textContent = "点空白处或 ✕ 关掉开屏页";
    if (splashEl.querySelector(".sp-go")) return;
    const go = document.createElement("button");
    go.className = "mini primary sp-go";
    go.textContent = "更新到 v" + p.v;
    go.addEventListener("click", function (ev) { ev.stopPropagation(); applyUpdate(); });
    const box2 = splashEl.querySelector(".sp-box");
    if (box2) box2.appendChild(go);
  }

  /* ══════════ 队列 ══════════ */
  const cats = () => {
    const m = {};
    WORDS.forEach((w) => { m[w.cat || "未分类"] = (m[w.cat || "未分类"] || 0) + 1; });
    return m;
  };
  function inFilter(w) {
    if (filter === "all") return true;
    if (filter === "新词") return card(w.en).box === 0;
    if (filter === "错词") return card(w.en).wrong > 0 && card(w.en).box < 4;
    if (filter === "收藏") return !!card(w.en).fav;
    return (w.cat || "未分类") === filter;
  }
  function buildQueue() {
    const list = WORDS.filter(inFilter);
    shuffle(list);
    const t = now();
    list.sort((x, y) => {
      const a = card(x.en), b = card(y.en);
      if (a.box !== b.box) return a.box - b.box;
      const pa = a.due <= t ? 0 : 1, pb = b.due <= t ? 0 : 1;
      if (pa !== pb) return pa - pb;
      if ((a.wrong > 0) !== (b.wrong > 0)) return a.wrong > 0 ? -1 : 1;
      return 0;
    });
    queue = list; qpos = 0; finished = queue.length === 0;
    cardFlipped = false; quiz = null; spellState = null; listenState = null;
  }
  const cur = () => queue[qpos] || null;

  /* ══════════ 评分 ══════════ */
  function grade(ok) {
    const w = cur();
    if (!w) return;
    const c = card(w.en);
    if (ok) {
      c.right++;
      c.box = Math.min(5, c.box + 1);
      c.due = now() + BOX_DAYS[c.box] * DAY;
    } else {
      c.wrong++;
      c.box = Math.max(0, c.box - 1);
      c.due = now() + 10 * 60000;
    }
    const t = todayStr();
    if (st.today.d !== t) st.today = { d: t, n: 0 };
    st.today.n++;
    if (st.streak.last !== t) {
      const y = todayStr(Date.now() - DAY);
      st.streak.n = st.streak.last === y ? (st.streak.n || 1) + 1 : 1;
      st.streak.last = t;
    }
    beep(ok);
    buzz(ok ? "ok" : "no");
    save();
  }

  function advance() {
    qpos++;
    cardFlipped = false; quiz = null; spellState = null; listenState = null;
    if (qpos >= queue.length) { finished = true; buzz("done"); }
    render();
    if (!finished && mode === "card") autoSpeakCurrent();
  }

  /* 翻面不重绘整个舞台，只切 class —— 这样才有真正的 3D 翻转动画 */
  function toggleCard() {
    if (mode !== "card" || finished || !cur()) return;
    cardFlipped = !cardFlipped;
    const el = document.querySelector(".card");
    if (el) el.classList.toggle("flipped", cardFlipped);
    buzz("tap");
    if (cardFlipped) speak(cur().en);   // 只在翻到背面时念，翻回来不重复
  }

  /* 纯翻词：只移动指针，不改变掌握度。dir = +1 下一个 / -1 上一个 */
  function step(dir) {
    if (mode !== "card" || !cur()) return false;
    const np = qpos + dir;
    if (np < 0 || np >= queue.length) return false;
    qpos = np;
    finished = false;
    cardFlipped = false;
    render();
    if (st.autoSpeak) autoSpeakCurrent();
    return true;
  }
  function autoSpeakCurrent() {
    if (st.autoSpeak && mode === "card" && cur()) speak(cur().en);
  }

  /* ══════════ 出题 ══════════ */
  function buildQuiz() {
    const w = cur(); if (!w) return;
    const dir = Math.random() < 0.5 ? "en2zh" : "zh2en";
    const field = dir === "en2zh" ? "zh" : "en";
    const pool = WORDS.filter((x) => x.en !== w.en && x[field] !== w[field]);
    shuffle(pool);
    const opts = [w[field]].concat(pool.slice(0, 3).map((x) => x[field]));
    shuffle(opts);
    quiz = { dir, field, opts, answered: false, chosen: null };
  }
  function buildListen() {
    const w = cur(); if (!w) return;
    const pool = WORDS.filter((x) => x.en !== w.en);
    shuffle(pool);
    const opts = [w.en].concat(pool.slice(0, 3).map((x) => x.en));
    shuffle(opts);
    listenState = { opts, answered: false, chosen: null };
    setTimeout(() => speak(w.en), 220);
  }

  /* ══════════ 渲染 ══════════ */
  /* ══════════ 内容分区 ══════════
     现在只有「背单词」是通的。朗读材料 / 听力 / 对话先把入口和位置占住，
     以后接数据只改这里和 AREA_COPY，别的地方不用动。 */
  const AREAS = [
    { id: "word", label: "背单词" },
    { id: "bank", label: "词库" },
    { id: "read", label: "朗读材料" },
    { id: "audio", label: "听力" },
    { id: "talk", label: "对话" }
  ];
  const AREA_COPY = {
    read: {
      ico: "📖", title: "朗读材料", tag: "还没上线",
      lead: "把教材里能开口的段落收进来：先听一遍，再一句一句跟读，读完能回放自己听。",
      bullet: [
        "按句切开，点哪句念哪句，单句能循环",
        "跟读录音回放，自己听哪里不对劲",
        "背词这边已经认识的词，在材料里给你标出来"
      ]
    },
    audio: {
      ico: "🎧", title: "听力", tag: "还没上线",
      lead: "轮机场景的短材料，精听和泛听分开：先听明白，再动手听写。",
      bullet: [
        "0.8× / 1.0× 变速，一句一句反复放",
        "听写挖空，听错的词自动回到背词队列",
        "干净版和带机舱底噪的版本对照着练"
      ]
    },
    talk: {
      ico: "💬", title: "对话", tag: "还没上线",
      lead: "机舱值班、甲板作业、PSC 检查这种一问一答，一轮一轮过。",
      bullet: [
        "按场景分的问答对，先看中文再翻英文",
        "我念完这句，接着念对方那句",
        "常用应答句式单独抽出来，反复练到顺口"
      ]
    }
  };

  function renderAreas() {
    const el = document.getElementById("areas");
    if (!el) return;
    el.innerHTML = AREAS.map(function (a) {
      const live = a.id === "word" || a.id === "bank";
      return '<button class="area' + (area === a.id ? " on" : "") + '" data-area="' + a.id + '"'
        + (live ? "" : ' title="这个模块还没做，先能看到要做什么"') + ">"
        + "<span>" + esc(a.label) + "</span>"
        + (live ? "" : '<span class="soon">待上线</span>')
        + "</button>";
    }).join("");
    const app = document.querySelector(".app");
    if (app) app.classList.toggle("solo", area !== "word");
  }

  /* ══════════ 词库 ══════════
     一个独立于单词表的草稿本：拍来的词先攒进某个词库（"课本第 3 页""修船那章"），
     在这儿改干净、删掉废行，再一键加进单词表 —— 只有加进单词表的才会进背词队列。 */
  let bankOpen = null;

  const bankById = (id) => st.banks.filter(function (b) { return b.id === id; })[0] || null;

  function newBank(name) {
    const id = "b" + now() + Math.floor(Math.random() * 1000);
    const b = { id: id, name: name || ("新词库 " + (st.banks.length + 1)), words: [], at: todayStr() };
    st.banks.unshift(b);
    save();
    return b;
  }

  function bankRowsHtml(b) {
    if (!b.words.length) {
      return '<div class="shot-empty">这个词库还空着。用「拍照 / 选图加词」把词存进来，或者点下面「+ 加一行」。</div>';
    }
    return b.words.map(function (w, i) {
      const used = WORDS.some(function (x) { return String(x.en).toLowerCase() === String(w.en).toLowerCase(); });
      return '<div class="add-row"><span class="rn">' + (i + 1) + "</span>"
        + '<input data-bk="en" data-bi="' + i + '" value="' + esc(w.en) + '" placeholder="english" autocapitalize="off" autocorrect="off" spellcheck="false">'
        + '<input data-bk="zh" data-bi="' + i + '" value="' + esc(w.zh) + '" placeholder="中文">'
        + (used
          ? '<span class="bk-used" title="单词表里已经有了">已在表里</span>'
          : '<button class="del" data-act="bank-delrow" data-i="' + i + '" title="删掉这一行">✕</button>')
        + "</div>";
    }).join("");
  }

  function renderBanks() {
    if (bankOpen) {
      const b = bankById(bankOpen);
      if (!b) { bankOpen = null; }
      else {
        return '<div class="bank-detail">'
          + '<div class="bank-bar">'
          + '<button class="mini" data-act="bank-back">← 全部词库</button>'
          + '<input class="bank-name" id="bankName" value="' + esc(b.name) + '" maxlength="20" placeholder="词库名">'
          + '<button class="mini danger" data-act="bank-del">删库</button>'
          + "</div>"
          + '<div class="bank-rows">' + bankRowsHtml(b) + "</div>"
          + '<div class="bank-foot">'
          + '<button class="mini" data-act="bank-addrow">+ 加一行</button>'
          + '<button class="mini primary" data-act="bank-push">全部加入单词表（' + b.words.length + "）</button>"
          + "</div></div>";
      }
    }
    const list = st.banks.map(function (b) {
      return '<div class="bank-item">'
        + '<div class="bi-main"><b>' + esc(b.name) + "</b><small>" + b.words.length + " 个词 · " + esc(b.at || "") + "</small></div>"
        + '<button class="mini" data-act="bank-open" data-id="' + b.id + '">打开</button>'
        + '<button class="mini primary" data-act="bank-push" data-id="' + b.id + '">加到单词表</button>'
        + "</div>";
    }).join("");
    return '<div class="bank-wrap">'
      + '<div class="bank-intro hint">词库是新词的草稿本：拍下来的词先存这儿，改干净了再一键加进单词表。'
      + "只有加进单词表的词才会出现在背词队列里。</div>"
      + '<div class="mini-btns"><button class="mini primary" data-act="bank-new">+ 新建词库</button>'
      + '<span class="hint">共 ' + st.banks.length + " 个</span></div>"
      + '<div class="bank-list">'
      + (list || '<div class="shot-empty">还没有词库。新建一个，或者用「拍照 / 选图加词」把照片里的词先存进来。</div>')
      + "</div></div>";
  }

  function pushBankToWords(b) {
    if (!b) return;
    const have = {};
    WORDS.forEach(function (w) { have[String(w.en).toLowerCase()] = 1; });
    let n = 0, dup = 0;
    b.words.forEach(function (w) {
      const en = String(w.en || "").trim();
      if (en.length < 2) return;
      const k = en.toLowerCase();
      if (have[k]) { dup++; return; }
      have[k] = 1;
      st.custom.push({ en: en, pos: "n.", zh: String(w.zh || "").trim() || en, phrase: "", cat: "自加", ipa: "", hom: "" });
      n++;
    });
    if (!n) { toast(dup ? "这些词单词表里都有了（" + dup + " 个）" : "这个词库里没有能用的词"); return; }
    rebuildWordlist(); buildQueue(); save(); render();
    buzz("done");
    toast("往单词表加了 " + n + " 个" + (dup ? "，跳过 " + dup + " 个重复的" : ""));
  }

  function handleBankAct(btn) {
    const a = btn.dataset.act;
    const id = btn.dataset.id || bankOpen;
    const b = bankById(id);
    if (a === "bank-new") { const nb = newBank(); bankOpen = nb.id; render(); return; }
    if (a === "bank-open") { bankOpen = btn.dataset.id; render(); return; }
    if (a === "bank-back") { bankOpen = null; render(); return; }
    if (a === "bank-push") { pushBankToWords(b); return; }
    if (a === "bank-addrow") { if (b) { b.words.push({ en: "", zh: "" }); save(); render(); } return; }
    if (a === "bank-delrow") { if (b) { b.words.splice(Number(btn.dataset.i), 1); save(); render(); } return; }
    if (a === "bank-del") {
      if (!b) return;
      if (btn.dataset.armed === "1") {
        st.banks = st.banks.filter(function (x) { return x.id !== id; });
        bankOpen = null;
        save(); render();
        toast("词库删了（单词表没动）");
        return;
      }
      btn.dataset.armed = "1";
      btn.textContent = "再点一次";
      window.setTimeout(function () {
        if (btn.dataset.armed === "1") { btn.dataset.armed = ""; btn.textContent = "删库"; }
      }, 3000);
      return;
    }
  }

  function renderSoon() {
    const c = AREA_COPY[area];
    if (!c) {
      return '<div class="done-card"><div class="big">🫗</div><h2>这里还空着</h2>'
        + '<p>先回去背单词。</p>'
        + '<button class="btn primary" data-act="area-word" style="max-width:200px">回背单词</button></div>';
    }
    return '<div class="soon-card">'
      + '<div class="big-ico">' + c.ico + "</div>"
      + '<h2>' + esc(c.title) + ' <span class="tag">' + esc(c.tag) + "</span></h2>"
      + "<p>" + esc(c.lead) + "</p>"
      + "<ul>" + c.bullet.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>"
      + '<div class="soon-foot">'
      + '<button class="btn primary" data-act="area-word" style="max-width:190px">先去背单词</button>'
      + '<span class="hint">词库到 800 以后再排期</span>'
      + "</div></div>";
  }

  function renderStats() {
    let mastered = 0, due = 0;
    WORDS.forEach((w) => {
      const c = card(w.en);
      if (c.box >= 3) mastered++;
      if (c.box > 0 && c.box < 5 && c.due <= now()) due++;
    });
    $("#statMastered").innerHTML = mastered + "<small>/" + WORDS.length + "</small>";
    $("#statToday").innerHTML = (st.today.d === todayStr() ? st.today.n : 0) + "<small>/" + st.perDay + "</small>";
    $("#statDue").textContent = due;
    $("#statStreak").textContent = st.streak.n || 0;
    const done = Math.min(1, (st.today.d === todayStr() ? st.today.n : 0) / st.perDay);
    $("#bar").style.width = (done * 100).toFixed(1) + "%";
    $("#ptext").textContent = Math.round(done * 100) + "%";
  }

  function renderChips() {
    const c = cats();
    const total = WORDS.length;
    const newN = WORDS.filter((w) => card(w.en).box === 0).length;
    const wrongN = WORDS.filter((w) => card(w.en).wrong > 0 && card(w.en).box < 4).length;
    const favN = WORDS.filter((w) => card(w.en).fav).length;

    /* 第一排固定四个：错词 / 收藏 在前，然后全部、新词。
       单词从 50 涨到两百多以后，分类全塞在这一排会挤成一条缝，所以分类挪到第二排。 */
    const pin = [
      { f: "错词", n: wrongN },
      { f: "收藏", n: favN },
      { f: "all", n: total, label: "全部" },
      { f: "新词", n: newN }
    ];
    let html = "";
    pin.forEach((p) => {
      html += '<button class="chip' + (filter === p.f ? " on" : "") + '" data-f="' + esc(p.f) + '">'
        + esc(p.label || p.f) + '<span class="n">' + p.n + "</span></button>";
    });
    $("#chips").innerHTML = html;

    /* 第二排：分类（含「自加」），一行横向滑动 */
    let cs = '<span class="cats-label">分类</span>';
    Object.keys(c).forEach((k) => {
      cs += '<button class="chip sm' + (filter === k ? " on" : "") + '" data-f="' + esc(k) + '">'
        + esc(k) + '<span class="n">' + c[k] + "</span></button>";
    });
    const catsEl = $("#cats");
    if (catsEl) {
      catsEl.innerHTML = cs;
      const on = catsEl.querySelector(".chip.on");
      if (on && typeof on.scrollIntoView === "function") {
        try { on.scrollIntoView({ block: "nearest", inline: "center" }); } catch (e) {}
      }
    }
  }

  function renderTabs() {
    document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.m === mode));
  }

  function doneBlock() {
    const empty = queue.length === 0;
    return '<div class="done-card"><div class="big">' + (empty ? "🫗" : "✅") + "</div>"
      + "<h2>" + (empty ? "这个范围里没词" : "这一轮走完了") + "</h2>"
      + "<p>" + (empty ? "换个分类，或者把筛选切回「全部」。" : "答过的都记进去了，掌握度低的下一轮会先出来。") + "</p>"
      + '<div style="display:flex;gap:10px;max-width:320px;width:100%">'
      + '<button class="btn primary" data-act="restart">再来一轮</button>'
      + '<button class="btn" data-act="openlist">看看列表</button></div></div>';
  }

  function renderStage() {
    const el = $("#stage");
    if (area === "bank") { el.innerHTML = renderBanks(); return; }
    if (area !== "word") { el.innerHTML = renderSoon(); return; }
    if (mode === "list") { el.innerHTML = renderList(); return; }
    if (finished || !cur()) { el.innerHTML = doneBlock(); return; }
    if (mode === "card") return renderCard(el);
    if (mode === "quiz") { if (!quiz) buildQuiz(); return renderQuiz(el); }
    if (mode === "spell") return renderSpell(el);
    if (mode === "listen") { if (!listenState) buildListen(); return renderListen(el); }
  }

  function levelBar(box) {
    let s = '<span class="lv">';
    for (let i = 0; i < 5; i++) s += "<i" + (i < box ? ' class="f"' : "") + "></i>";
    return s + "</span>";
  }

  function renderCard(el) {
    const w = cur(); const c = card(w.en);
    const meta = (w.pos || w.ipa)
      ? '<div class="meta-line">'
        + (w.pos ? '<span class="pos">' + esc(w.pos) + "</span>" : "")
        + (w.ipa ? '<span class="ipa">' + esc(w.ipa) + "</span>" : "")
        + "</div>"
      : "";
    const hom = (w.hom && st.showHom)
      ? '<div class="hom"><span class="hom-tag">谐音</span>' + esc(w.hom) + "</div>"
      : "";
    const tools = '<div class="card-tools">'
      + '<button class="tool-btn' + (c.fav ? " on" : "") + '" data-act="fav" title="收藏 / 取消收藏">' + (c.fav ? "★" : "☆") + "</button>"
      + '<button class="tool-btn" data-act="read" title="跟读：录一段、听回放">🎤</button>'
      + '<button class="tool-btn flip-btn" data-act="flip" title="翻面：中文 / 英文">' + (cardFlipped ? "EN" : "中") + "</button>"
      + "</div>";
    el.innerHTML =
      '<div class="card-wrap"><div class="card' + (cardFlipped ? " flipped" : "") + '" data-act="speak">'
      + '<div class="face front">'
      + tools
      + '<span class="cat-tag">' + esc(w.cat || "") + "</span>"
      + '<div class="word">' + esc(w.en) + "</div>"
      + meta + hom
      + '<div class="hint">' + levelBar(c.box) + "&nbsp; 点单词念一遍，点右上角「中」看中文</div>"
      + "</div>"
      + '<div class="face back">'
      + tools
      + '<span class="cat-tag">' + esc(w.cat || "") + "</span>"
      + '<div class="zh">' + esc(w.zh) + "</div>"
      + (w.phrase ? '<div class="phrase">' + esc(w.phrase) + "</div>" : "")
      + (w.ipa ? '<div class="back-word">' + esc(w.ipa) + "</div>" : "")
      + (w.hom && st.showHom ? '<div class="hom small"><span class="hom-tag">谐音</span>' + esc(w.hom) + "</div>" : "")
      + "</div></div></div>"
      + '<div class="actions">'
      + '<button class="btn bad" data-act="no">不认识 <span class="kbd">1</span></button>'
      + '<button class="btn ok" data-act="yes">认识 <span class="kbd">2</span></button>'
      + "</div>"
      + '<div class="hint" style="text-align:center;margin-top:12px">第 ' + (qpos + 1) + " / " + queue.length
      + " 个 · 左右滑翻词，1/2 判定 · 点单词朗读</div>";
  }

  function renderQuiz(el) {
    const w = cur(); const q = quiz;
    const prompt = q.dir === "en2zh" ? w.en : w.zh;
    const sub = q.dir === "en2zh" ? "选出它的中文意思" : "选出对应的英文";
    let opts = q.opts.map((o, i) => {
      let cls = "opt";
      if (q.answered) {
        cls += " done";
        if (o === w[q.field]) cls += " correct";
        else if (o === q.chosen) cls += " wrong";
      }
      return '<button class="' + cls + '" data-opt="' + i + '"><span class="idx">' + (i + 1) + "</span><span>" + esc(o) + "</span></button>";
    }).join("");
    el.innerHTML =
      '<div class="q-head"><span class="cat-tag">' + esc(w.cat || "") + '</span>'
      + '<span class="hint">' + (qpos + 1) + " / " + queue.length + '</span></div>'
      + '<div class="q-prompt">' + esc(prompt) + "</div>"
      + '<div class="q-sub">' + sub + (q.dir === "en2zh" && q.answered ? " · " + esc(w.phrase || "") : "") + "</div>"
      + '<div class="opts">' + opts + "</div>"
      + (q.answered
        ? '<div class="actions"><button class="btn primary" data-act="next">下一题 <span class="kbd">↵</span></button></div>'
        : '<div class="actions"><button class="btn" data-act="speak">🔊 念一遍</button></div>');
  }

  function renderSpell(el) {
    const w = cur();
    const s = spellState || { answered: false, ok: false };
    const hint = (w.zh || "") + (w.pos ? "  (" + w.pos + ")" : "");
    const len = w.en.replace(/[^A-Za-z ]/g, "").trim();
    const first = len.charAt(0).toUpperCase();
    const wordCount = len.split(/\s+/).filter(Boolean).length;
    let sub = esc(hint);
    let ph = "拼出英文";
    if (st.spellHint === "length") {
      sub += " · " + esc(len.replace(/[A-Za-z]/g, "·")) + "（" + wordCount + " 个词）";
      ph = "首字母 " + first + " 开头";
    } else if (st.spellHint === "first") {
      sub += " · 首字母 " + esc(first);
      ph = "首字母 " + first + " 开头";
    }
    el.innerHTML =
      '<div class="q-head"><span class="cat-tag">' + esc(w.cat || "") + '</span>'
      + '<span class="hint">' + (qpos + 1) + " / " + queue.length + "</span></div>"
      + '<div class="q-prompt">' + esc(w.zh) + "</div>"
      + '<div class="q-sub">' + sub + "</div>"
      + '<div class="spell-box">'
      + '<input class="spell-input" id="spellIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + esc(ph) + '"'
      + (s.answered ? " disabled" : "") + ">"
      + '<div class="feedback' + (s.answered ? (s.ok ? " ok" : " bad") : "") + '" id="fb">'
      + (s.answered ? (s.ok ? "对，就是它。" : "正确答案：<em>" + esc(w.en) + "</em>") : "&nbsp;")
      + "</div>"
      + '<div class="actions">'
      + (s.answered
        ? '<button class="btn primary" data-act="next">下一题 <span class="kbd">↵</span></button>'
        : '<button class="btn primary" data-act="submit">提交 <span class="kbd">↵</span></button>'
          + '<button class="btn" data-act="show">看答案</button>')
      + "</div></div>";
    if (!s.answered) {
      const inp = $("#spellIn");
      if (inp) setTimeout(() => inp.focus(), 30);
    }
  }

  function renderListen(el) {
    const w = cur(); const s = listenState;
    let opts = s.opts.map((o, i) => {
      let cls = "opt";
      if (s.answered) {
        cls += " done";
        if (o === w.en) cls += " correct";
        else if (o === s.chosen) cls += " wrong";
      }
      return '<button class="' + cls + '" data-opt="' + i + '"><span class="idx">' + (i + 1) + "</span><span>" + esc(o) + "</span></button>";
    }).join("");
    el.innerHTML =
      '<div class="q-head"><span class="cat-tag">' + esc(w.cat || "") + '</span>'
      + '<span class="hint">' + (qpos + 1) + " / " + queue.length + "</span></div>"
      + '<div class="q-prompt">🔊 听发音，选出你听到的词</div>'
      + '<div class="q-sub">' + (s.answered ? esc(w.zh) + " · " + esc(w.phrase || "") : "没声就点下面的按钮再放一次") + "</div>"
      + '<div class="opts">' + opts + "</div>"
      + '<div class="actions">'
      + '<button class="btn" data-act="speak">🔊 再放一次</button>'
      + (s.answered ? '<button class="btn primary" data-act="next">下一题 <span class="kbd">↵</span></button>' : "")
      + "</div>";
  }

  function matchSearch(w) {
    const q = searchText.trim().toLowerCase();
    if (!q) return true;
    const hay = (w.en + " " + w.zh + " " + (w.ipa || "") + " " + (w.phrase || "") + " " + (w.hom || "") + " " + (w.cat || "")).toLowerCase();
    return hay.indexOf(q) >= 0;
  }

  function renderRows() {
    const list = WORDS.filter(inFilter).filter(matchSearch);
    if (!list.length) {
      return '<div class="search-empty">'
        + (searchText ? "没搜到「" + esc(searchText) + "」" : "这个范围里没词")
        + "</div>";
    }
    let html = "";
    const q = searchText.trim().toLowerCase();
    list.forEach((w) => {
      const c = card(w.en);
      // 搜的是例句时，把例句也显示出来，不然看不出为什么命中
      const hitPhrase = q && (w.phrase || "").toLowerCase().indexOf(q) >= 0
        && (w.en + " " + w.zh + " " + (w.ipa || "")).toLowerCase().indexOf(q) < 0;
      html += '<div class="row" data-en="' + esc(w.en) + '">'
        + levelBar(c.box)
        + '<div><div class="en">' + esc(w.en) + " <span class=\"pos-inline\">" + esc(w.pos || "") + "</span></div>"
        + '<div class="zh2">' + esc(w.zh) + (w.ipa ? '<span class="ipa2">' + esc(w.ipa) + "</span>" : "") + "</div>"
        + (hitPhrase ? '<div class="zh2 phrase-hit">' + esc(w.phrase) + "</div>" : "")
        + "</div>"
        + '<button class="fav' + (c.fav ? " on" : "") + '" data-fav="' + esc(w.en) + '">' + (c.fav ? "★" : "☆") + "</button>"
        + "</div>";
    });
    return html;
  }

  function renderList() {
    return '<div class="search-box">'
      + '<input type="search" id="listSearch" class="search-input" placeholder="搜英文 / 中文 / 音标 / 例句"'
      + ' value="' + esc(searchText) + '" autocomplete="off" spellcheck="false"></div>'
      + '<div class="list" id="listBody">' + renderRows() + "</div>";
  }

  function render() {
    renderAreas();
    renderStats(); renderChips(); renderTabs(); renderStage();
    $("#foot").innerHTML = WORDS.length + " 个词 · 进度就存在这台机器上 · 键盘 1 不认识 / 2 认识 / 空格翻面"
      + ' · <span class="ver">v' + APP_VERSION + "</span>"
      + (hotUpdated() ? '<span class="hot">热更</span>' : "");
  }

  /* ══════════ 交互 ══════════ */
  function submitSpell() {
    const w = cur(); if (!w || (spellState && spellState.answered)) return;
    const inp = $("#spellIn"); if (!inp) return;
    const val = inp.value;
    const alts = [w.en, w.en.replace(/\s*[（(][^)）]*[)）]/g, ""), (w.en.match(/[（(]([^)）]+)[)）]/) || [])[1] || ""]
      .map(norm).filter(Boolean);
    const ok = alts.indexOf(norm(val)) >= 0 && norm(val).length > 1;
    spellState = { answered: true, ok };
    grade(ok);
    render();
    if (ok) speak(w.en);
  }

  function pickOpt(i) {
    const w = cur(); if (!w) return;
    if (mode === "quiz" && quiz && !quiz.answered) {
      const chosen = quiz.opts[i];
      quiz.answered = true; quiz.chosen = chosen;
      const ok = chosen === w[quiz.field];
      grade(ok); render();
      if (!ok) speak(w.en);
    } else if (mode === "listen" && listenState && !listenState.answered) {
      const chosen = listenState.opts[i];
      listenState.answered = true; listenState.chosen = chosen;
      const ok = chosen === w.en;
      grade(ok); render();
      speak(w.en);
    }
  }

  /* ══════════ 卡片左右滑 ══════════ */
  let drag = null;
  let suppressClick = 0;

  function resetDrag() {
    const wrap = document.querySelector(".card-wrap");
    if (wrap) { wrap.style.transition = ""; wrap.style.transform = ""; wrap.style.opacity = ""; }
    drag = null;
  }
  function fling(visual, move) {
    const wrap = document.querySelector(".card-wrap");
    if (wrap) {
      wrap.style.transition = "transform .24s ease-out, opacity .24s";
      wrap.style.transform = "translateX(" + visual * 620 + "px) rotate(" + visual * 10 + "deg)";
      wrap.style.opacity = "0";
    }
    suppressClick = now() + 350;
    window.setTimeout(function () {
      const ok = step(move);
      if (!ok) {
        // 到边界了：把卡片拉回来
        const w2 = document.querySelector(".card-wrap");
        if (w2) {
          w2.style.transition = "transform .26s cubic-bezier(.2,.9,.3,1), opacity .26s";
          w2.style.transform = "";
          w2.style.opacity = "";
        }
        toast(move < 0 ? "已经是第一个了" : "已经是最后一个了");
      }
    }, 160);
    drag = null;
  }

  document.addEventListener("pointerdown", function (e) {
    if (mode !== "card" || finished || !cur()) return;
    if (!e.target || !e.target.closest) return;
    if (!e.target.closest(".card")) return;
    if (e.target.closest(".speak-btn")) return;
    drag = { x: e.clientX, y: e.clientY, dx: 0, moved: false };
  });

  document.addEventListener("pointermove", function (e) {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved) {
      if (Math.abs(dx) < 8) return;
      if (Math.abs(dx) <= Math.abs(dy)) { drag = null; return; }
    }
    drag.moved = true;
    drag.dx = dx;
    const wrap = document.querySelector(".card-wrap");
    if (wrap) {
      wrap.style.transition = "none";
      wrap.style.transform = "translateX(" + dx + "px) rotate(" + dx * 0.03 + "deg)";
    }
  }, { passive: true });

  document.addEventListener("pointerup", function () {
    if (!drag) return;
    const dx = drag.dx, moved = drag.moved;
    if (moved && Math.abs(dx) > 62) {
      // 向右拖 = 回到上一个（像翻相册），向左拖 = 下一个
      fling(dx > 0 ? 1 : -1, dx > 0 ? -1 : 1);
      return;
    }
    if (moved) { resetDrag(); suppressClick = now() + 120; return; }
    drag = null;
  });

  document.addEventListener("pointercancel", function () { if (drag) resetDrag(); });

  document.addEventListener("input", function (e) {
    const t = e.target;
    if (!t) return;
    if (t.id === "listSearch") {
      searchText = t.value;
      const body = document.getElementById("listBody");
      if (body) body.innerHTML = renderRows();
      return;
    }
    // 词库里的词：直接改直接存，不用点保存
    if (t.dataset && t.dataset.bi !== undefined && t.dataset.bk) {
      const b = bankById(bankOpen);
      const w = b && b.words[Number(t.dataset.bi)];
      if (w) { w[t.dataset.bk] = t.value; save(); }
      return;
    }
    if (t.id === "bankName") {
      const b = bankById(bankOpen);
      if (b && String(t.value).trim()) { b.name = String(t.value).trim(); save(); }
      return;
    }
  });

  document.addEventListener("click", function (e) {
    const t = e.target;
    if (suppressClick && now() < suppressClick) return;

    const ar = t.closest("[data-area]");
    if (ar) {
      area = ar.dataset.area || "word";
      render();
      if (area === "word" && mode === "card") autoSpeakCurrent();
      return;
    }

    if (t.closest("#themeBtn")) { toggleTheme(); return; }

    if (t.closest("[data-act^='bank-']")) { handleBankAct(t.closest("[data-act^='bank-']")); return; }

    const chip = t.closest(".chip");
    if (chip) { filter = chip.dataset.f; buildQueue(); render(); return; }

    const tab = t.closest(".tab");
    if (tab) {
      mode = tab.dataset.m;
      buildQueue(); render();
      if (mode === "card") autoSpeakCurrent();
      if (mode === "listen" && !listenState) renderStage();
      return;
    }

    const fav = t.closest("[data-fav]");
    if (fav) {
      e.stopPropagation();
      const c = card(fav.dataset.fav); c.fav = !c.fav; save(); render();
      return;
    }

    const row = t.closest(".row");
    if (row) { speak(row.dataset.en); return; }

    const opt = t.closest(".opt[data-opt]");
    if (opt) { pickOpt(Number(opt.dataset.opt)); return; }

    const act = t.closest("[data-act]");
    if (act) {
      const a = act.dataset.act;
      if (act.classList.contains("speak-btn")) e.stopPropagation();
      if (a === "fav") {
        const w = cur();
        if (!w) return;
        const cc = card(w.en);
        cc.fav = !cc.fav;
        save();
        Array.prototype.forEach.call(document.querySelectorAll('[data-act="fav"]'), (b) => {
          b.classList.toggle("on", cc.fav);
          b.textContent = cc.fav ? "★" : "☆";
        });
        renderChips();
        buzz("tap");
        toast(cc.fav ? "已收藏" : "取消收藏");
        return;
      }
      if (a === "flip") { toggleCard(); return; }
      if (a === "read") { const w = cur(); if (w) openReadPanel(w); return; }
      if (a === "speak") { const w = cur(); if (w) speak(w.en); return; }
      if (a === "yes") { grade(true); advance(); return; }
      if (a === "no") { grade(false); advance(); return; }
      if (a === "next") { advance(); return; }
      if (a === "submit") { submitSpell(); return; }
      if (a === "show") {
        const w = cur();
        spellState = { answered: true, ok: false };
        grade(false); render(); speak(w.en); return;
      }
      if (a === "restart") { buildQueue(); render(); if (mode === "card") autoSpeakCurrent(); return; }
      if (a === "openlist") { mode = "list"; render(); return; }
      if (a === "area-word") { area = "word"; render(); return; }
    }

    if (t.closest("#openSet")) { $("#mask").classList.add("show"); refreshTts(); refreshUpdLabels(); return; }
    if (t.id === "mask" || t.closest("#closeSet")) { $("#mask").classList.remove("show"); return; }
  });

  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT" && e.target.type === "number") return;
    if (e.target && e.target.id === "spellIn") {
      if (e.key === "Enter") {
        if (spellState && spellState.answered) advance(); else submitSpell();
        e.preventDefault();
      }
      return;
    }
    if (e.target && e.target.tagName === "TEXTAREA") return;

    const k = e.key;
    // 在朗读材料 / 听力 / 对话那几页里，1/2/空格不该偷偷给单词判分
    if (area !== "word") return;

    // 拼写模式：焦点不在输入框时 Enter 也要能用
    if (mode === "spell" && cur() && !finished && k === "Enter") {
      const inp = document.getElementById("spellIn");
      if (spellState && spellState.answered) { e.preventDefault(); advance(); }
      else if (inp && document.activeElement === inp) { e.preventDefault(); submitSpell(); }
      else if (inp) { e.preventDefault(); inp.focus(); }
      return;
    }
    if (mode === "card" && cur() && !finished) {
      if (k === " ") { e.preventDefault(); toggleCard(); return; }
      if (k === "Enter") { e.preventDefault(); grade(true); advance(); return; }
      if (k === "1") { e.preventDefault(); grade(false); advance(); return; }
      if (k === "2") { e.preventDefault(); grade(true); advance(); return; }
      if (k === "ArrowLeft") { e.preventDefault(); step(-1); return; }
      if (k === "ArrowRight") { e.preventDefault(); step(1); return; }
      if (k === "r" || k === "R") { speak(cur().en); return; }
    }
    if ((mode === "quiz" || mode === "listen") && cur() && !finished) {
      if (/^[1-4]$/.test(k)) {
        e.preventDefault();
        const answered = mode === "quiz" ? (quiz && quiz.answered) : (listenState && listenState.answered);
        if (answered && k === "1") { advance(); return; }
        pickOpt(Number(k) - 1);
        return;
      }
      if (k === "Enter") {
        const answered = mode === "quiz" ? (quiz && quiz.answered) : (listenState && listenState.answered);
        if (answered) { e.preventDefault(); advance(); }
        return;
      }
      if (k === "r" || k === "R") { speak(cur().en); return; }
    }
  });

      });

      });
      return '<div class="log-item' + (e.v === APP_VERSION ? " cur" : "") + '">'
        + '<div class="log-v">v' + esc(e.v) + "<span>" + esc(e.d) + "</span></div>"
        + (items ? '<ul class="log-list">' + items + "</ul>" : "")
        + "</div>";

    /* 更新日志只摊开最近三版，更早的收起来 —— 一屏能看完 */
    function renderLog() {
      const head = CHANGELOG.slice(0, 3);
      const rest = CHANGELOG.slice(3);
      logBox.innerHTML = '<div class="log">' + head.map(logItem).join("")
        + (rest.length
          ? '<button class="mini log-more" id="moreLog">更早的 ' + rest.length + " 个版本</button>"

    /* 「再点一次确认」——WebView 里 window.confirm 是哑的，所以不用 confirm */
    function armConfirm(btn, label, cb) {
      if (btn.dataset.armed === "1") {
        btn.dataset.armed = "";
        btn.classList.remove("armed");
        btn.textContent = label;
        cb();
        return;
      }
      btn.dataset.armed = "1";
      btn.classList.add("armed");
      btn.textContent = "再点一次";
      window.setTimeout(function () {
        if (btn.dataset.armed === "1") {
          btn.dataset.armed = "";
          btn.classList.remove("armed");
          btn.textContent = label;
        }

    mask.querySelector("#copyProg").addEventListener("click", () => {

      if (!obj || typeof obj !== "object" || !obj.words) { toast("这段不像备份内容"); return; }
      armConfirm(this, "恢复", () => {

    });
  }

  /* ══════════ 拍照加词 ══════════
     照片只在内存里当 dataURL 用，不上传；识别跑的是装在这台机器上的 tesseract
     （assets/ocr 下那几个文件，壳子按 /ocr/ 路径喂给页面），所以断网也能用。
     识别结果全落到可编辑的行里 —— 认错的字直接在行里改，改不动就删，最后一起导入。 */
  const OCR_BASE = "ocr/";
  const ADD_MAX_SIDE = 1800;   // 识别前先缩到 1800px：整页笔记的字太小，缩太狠就认不出

  let addShots = [];           // [{ url, done }]
  let addRows = [];            // [{ en, zh }]
  let addCur = 0;
  let addBusy = false;
  let addMsg = "";
  let addWarn = false;         // 识别结果太离谱，提示清空
  let addTarget = "custom";    // 导入到哪儿：custom = 单词表，其它是词库 id，__new = 新建词库
  let viewerZoom = 1;
  let tessLibP = null;
  let ocrWorkerP = null;

  function openViewer() {
    const s = addShots[addCur];
    const v = document.getElementById("imgViewer");
    const img = document.getElementById("viewerImg");
    if (!s || !v || !img) return;
    img.src = s.url;
    v.classList.add("show");
    setZoom(1);
    exitCrop();
  }

  function setZoom(z) {
    viewerZoom = Math.max(1, Math.min(4, z));
    const img = document.getElementById("viewerImg");
    const lv = document.getElementById("zoomLv");
    if (img) img.style.width = (viewerZoom * 100) + "%";
    if (lv) lv.textContent = viewerZoom.toFixed(1) + "×";
  }

  function closeViewer() {
    exitCrop();
    const v = document.getElementById("imgViewer");
    if (v) v.classList.remove("show");
  }

  /* ---------- 裁剪：在手写笔记里只取有用的一块 ---------- */
  let cropOn = false;

  function enterCrop() {
    const v = document.getElementById("imgViewer");
    const box = document.getElementById("cropBox");
    if (!v || !box) return;
    cropOn = true;
    box.style.display = "none";
    box.style.left = box.style.top = box.style.width = box.style.height = "0px";
    v.classList.add("cropping");
    document.getElementById("cropOk").style.display = "";
    document.getElementById("cropCancel").style.display = "";
    document.getElementById("cropBtn").style.display = "none";
    toast("在图上按住拖一块出来");
  }

  function exitCrop() {
    cropOn = false;
    const v = document.getElementById("imgViewer");
    if (v) v.classList.remove("cropping");
    const box = document.getElementById("cropBox");
    if (box) { box.style.display = "none"; box.style.width = "0px"; box.style.height = "0px"; }
    const ok = document.getElementById("cropOk");
    const cc = document.getElementById("cropCancel");
    const cb = document.getElementById("cropBtn");
    if (ok) ok.style.display = "none";
    if (cc) cc.style.display = "none";
    if (cb) cb.style.display = "";
  }

  function applyCrop() {
    const img = document.getElementById("viewerImg");
    const box = document.getElementById("cropBox");
    if (!img || !box) return;
    const br = box.getBoundingClientRect();
    if (br.width < 12 || br.height < 12) { toast("先框一块，太小了"); return; }
    const r = img.getBoundingClientRect();
    const kx = img.naturalWidth / r.width;
    const ky = img.naturalHeight / r.height;
    const sx = Math.max(0, (br.left - r.left) * kx);
    const sy = Math.max(0, (br.top - r.top) * ky);
    const sw = Math.min(img.naturalWidth - sx, br.width * kx);
    const sh = Math.min(img.naturalHeight - sy, br.height * ky);
    try {
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(sw));
      cv.height = Math.max(1, Math.round(sh));
      const cx = cv.getContext("2d");
      cx.fillStyle = "#fff";
      cx.fillRect(0, 0, cv.width, cv.height);
      cx.drawImage(img, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
      const s = addShots[addCur];
      if (s) { s.url = cv.toDataURL("image/jpeg", 0.92); s.done = false; }
      exitCrop();
      closeViewer();
      renderAdd();
      addStatus("裁好了 —— 可以再点「识别印刷体」，或者直接照着打");
    } catch (e) {
      toast("裁不动这张图");
    }
  }

  function bindCrop() {
    const v = document.getElementById("imgViewer");
    const scroll = v ? v.querySelector(".viewer-scroll") : null;
    const box = document.getElementById("cropBox");
    if (!v || !scroll || !box) return;
    let start = null;

    scroll.addEventListener("pointerdown", function (e) {
      if (!cropOn) return;
      const cr = scroll.getBoundingClientRect();
      start = { x: e.clientX - cr.left + scroll.scrollLeft, y: e.clientY - cr.top + scroll.scrollTop };
      box.style.display = "block";
      box.style.left = start.x + "px";
      box.style.top = start.y + "px";
      box.style.width = "0px";
      box.style.height = "0px";
      e.preventDefault();
    });

    scroll.addEventListener("pointermove", function (e) {
      if (!cropOn || !start) return;
      const cr = scroll.getBoundingClientRect();
      const x = e.clientX - cr.left + scroll.scrollLeft;
      const y = e.clientY - cr.top + scroll.scrollTop;
      box.style.left = Math.min(start.x, x) + "px";
      box.style.top = Math.min(start.y, y) + "px";
      box.style.width = Math.abs(x - start.x) + "px";
      box.style.height = Math.abs(y - start.y) + "px";
    });

    scroll.addEventListener("pointerup", function () { start = null; });
    scroll.addEventListener("pointercancel", function () { start = null; });
  }

  function addStatus(text) {
    addMsg = text || "";
    const el = document.getElementById("addStatus");
    if (el) el.textContent = addMsg;
  }

  function loadTessLibOnce(bust) {
    return new Promise(function (res, rej) {
      let settled = false;
      const timer = window.setTimeout(function () {
        if (settled) return;
        settled = true;
        rej(new Error("NO_PACK"));
      }, 12000);
      const done = function (fn, v) {
        if (settled) return;
        settled = true;
        window.clearTimeout(timer);
        fn(v);
      };
      const s = document.createElement("script");
      s.src = OCR_BASE + "tesseract.min.js" + (bust ? ("?t=" + now()) : "");
      s.onload = function () {
        if (window.Tesseract) { done(res, window.Tesseract); return; }
        // 壳子在缺文件时会拿 index.html 顶包（200 + text/html），onload 照样触发 ——
        // 所以"加载完了但没有 Tesseract"也要当成"识别包还没下"
        done(rej, new Error("NO_PACK"));
      };
      s.onerror = function () { done(rej, new Error("NO_PACK")); };
      document.head.appendChild(s);
    });
  }

  /* 识别包（约 8 MB）不在安装包里：第一次点「识别」才下，壳子下到 filesDir/ocr，下完就不用再下。
     单独下是为了让安装包只有 170 KB —— 3.4 MB 的包在手机上老是被半路掐断。 */
  function fetchOcrPack() {
    return new Promise(function (res, rej) {
      let done = false;
      let ticks = 0;
      const timer = window.setInterval(function () {
        ticks++;
        if (ticks > 900 && !done) {
          done = true;
          window.clearInterval(timer);
          rej(new Error("等太久了，先关掉面板再点一次"));
        }
      }, 1000);
      window.__packProgress = function (i, n, name) {
        addStatus("正在下识别包 " + i + "/" + n + " · " + name);
      };
      window.__packDone = function (ok, msg) {
        if (done) return;
        done = true;
        window.clearInterval(timer);
        if (ok) res();
        else rej(new Error(msg || "识别包没下成"));
      };
      if (!(window.AndroidUpdate && typeof window.AndroidUpdate.fetchPack === "function")) {
        done = true;
        window.clearInterval(timer);
        rej(new Error("这个安装包还不带识别包下载，装一次新版 App"));
        return;
      }
      try { window.AndroidUpdate.fetchPack(updBase()); } catch (e) {
        done = true;
        window.clearInterval(timer);
        rej(new Error("叫不动下载"));
      }
    });
  }

  function loadTessLib() {
    if (tessLibP) return tessLibP;
    tessLibP = loadTessLibOnce(false).catch(function (e) {
      if (String(e && e.message) !== "NO_PACK") throw e;
      addStatus("第一次要下识别包（约 8 MB，只下一次）…");
      return fetchOcrPack().then(function () {
        return loadTessLibOnce(true);
      }).then(function (T) {
        addStatus("");
        return T;
      });
    });
    tessLibP.catch(function () { tessLibP = null; });
    return tessLibP;
  }

  function getOcr() {
    if (ocrWorkerP) return ocrWorkerP;
    ocrWorkerP = loadTessLib().then(function (T) {
      return T.createWorker("eng", 1, {
        workerPath: OCR_BASE + "worker.min.js",
        corePath: OCR_BASE + "tesseract-core-simd-lstm.wasm.js",
        langPath: OCR_BASE,
        gzip: false,
        cacheMethod: "none"
      });
    });
    ocrWorkerP.catch(function () { ocrWorkerP = null; });
    return ocrWorkerP;
  }

  /* 手机拍的照片四五兆，先缩到 1400px 再识别，快而且省内存 */
  function shrinkImage(file) {
    return new Promise(function (res, rej) {
      const fr = new FileReader();
      fr.onerror = function () { rej(new Error("读不了这张图")); };
      fr.onload = function () {
        const img = new Image();
        img.onerror = function () { res(fr.result); };
        img.onload = function () {
          try {
            const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
            const k = Math.min(1, ADD_MAX_SIDE / Math.max(w, h));
            if (k >= 0.999) { res(fr.result); return; }
            const cv = document.createElement("canvas");
            cv.width = Math.round(w * k);
            cv.height = Math.round(h * k);
            const cx = cv.getContext("2d");
            cx.fillStyle = "#fff";
            cx.fillRect(0, 0, cv.width, cv.height);
            cx.drawImage(img, 0, 0, cv.width, cv.height);
            res(cv.toDataURL("image/jpeg", 0.86));
          } catch (e) {
            res(fr.result);
          }
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  function addFiles(list) {
    const arr = Array.prototype.slice.call(list || []);
    if (!arr.length) return;
    arr.forEach(function (f) {
      shrinkImage(f).then(function (url) {
        addShots.push({ url: url, done: false });
        renderAdd();
      }).catch(function (e) {
        toast(String((e && e.message) || e));
      });
    });
    // 给了照片就顺手开一行空的，照着打不用再点「+ 加一行」
    if (!addRows.length) addRows.push({ en: "", zh: "" });
    addStatus("加了 " + arr.length + " 张 · 点图能放大看；手写的直接照着打，印刷的可以试「识别印刷体」");
    renderAdd();
  }

  /* 手机拍出来常常是横着的：转正再识别，准确率差一大截 */
  function rotateShot(i) {
    const s = addShots[i];
    if (!s) return;
    const img = new Image();
    img.onload = function () {
      try {
        const cv = document.createElement("canvas");
        cv.width = img.height;
        cv.height = img.width;
        const cx = cv.getContext("2d");
        cx.translate(cv.width / 2, cv.height / 2);
        cx.rotate(Math.PI / 2);
        cx.drawImage(img, -img.width / 2, -img.height / 2);
        s.url = cv.toDataURL("image/jpeg", 0.9);
        s.done = false;
        renderAdd();
        addStatus("转正了，再点一次「识别」");
      } catch (e) {
        toast("转不动这张图");
      }
    };
    img.onerror = function () { toast("转不动这张图"); };
    img.src = s.url;
  }

  /* 把识别出来的文字切成行：有分隔符就按分隔符，没有就按第一个汉字切开 */
  /* 认出来的东西像不像单词：手写照出来的「fi rh」「HSS ae」这种，字母都对不上 */
  function looksLikeGarbage(rows) {
    const list = rows.filter(function (r) { return r && r.en && r.en.length >= 2; });
    if (list.length < 3) return false;
    let bad = 0;
    list.forEach(function (r) {
      const w = String(r.en).toLowerCase().replace(/[^a-z]/g, "");
      if (w.length < 4 || !/[aeiouy]/.test(w)) bad++;
    });
    return bad / list.length > 0.6;
  }

  function parseOcrToRows(text) {
    let added = 0;
    String(text || "").split(/\r?\n/).forEach(function (raw) {
      let s = raw.replace(/\s+/g, " ").trim();
      if (!s) return;
      s = s.replace(/^[0-9]{1,2}\s*[.、)．]\s*/, "");
      if (s.length < 2) return;
      if (!/[A-Za-z]/.test(s)) return;             // 整行没有一个字母：噪点
      let en = s, zh = "";
      const m = s.match(/^([A-Za-z][A-Za-z'’\-\/ ]*?)\s*(?:\||:|：|\u2013|\u2014|-{1,2})\s*(.+)$/);
      if (m) {
        en = m[1];
        zh = m[2];
      } else {
        const k = s.search(/[\u4e00-\u9fff]/);
        if (k > 0) { en = s.slice(0, k); zh = s.slice(k); }
      }
      en = en.replace(/[^A-Za-z'’\-\/ ]+/g, " ").replace(/\s+/g, " ").trim();
      if (en.length < 2) return;
      addRows.push({ en: en, zh: String(zh || "").replace(/^[\s:：\-–—|]+/, "").trim() });
      added++;
    });
    return added;
  }

  function ocrAll() {
    if (addBusy) return;
    const todo = [];
    addShots.forEach(function (s, i) { if (!s.done) todo.push({ shot: s, idx: i }); });
    if (!todo.length) {
      toast(addShots.length ? "这些图都识别过了" : "先拍一张，或者从相册选几张");
      return;
    }
    addBusy = true;
    renderAdd();
    let n = 0;

    function step() {
      if (n >= todo.length) {
        addBusy = false;
        renderAdd();
        if (looksLikeGarbage(addRows)) {
          addWarn = true;
          renderAdd();
          addStatus("认出来的不像单词 —— 手写别指望识别，清空照着照片打吧");
        } else {
          addWarn = false;
          renderAdd();
          addStatus("识别完了 · " + addRows.length + " 行，错的直接在行里改");
        }
        buzz("done");
        return;
      }
      const item = todo[n];
      addCur = item.idx;
      addStatus("正在识别 " + (n + 1) + "/" + todo.length + "…（第一次会慢一点，要加载识别引擎）");
      renderAdd();
      getOcr().then(function (w) {
        return w.recognize(item.shot.url);
      }).then(function (r) {
        const text = (r && r.data && r.data.text) || "";
        item.shot.done = true;
        const got = parseOcrToRows(text);
        n++;
        renderAdd();
        if (!got) addStatus("第 " + n + " 张没认出词，照着照片手打吧");
        window.setTimeout(step, 60);
      }).catch(function (e) {
        addBusy = false;
        renderAdd();
        addStatus("");
        toast("识别没起来：" + ((e && e.message) || e) + " —— 照片还在，照着打就行");
      });
    }
    step();
  }

  function importAddRows() {
    if (addBusy) return;

    const usable = addRows.filter(function (r) { return String(r.en || "").trim().length >= 2; });
    if (!usable.length) { toast("一行能用的都没有"); return; }

    /* 导进词库：先存成草稿，之后在词库页核对，再一键进单词表 */
    if (addTarget === "__new" || bankById(addTarget)) {
      const bank = addTarget === "__new" ? newBank() : bankById(addTarget);
      const seen = {};
      bank.words.forEach(function (w) { seen[String(w.en).toLowerCase()] = 1; });
      let bn = 0, bdup = 0;
      usable.forEach(function (r) {
        const en = String(r.en).trim();
        const k = en.toLowerCase();
        if (seen[k]) { bdup++; return; }
        seen[k] = 1;
        bank.words.push({ en: en, zh: String(r.zh || "").trim() });
        bn++;
      });
      addShots = []; addRows = []; addCur = 0;
      save();
      closeAddPanel();
      area = "bank";
      bankOpen = bank.id;
      render();
      toast("存进「" + bank.name + "」" + bn + " 个" + (bdup ? "，跳过 " + bdup + " 个重复" : "") + " —— 核对完再进单词表");
      return;
    }

    const have = {};
    WORDS.forEach(function (w) { have[String(w.en).toLowerCase()] = 1; });
    let n = 0, dup = 0;
    usable.forEach(function (r) {
      const en = String(r.en).trim();
      const key = en.toLowerCase();
      if (have[key]) { dup++; return; }
      have[key] = 1;
      st.custom.push({
        en: en, pos: "n.", zh: String(r.zh || "").trim() || en,
        phrase: "", cat: "自加", ipa: "", hom: ""
      });
      n++;
    });
    if (!n) {
      toast(dup ? "这些词库里都有了（" + dup + " 个）" : "一行能用的都没有");
      return;
    }
    addShots = [];
    addRows = [];
    addCur = 0;
    rebuildWordlist(); buildQueue(); save(); render();
    closeAddPanel();
    toast("加了 " + n + " 个词" + (dup ? "，跳过 " + dup + " 个重复的" : ""));
  }

  function renderAdd() {
    const p = document.getElementById("addPanel");
    if (!p) return;
    const cnt = document.getElementById("addCount");
    if (cnt) cnt.textContent = addShots.length + " 张图 · " + addRows.length + " 行";

    const strip = document.getElementById("addShots");
    if (strip) {
      strip.innerHTML = addShots.length
        ? addShots.map(function (s, i) {
          return '<button class="shot' + (i === addCur ? " on" : "") + (s.done ? " done" : "") + '" data-shot="' + i + '">'
            + '<img src="' + s.url + '" alt="">'
            + "<i>" + (s.done ? "已识别" : "待识别") + "</i></button>";
        }).join("")
        : '<div class="shot-empty">还没照片。点上面「拍一张」，或者从相册一次选好几张。</div>';
    }

    const prev = document.getElementById("addPreview");
    if (prev) {
      const s = addShots[addCur];
      prev.innerHTML = s
        ? '<img src="' + s.url + '" alt="" data-add="view" title="点开看大图">'
          + '<div class="prev-btns">'
          + '<button class="mini" data-add="rot" title="字是横着的就转一下">旋转 90°</button>'
          + '<button class="mini danger" data-add="drop">删掉这张</button>'
          + '<span class="hint">点图放大看</span>'
          + "</div>"
        : "";
    }

    const warn = document.getElementById("addWarn");
    if (warn) warn.style.display = addWarn ? "flex" : "none";

    const rows = document.getElementById("addRowList");
    if (rows) {
      rows.innerHTML = addRows.length
        ? addRows.map(function (r, i) {
          return '<div class="add-row"><span class="rn">' + (i + 1) + "</span>"
            + '<input data-r="' + i + '" data-k="en" value="' + esc(r.en) + '" placeholder="english" autocapitalize="off" autocorrect="off" spellcheck="false">'
            + '<input data-r="' + i + '" data-k="zh" value="' + esc(r.zh) + '" placeholder="中文">'
            + '<button class="del" data-add="del" data-i="' + i + '" title="删掉这一行">✕</button></div>';
        }).join("")
        : '<div class="shot-empty">识别出来的词会一行一行列在这儿，可以直接改；也可以点下面「+ 加一行」自己写。</div>';
    }

    const imp = document.getElementById("addImport");
    if (imp) imp.textContent = addRows.length ? "全部导入（" + addRows.length + " 行）" : "全部导入";

    const tg = document.getElementById("addTarget");
    if (tg) {
      let html = '<option value="custom">单词表（直接背）</option>';
      st.banks.forEach(function (b) { html += '<option value="' + b.id + '">词库：' + esc(b.name) + "</option>"; });
      html += '<option value="__new">+ 新建词库</option>';
      tg.innerHTML = html;
      tg.value = (addTarget === "custom" || addTarget === "__new" || bankById(addTarget)) ? addTarget : "custom";
    }
    const ocr = document.getElementById("ocrAll");
    if (ocr) {
      const left = addShots.filter(function (s) { return !s.done; }).length;
      ocr.disabled = addBusy || !left;
      ocr.textContent = addBusy ? "识别中…" : (left ? "识别印刷体（" + left + " 张）" : "识别印刷体");
    }
    const stEl = document.getElementById("addStatus");
    if (stEl && stEl.textContent !== addMsg) stEl.textContent = addMsg;
  }

  function initAddPanel() {
    if (document.getElementById("addPanel")) return;
    const el = document.createElement("div");
    el.className = "mask add";
    el.id = "addPanel";
    el.innerHTML =
      '<div class="add-sheet">'
      + '<div class="add-head"><b>拍照加词</b><span class="hint" id="addCount">0 张图 · 0 行</span>'
      + '<button class="x" id="addClose">✕</button></div>'
      + '<div class="add-actions">'
      + '<button class="mini primary" id="pickCam">📷 拍一张</button>'
      + '<button class="mini" id="pickGal">从相册选（可多张）</button>'
      + '<button class="mini" id="ocrAll">识别</button>'
      + "</div>"
      + '<div class="add-status hint" id="addStatus"></div>'
      + '<div class="add-warn" id="addWarn" style="display:none">'
      + "<span>这张认出来的不像单词 —— 手写笔记基本认不了，清空了自己打更快</span>"
      + '<button class="mini danger" data-add="clearocr">清空识别结果</button>'
      + "</div>"
      + '<div class="add-shots" id="addShots"></div>'
      + '<div class="add-preview" id="addPreview"></div>'
      + '<div class="add-list" id="addRowList"></div>'
      + '<div class="add-target-row"><span class="hint">导入到</span><select id="addTarget" class="add-target"></select></div>'
      + '<div class="add-foot">'
      + '<button class="mini" id="addRowBtn">+ 加一行</button>'
      + '<button class="mini primary" id="addImport">全部导入</button>'
      + "</div>"
      + "</div>"
      + '<div class="viewer" id="imgViewer">'
      + '<div class="viewer-scroll"><img id="viewerImg" alt=""><div class="crop-box" id="cropBox"></div></div>'
      + '<div class="viewer-bar">'
      + '<button class="mini" data-add="crop" id="cropBtn">裁剪</button>'
      + '<button class="mini primary" data-add="cropok" id="cropOk" style="display:none">用这块</button>'
      + '<button class="mini" data-add="cropcancel" id="cropCancel" style="display:none">取消裁剪</button>'
      + '<button class="mini" data-add="zoomout">−</button>'
      + '<span class="zoom-lv" id="zoomLv">1.0×</span>'
      + '<button class="mini" data-add="zoomin">+</button>'
      + '<button class="mini primary" data-add="viewclose">看完了</button>'
      + "</div></div>"
      + '<input type="file" id="pickCamIn" accept="image/*" capture="environment" hidden>'
      + '<input type="file" id="pickGalIn" accept="image/*" multiple hidden>';
    document.body.appendChild(el);

    el.addEventListener("click", function (e) {
      const t = e.target;
      if (t === el) { closeAddPanel(); return; }
      if (t.closest("#addClose")) { closeAddPanel(); return; }

      const shot = t.closest("[data-shot]");
      if (shot) { addCur = Number(shot.dataset.shot) || 0; renderAdd(); return; }

      const add = t.closest("[data-add]");
      if (add) {
        const k = add.dataset.add;
        if (k === "drop") {
          addShots.splice(addCur, 1);
          addCur = Math.max(0, Math.min(addCur, addShots.length - 1));
          renderAdd();
        } else if (k === "del") {
          addRows.splice(Number(add.dataset.i), 1);
          renderAdd();
        } else if (k === "rot") {
          rotateShot(addCur);
        } else if (k === "view") {
          openViewer();
        } else if (k === "crop") {
          enterCrop();
        } else if (k === "cropok") {
          applyCrop();
        } else if (k === "cropcancel") {
          exitCrop();
        } else if (k === "zoomin") {
          setZoom(viewerZoom + 0.5);
        } else if (k === "zoomout") {
          setZoom(viewerZoom - 0.5);
        } else if (k === "viewclose") {
          closeViewer();
        } else if (k === "clearocr") {
          addRows = [];
          addWarn = false;
          addShots.forEach(function (s) { s.done = false; });
          renderAdd();
          addStatus("清空了，照着照片一行一行打吧");
        }
        return;
      }

      if (t.closest("#pickCam")) { const i = document.getElementById("pickCamIn"); if (i) i.click(); return; }
      if (t.closest("#pickGal")) { const i = document.getElementById("pickGalIn"); if (i) i.click(); return; }
      if (t.closest("#ocrAll")) { ocrAll(); return; }
      if (t.closest("#addRowBtn")) { addRows.push({ en: "", zh: "" }); renderAdd(); return; }
      if (t.closest("#addImport")) { importAddRows(); return; }
    });

    el.addEventListener("input", function (e) {
      const t = e.target;
      if (!t || !t.dataset || t.dataset.r === undefined) return;
      const i = Number(t.dataset.r);
      if (!addRows[i]) return;
      addRows[i][t.dataset.k] = t.value;
    });

    /* 打词顺一点：英文回车跳中文，中文回车跳下一行英文，最后一行再回车就开一行新的 */
    el.addEventListener("keydown", function (e) {
      const t = e.target;
      if (!t || !t.dataset || t.dataset.r === undefined) return;
      if (e.key !== "Enter") return;
      e.preventDefault();
      const i = Number(t.dataset.r);
      const k = t.dataset.k;
      if (k === "en") {
        const zh = el.querySelector('input[data-r="' + i + '"][data-k="zh"]');
        if (zh) { zh.focus(); return; }
      }
      const next = el.querySelector('input[data-r="' + (i + 1) + '"][data-k="en"]');
      if (next) { next.focus(); return; }
      addRows.push({ en: "", zh: "" });
      renderAdd();
      window.setTimeout(function () {
        const last = el.querySelector('input[data-r="' + (addRows.length - 1) + '"][data-k="en"]');
        if (last) last.focus();
      }, 20);
    });

    const camIn = el.querySelector("#pickCamIn");
    const galIn = el.querySelector("#pickGalIn");
    if (camIn) camIn.addEventListener("change", function () { addFiles(camIn.files); camIn.value = ""; });
    if (galIn) galIn.addEventListener("change", function () { addFiles(galIn.files); galIn.value = ""; });
    const tg = el.querySelector("#addTarget");
    if (tg) tg.addEventListener("change", function () { addTarget = tg.value; });
    bindCrop();
    renderAdd();
  }

  function openAddPanel() {
    initAddPanel();
    const el = document.getElementById("addPanel");
    if (el) el.classList.add("show");
    renderAdd();
  }

  function closeAddPanel() {
    const el = document.getElementById("addPanel");
    if (el) el.classList.remove("show");
  }

  /* ══════════ 跟读 ══════════
     录一段 → 听回放 → 给个分。
     分只算节奏和音量（有没有开口、长短对不对），不是发音准不准 —— 准不准得自己听回放。
     录音只在这台手机上，不上传。 */
  let readWord = null;
  const rd = { stream: null, mr: null, chunks: [], url: "", t0: 0, timer: 0, peak: 0, sum: 0, n: 0, actx: null };

  function initReadPanel() {
    if (document.getElementById("readPanel")) return;
    const el = document.createElement("div");
    el.className = "mask add";
    el.id = "readPanel";
    el.innerHTML =
      '<div class="read-sheet">'
      + '<div class="add-head"><b>跟读</b><span class="hint" id="readHint">录一段，听听自己念得怎么样</span>'
      + '<button class="x" id="readClose">✕</button></div>'
      + '<div class="read-word">'
      + '<div class="rw-en" id="readEn"></div>'
      + '<div class="rw-ipa" id="readIpa"></div>'
      + '<div class="rw-zh" id="readZh"></div>'
      + "</div>"
      + '<div class="read-level"><i id="readLevel"></i></div>'
      + '<div class="read-btns">'
      + '<button class="btn primary" id="readStart">开始念</button>'
      + '<button class="btn" id="readStop" style="display:none">停</button>'
      + '<button class="btn" id="readPlay" disabled>听我念的</button>'
      + '<button class="btn" id="readAgain" style="display:none">再念一遍</button>'
      + "</div>"
      + '<div class="read-score" id="readScore"></div>'
      + "</div>";
    document.body.appendChild(el);

    el.addEventListener("click", function (e) {
      const t = e.target;
      if (t === el || t.closest("#readClose")) { closeReadPanel(); return; }
      if (t.closest("#readStart")) { startRead(); return; }
      if (t.closest("#readStop")) { stopRead(); return; }
      if (t.closest("#readPlay")) { playRead(); return; }
      if (t.closest("#readAgain")) { startRead(); return; }
    });
  }

  function openReadPanel(w) {
    if (!w) return;
    readWord = w;
    initReadPanel();
    const el = document.getElementById("readPanel");
    document.getElementById("readEn").textContent = w.en || "";
    document.getElementById("readIpa").textContent = w.ipa || "";
    document.getElementById("readZh").textContent = w.zh || "";
    document.getElementById("readHint").textContent = "念的时候把每个音节拉开，念完点「停」";
    document.getElementById("readScore").innerHTML = "";
    document.getElementById("readPlay").disabled = true;
    document.getElementById("readAgain").style.display = "none";
    document.getElementById("readStop").style.display = "none";
    document.getElementById("readStart").style.display = "";
    el.classList.add("show");
  }

  function closeReadPanel() {
    stopRead();
    if (rd.url) { try { URL.revokeObjectURL(rd.url); } catch (e) {} rd.url = ""; }
    const el = document.getElementById("readPanel");
    if (el) el.classList.remove("show");
  }

  function ensureMic() {
    return new Promise(function (res, rej) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        rej(new Error("这个 WebView 不给录音，装一次新版 App"));
        return;
      }
      let asked = false;
      const grant = function () {
        if (asked) return;
        asked = true;
        navigator.mediaDevices.getUserMedia({ audio: true }).then(res, function () {
          rej(new Error("麦克风没权限（系统里给这个 App 开一下）"));
        });
      };
      if (window.AndroidMic && typeof window.AndroidMic.ask === "function") {
        window.__micResult = function () { grant(); };
        try { window.AndroidMic.ask(); } catch (e) { grant(); }
        window.setTimeout(grant, 3000);   // 没回调也别卡死，直接试
      } else {
        grant();
      }
    });
  }

  function syllables(en) {
    const w = String(en || "").toLowerCase().replace(/[^a-z ]/g, " ");
    let n = 0;
    w.split(/\s+/).forEach(function (t) {
      if (!t) return;
      const g = t.replace(/e$/, "").match(/[aeiouy]+/g);
      n += Math.max(1, g ? g.length : 1);
    });
    return Math.max(1, n);
  }

  function startRead() {
    ensureMic().then(function (stream) {
      try {
        const mr = new MediaRecorder(stream);
        rd.stream = stream;
        rd.mr = mr;
        rd.chunks = [];
        rd.peak = 0; rd.sum = 0; rd.n = 0;
        mr.ondataavailable = function (e) { if (e.data && e.data.size) rd.chunks.push(e.data); };
        mr.onstop = function () { finishRead(); };
        mr.start();
        rd.t0 = now();
        startMeter(stream);
        document.getElementById("readStart").style.display = "none";
        document.getElementById("readStop").style.display = "";
        document.getElementById("readAgain").style.display = "none";
        document.getElementById("readHint").textContent = "在录… 念完点「停」";
        buzz("tap");
      } catch (e) {
        toast("录不起来：" + (e.message || e));
      }
    }).catch(function (e) {
      toast(String(e.message || e));
    });
  }

  function startMeter(stream) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      rd.actx = rd.actx || new AC();
      const src = rd.actx.createMediaStreamSource(stream);
      const an = rd.actx.createAnalyser();
      an.fftSize = 1024;
      src.connect(an);
      const buf = new Uint8Array(an.fftSize);
      if (rd.timer) window.clearInterval(rd.timer);
      rd.timer = window.setInterval(function () {
        an.getByteTimeDomainData(buf);
        let sum = 0, peak = 0;
        for (let i = 0; i < buf.length; i++) {
          const v = Math.abs(buf[i] - 128);
          sum += v;
          if (v > peak) peak = v;
        }
        const rms = sum / buf.length;
        rd.sum += rms; rd.n++;
        if (peak > rd.peak) rd.peak = peak;
        const lv = document.getElementById("readLevel");
        if (lv) lv.style.width = Math.min(100, rms * 3.2) + "%";
      }, 60);
    } catch (e) { /* 没电平也能录 */ }
  }

  function stopRead() {
    try {
      if (rd.mr && rd.mr.state !== "inactive") rd.mr.stop();
    } catch (e) {}
    if (rd.timer) { window.clearInterval(rd.timer); rd.timer = 0; }
    if (rd.stream) {
      try { rd.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
      rd.stream = null;
    }
    const lv = document.getElementById("readLevel");
    if (lv) lv.style.width = "0%";
  }

  function finishRead() {
    const dur = Math.max(0.3, (now() - rd.t0) / 1000);
    let type = "audio/webm";
    if (rd.chunks[0] && rd.chunks[0].type) type = rd.chunks[0].type;
    try {
      if (rd.url) URL.revokeObjectURL(rd.url);
      const blob = new Blob(rd.chunks, { type: type });
      rd.url = URL.createObjectURL(blob);
    } catch (e) { rd.url = ""; }
    const play = document.getElementById("readPlay");
    if (play) play.disabled = !rd.url;
    document.getElementById("readStop").style.display = "none";
    document.getElementById("readAgain").style.display = "";
    document.getElementById("readStart").style.display = "none";
    scoreRead(dur);
  }

  function playRead() {
    if (!rd.url) return;
    try {
      const a = new Audio(rd.url);
      a.play().catch(function () { toast("放不出来，再录一次试试"); });
    } catch (e) { toast("放不出来"); }
  }

  function scoreRead(dur) {
    const avg = rd.n ? (rd.sum / rd.n) : 0;
    const peak = rd.peak;
    const syl = syllables(readWord ? readWord.en : "");
    const target = 0.34 * syl;
    const ratio = dur / target;
    const timeScore = Math.max(0, 1 - Math.min(1, Math.abs(Math.log(ratio)) / Math.log(2.4)));
    const voice = Math.min(1, (avg / 11) * 0.65 + (peak / 85) * 0.35);
    let score = Math.round(100 * (0.42 * voice + 0.58 * timeScore));
    if (peak < 6) score = Math.min(score, 15);

    const tips = [];
    if (peak < 6) tips.push("几乎没出声，对着手机大声点");
    else if (voice < 0.35) tips.push("声音偏小");
    if (ratio < 0.5) tips.push("太快了，把音节拉开");
    else if (ratio > 1.9) tips.push("拖太长，按正常语速");
    if (!tips.length) tips.push("节奏和音量都还行，点「听我念的」自己再对一遍");

    const el = document.getElementById("readScore");
    if (el) {
      el.innerHTML =
        '<div class="rs-num">' + score + "<small>/100</small></div>"
        + '<div class="rs-tip">' + tips.map(esc).join(" · ") + "</div>"
        + '<div class="rs-note">这是节奏和有没有开口的分，不是发音准不准 —— 准不准靠自己听回放。</div>';
    }
    document.getElementById("readHint").textContent = "念完了 · " + dur.toFixed(1) + " 秒";
    if (score >= 80) buzz("ok"); else if (score < 40) buzz("no");
  }

  /* ══════════ 启动 ══════════ */
  let storageOK = true;
  try {
    localStorage.setItem(KEY + "__probe", "1");
    localStorage.removeItem(KEY + "__probe");
  } catch (e) { storageOK = false; }

  rebuildWordlist();
  if (!WORDS.length) {
    document.body.innerHTML = '<div class="done-card" style="margin:40px auto;max-width:520px"><div class="big">📄</div><h2>没读到词库</h2><p>words.js 和 index.html 要放在同一个文件夹里。</p></div>';
    return;
  }
  initSettings();
  applyTheme();
  applyRate();
  buildQueue();
  render();
  showSplash();
  if (!storageOK) {
    setTimeout(function () {
      toast("这个打开方式存不住进度，用浏览器打开这个文件就正常了");
    }, 800);
  }
  if (st.lastVersion !== APP_VERSION) {
    const upgraded = Object.keys(st.words || {}).length > 0;
    st.lastVersion = APP_VERSION;
    save();
    setTimeout(function () {
      toast(upgraded
        ? "已更新到 v" + APP_VERSION + "，⚙ 里能看这次改了什么"
        : "欢迎 · v" + APP_VERSION + "，⚙ 里有更新日志");
    }, storageOK ? 3600 : 5000);
  }

  /* 安卓壳子里：安静地看一眼有没有新版内容，有就提示一句，不自动换 */
  if (updHasApp()) {
    setTimeout(function () { refreshUpdLabels(); checkUpdate(true); }, 2200);
  }

  window.__se = {
    get st() { return st; }, rebuild: rebuildWordlist, checkUpdate: checkUpdate, applyUpdate: applyUpdate,
    pending: pendingUpdate, reset: function () { updPending = null; },
    version: APP_VERSION,
    theme: themeNow, setTheme: setTheme, sunTimes: sunTimes,
    get area() { return area; }, setArea: function (a) { area = a || "word"; render(); },
    splashOpen: function () { return !!splashEl; }, showSplash: showSplash, closeSplash: closeSplash,
    /* 拍照加词的测试口子：headless 里没法真开相机，就从这里塞图 */
    add: {
      open: openAddPanel, close: closeAddPanel,
      push: function (url) { addShots.push({ url: url, done: false }); addCur = addShots.length - 1; renderAdd(); },
      shots: function () { return addShots.length; },
      ocr: function () { ocrAll(); },
      rows: function () { return addRows.slice(); },
      setRows: function (rows) { addRows = (rows || []).slice(); renderAdd(); },
      importRows: importAddRows,
      busy: function () { return addBusy; }
    }
  };
})();

  </script>
</body>
